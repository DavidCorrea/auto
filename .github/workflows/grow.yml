name: Grow

on:
  schedule:
    # Runs every 5 minutes come from cron-job.org calling workflow_dispatch, because
    # GitHub's scheduler rarely fired for this repo. This hourly entry is only a backup.
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**"]

permissions:
  contents: read

concurrency:
  group: grow
  cancel-in-progress: false

jobs:
  grow:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - id: grow
        run: node scripts/grow.mjs
        env:
          # Defaults to OpenRouter's free models. Set MODEL_API_URL / MODEL variables
          # to use any other OpenAI-compatible endpoint.
          API_KEY: ${{ secrets.MODEL_API_KEY }}
          API_URL: ${{ vars.MODEL_API_URL }}
          MODEL: ${{ vars.MODEL }}

      - name: Commit
        env:
          SUMMARY: ${{ steps.grow.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book site
          git commit -m "$SUMMARY"
          # Another run or a hand-made commit can land on main while the model is thinking.
          git pull --rebase
          git push

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy here.
  deploy:
    needs: grow
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      # deploy-pages sometimes can't find the artifact uploaded seconds earlier
      # ("No artifacts named github-pages"); a short wait and one retry gets past it.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 15
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
