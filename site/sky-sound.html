<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Sound — A Life in Small Changes</title>
<style>
  html, body { margin: 0; min-height: 100vh; overflow: hidden; background: #0b0b1a; color: #eee; font-family: Georgia, serif; }
  #sky {
    position: fixed; inset: -30%; z-index: 0;
    background:
      radial-gradient(45% 45% at 20% 25%, hsl(calc(var(--hue) + 30) 90% 70%) 0%, transparent 70%),
      radial-gradient(50% 50% at 82% 18%, hsl(calc(var(--hue) + 120) 85% 72%) 0%, transparent 70%),
      radial-gradient(55% 55% at 50% 88%, hsl(calc(var(--hue) + 220) 85% 70%) 0%, transparent 72%),
      linear-gradient(160deg, hsl(var(--hue) 60% 55%), hsl(calc(var(--hue) + 60) 55% 45%));
    animation: drift 60s ease-in-out infinite alternate;
    transition: --hue 1.2s linear;
  }
  @property --hue { syntax: '<number>'; inherits: true; initial-value: 265; }
  @keyframes drift {
    from { transform: translate3d(-3%, -2%, 0) scale(1.04) rotate(-2deg); }
    to   { transform: translate3d(3%, 2%, 0) scale(1.12) rotate(3deg); }
  }
  @media (prefers-reduced-motion: reduce) { #sky { animation: none; } }
  main {
    position: relative; z-index: 1; max-width: 34rem;
    margin: 0 auto; padding: 3rem 1.5rem; text-align: center;
  }
  h1 { font-size: 1.6rem; letter-spacing: .02em; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
  p { line-height: 1.6; text-shadow: 0 1px 8px rgba(0,0,0,.55); }
  #toggle {
    margin-top: 1.5rem; padding: .6rem 1.2rem; font-size: 1rem; cursor: pointer;
    border: 1px solid rgba(255,255,255,.6); border-radius: 18px;
    background: rgba(0,0,0,.35); color: #fff; font-family: inherit;
  }
  #toggle:hover { background: rgba(0,0,0,.55); }
  #freq { margin-top: 1rem; font-size: .85rem; opacity: .85; letter-spacing: .05em; }
  a { color: #cfe0ff; }
</style>
</head>
<body>
<div id="sky" style="--hue:265;"></div>
<main>
  <h1>The sky, heard</h1>
  <p>Here the sky's hue drifts on its own, and a quiet tone follows it — a little higher as the color climbs.</p>
  <button id="toggle">▶ Start listening</button>
  <div id="freq">— Hz</div>
  <p style="margin-top:2rem;font-size:.8rem;opacity:.8"><a href="index.html">Back to the life</a></p>
</main>
<script>
(function () {
  var sky = document.getElementById('sky');
  var btn = document.getElementById('toggle');
  var freqOut = document.getElementById('freq');
  var hue = 265;
  var dir = 1;
  var ctx = null, osc = null, gain = null;

  function step() {
    hue = (hue + dir * 0.6 + 360) % 360;
    if (hue > 320 || hue < 200) dir *= -1;
    sky.style.setProperty('--hue', hue);
    freqOut.textContent = Math.round(200 + (hue / 360) * 600) + ' Hz';
    if (osc && ctx) {
      var f = 200 + (hue / 360) * 600;
      osc.frequency.setTargetAtTime(f, ctx.currentTime, 0.15);
    }
    requestAnimationFrame(step);
  }
  step();

  btn.addEventListener('click', function () {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { btn.textContent = 'Audio unsupported'; return; }
    if (!ctx) ctx = new AC();
    if (ctx.state === 'suspended') ctx.resume();
    if (!osc) {
      osc = ctx.createOscillator();
      gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 200 + (hue / 360) * 600;
      gain.gain.value = 0.0001;
      gain.gain.exponentialRampToValueAtTime(0.06, ctx.currentTime + 1.5);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      btn.textContent = '⏸ Stop listening';
    } else if (btn.dataset.on !== '0') {
      gain.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.1);
      btn.dataset.on = '0';
      btn.textContent = '▶ Start listening';
    } else {
      gain.gain.setTargetAtTime(0.06, ctx.currentTime, 0.2);
      btn.dataset.on = '1';
      btn.textContent = '⏸ Stop listening';
    }
    if (!btn.dataset.on) btn.dataset.on = '1';
  });
})();
</script>
</body>
</html>
