<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Waveform</title>
  <style>
    body{min-height:100vh;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;color:#333;font-family:system-ui}
    .waveform{width:80px;display:flex;flex-direction:column;gap:2px;align-items:center}
    .bar{width:6px;background:#0066cc;border-radius:4px;transition:height .15s ease}
    @keyframes pulse{0%{transform:scaleY(1)}50%{transform:scaleY(0.3)}100%{transform:scaleY(1)}}
    .pulse{animation:pulse 1s ease-in-out infinite}
  </style>
</head>
<body>
  <div class="waveform">
    <div class="bar pulse" style="height:24px"></div>
    <div class="bar pulse" style="height:18px"></div>
    <div class="bar pulse" style="height:30px"></div>
    <div class="bar pulse" style="height:12px"></div>
    <div class="bar pulse" style="height:26px"></div>
    <div class="bar pulse" style="height:20px"></div>
  </div>
  <p style="margin-top:1rem;color:#999;font-size:.8rem">Animated when narration speaks</p>
</body>
</html>
