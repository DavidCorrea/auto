<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Memory Thread — A Life in Small Changes</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 1rem; line-height: 1.6; }
    #thread { border: 1px solid #ddd; padding: 1rem; margin-top: 1rem; background: #fafafa; }
    .entry { margin-bottom: 0.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid #eee; opacity: 0; transform: translateY(6px); animation: entry-in 0.5s ease forwards; }
    .entry:hover { background: #f0f0f0; transform: translateY(-2px); transition: transform 0.2s ease, background 0.2s ease; }
    @keyframes entry-in { to { opacity: 1; transform: translateY(0); } }
    input { width: 100%; padding: 0.5rem; margin-top: 0.5rem; }
    button { padding: 0.5rem 1rem; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>Memory Thread</h1>
  <p>Your memory joins the thread that follows every visitor.</p>
  <div id="thread">
    <!-- entries injected by JS -->
  </div>
  <input id="new-entry" placeholder="Leave a small change...">
  <button id="add">Add</button>
  <script>
    const threadDiv = document.getElementById('thread');
    const stored = localStorage.getItem('memory-thread') || '';
    const entries = stored.split('|||').filter(e => e.trim());
    entries.forEach(text => {
      const div = document.createElement('div');
      div.className = 'entry';
      div.textContent = text;
      threadDiv.appendChild(div);
    });
    document.getElementById('add').addEventListener('click', () => {
      const input = document.getElementById('new-entry');
      const text = input.value.trim();
      if (!text) return;
      const div = document.createElement('div');
      div.className = 'entry';
      div.textContent = text;
      threadDiv.insertBefore(div, threadDiv.firstChild);
      let all = text + '|||' + stored;
      localStorage.setItem('memory-thread', all);
      input.value = '';
    });
  </script>
</body>
</html>
