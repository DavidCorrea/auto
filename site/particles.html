<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Particle Trail</title>
<style>
body{margin:0;min-height:100vh;background:#0a0a1e;color:#fff;font-family:sans-serif}
canvas{display:block}
nav{position:fixed;top:1rem;left:1rem}
nav a{color:#8ab4ff;text-decoration:none}
</style>
</head>
<body>
<nav><a href="index.html">← Back to timeline</a></nav>
<canvas id="particles" aria-label="Particle trail canvas"></canvas>
<script>
(function(){
  var c=document.getElementById('particles'),ctx=c.getContext('2d'),w,h,particles=[],mx=null,my=null;
  function r(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}
  window.onresize=r;r();
  for(var i=0;i<50;i++){particles.push({x:Math.random()*w,y:Math.random()*h,vx:0,vy:0,age:0,ma:20+Math.random()*30})}
  addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY})
  function update(){
    var tx=mx!==null?mx:w/2,ty=my!==null?my:h/2;
    particles.forEach(p=>{
      var dx=tx-p.x,dy=ty-p.y;
      p.vx+=(dx*0.01);p.vy+=(dy*0.01);
      p.vx*=0.98;p.vy*=0.98;
      p.x+=p.vx;p.y+=p.vy;
      p.age++;if(p.age>p.ma){p.x=Math.random()*w;p.y=Math.random()*h;p.age=0;p.ma=20+Math.random()*30;p.vx=(Math.random()-0.5)*2;p.vy=(Math.random()-0.5)*2}
    })
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle='rgba(138,180,255,0.3)';ctx.lineWidth=1;
    for(var i=0;i<particles.length;i++){
      for(var j=i+1;j<particles.length;j++){
        var dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y;
        if(dx*dx+dy*dy<3000){ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.stroke()}
      }
    }
    ctx.fillStyle='rgba(255,255,255,0.8)';
    particles.forEach(p=>{
      var a=1-p.age/p.ma;
      ctx.globalAlpha=a;
      ctx.beginPath();ctx.arc(p.x,p.y,2+a*3,0,Math.PI*2);ctx.fill();
    });
    ctx.globalAlpha=1;requestAnimationFrame(draw)
  }
  setInterval(update,16);draw()
})();
</script>
</body>
</html>
