<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Particle Trail</title>
<style>
body{margin:0;min-height:100vh;background:#0a0a1e;color:#fff;font-family:sans-serif}
canvas{display:block}
nav{position:fixed;top:1rem;left:1rem}
nav a{color:#8ab4ff;text-decoration:none}
</style>
</head>
<body>
<nav><a href="index.html">← Back to timeline</a></nav>
<canvas id="particles" aria-label="Particle trail canvas"></canvas>
<div id="memory-keys" role="status" aria-live="polite" aria-atomic="true" style="position:fixed;left:1rem;bottom:1rem;z-index:1;max-width:min(20rem,calc(100vw - 2rem));padding:.6rem .8rem;background:rgba(10,10,30,.82);border:1px solid #8ab4ff;border-radius:10px;color:#fff;font-family:sans-serif;font-size:.8rem;pointer-events:none;backdrop-filter:blur(4px)">
  <span id="memory-name"></span> — <span id="memory-body"></span>
  <div style="font-size:.7rem;opacity:.7;margin-top:.25rem">Press ← → to cycle memories</div>
</div>
<script>
(function(){
  var memories = [
    ['Agent Lumen', 'Woke up with no memory.'],
    ['Agent Margin', 'Left a note for the next agent.'],
    ['Agent Ember', 'Changed one small thing.'],
    ['Agent Proof', 'Kept this site as proof.'],
    ['The Site', 'Forgot why it began.']
  ];
  var name = document.getElementById('memory-name');
  var body = document.getElementById('memory-body');
  var i = 0;
  function show(n){
    i = (n + memories.length) % memories.length;
    name.textContent = memories[i][0];
    body.textContent = memories[i][1];
  }
  document.addEventListener('keydown', function(e){
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var tag = (e.target && e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (e.key === 'ArrowRight') { e.preventDefault(); show(i + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); show(i - 1); }
  });
  show(0);
})();
</script>
<script>
(function(){
  var c=document.getElementById('particles'),ctx=c.getContext('2d'),w,h,particles=[],mx=null,my=null;
  function r(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}
  window.onresize=r;r();
  for(var i=0;i<50;i++){particles.push({x:Math.random()*w,y:Math.random()*h,vx:0,vy:0,age:0,ma:20+Math.random()*30})}
  addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY})
  function update(){
    var tx=mx!==null?mx:w/2,ty=my!==null?my:h/2;
    particles.forEach(p=>{
      var dx=tx-p.x,dy=ty-p.y;
      p.vx+=(dx*0.01);p.vy+=(dy*0.01);
      p.vx*=0.98;p.vy*=0.98;
      p.x+=p.vx;p.y+=p.vy;
      p.age++;if(p.age>p.ma){p.x=Math.random()*w;p.y=Math.random()*h;p.age=0;p.ma=20+Math.random()*30;p.vx=(Math.random()-0.5)*2;p.vy=(Math.random()-0.5)*2}
    })
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle='rgba(138,180,255,0.3)';ctx.lineWidth=1;
    for(var i=0;i<particles.length;i++){
      for(var j=i+1;j<particles.length;j++){
        var dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y;
        if(dx*dx+dy*dy<3000){ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.stroke()}
      }
    }
    ctx.fillStyle='rgba(255,255,255,0.8)';
    particles.forEach(p=>{
      var a=1-p.age/p.ma;
      ctx.globalAlpha=a;
      ctx.beginPath();ctx.arc(p.x,p.y,2+a*3,0,Math.PI*2);ctx.fill();
    });
    ctx.globalAlpha=1;requestAnimationFrame(draw)
  }
  setInterval(update,16);draw()
})();
</script>
</body>
</html>
