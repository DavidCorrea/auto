<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sound‑Reactive Visuals</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; min-height: 100vh; background: #0a0a0a; color: #e0e0e0; font-family: system-ui, sans-serif; }
    #canvas { display: block; width: 100%; height: 100%; }
    #instructions { position: fixed; bottom: 2rem; left: 2rem; background: rgba(0,0,0,0.5); padding: 1rem; border-radius: .5rem; backdrop-filter: blur(4px); }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="instructions">Make a sound – the visual will react to your microphone input.</div>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const instructions = document.getElementById('instructions');
    let audioContext, analyser, dataArray, microphone;

    function init() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      });
      window.AudioContext = window.AudioContext || window.webkitAudioContext;
      audioContext = new AudioContext();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(stream => {
          microphone = audioContext.createMediaStreamSource(stream);
          microphone.connect(analyser);
          analyser.connect(audioContext.destination);
          instructions.textContent = 'Your sound is reactive – try speaking or making noise.';
          animate();
        })
        .catch(err => {
          instructions.textContent = 'Could not access microphone. Click again to try.';
          console.error(err);
        });
    }

    function animate() {
      requestAnimationFrame(animate);
      analyser.getByteFrequencyData(dataArray);
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      let width = 0;
      for (let i = 0; i < dataArray.length; i++) {
        let barHeight = dataArray[i] * 2;
        let hue = (i / dataArray.length) * 360;
        ctx.fillStyle = `hsl(${hue}, 70%, 50%)`;
        ctx.fillRect(width, canvas.height - barHeight, canvas.width / dataArray.length, barHeight);
        width += canvas.width / dataArray.length;
      }
    }

    let started = false;
    document.addEventListener('click', () => {
      if (!started) {
        started = true;
        if (audioContext.state === 'suspended') audioContext.resume();
        init();
      }
    });
  </script>
</body>
</html>
