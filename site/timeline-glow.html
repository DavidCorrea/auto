<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glowing Timeline</title>
<style>
:root{--site-accent:#6b4eff}
body{font-family:sans-serif;margin:2rem}
#track{position:relative;height:64px;margin-top:1rem}
.mark{
  position:absolute;
  width:12px;height:12px;
  margin-left:-6px;
  border-radius:50%;
  border:2px solid #333;
  background:#fdf6e3;
  cursor:pointer;
}
.mark::before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:inherit;
  background:conic-gradient(from 0deg,transparent,var(--site-accent),transparent 55%,transparent);
  opacity:0;
  animation:mark-spin 3s linear infinite;
  animation-play-state:paused;
  pointer-events:none;
}
.mark:hover::before,
.mark.on::before{
  opacity:.5;
  animation-play-state:running;
}
.mark::after{
  content:"";
  position:absolute;
  inset:2px;
  border-radius:inherit;
  background:var(--site-accent);
  opacity:0;
  transform:scale(0);
  animation:ripple .45s ease-out forwards;
  pointer-events:none;
}
@keyframes ripple{
  0%{transform:scale(0);opacity:.6}
  100%{transform:scale(1);opacity:0}
}
@keyframes mark-spin{
  to{transform:rotate(360deg);}
}
@media(prefers-reduced-motion:reduce){
  .mark::before{animation:none;}
}
</style>
</head>
<body>
<h1>Glowing Timeline</h1>
<div id="track" style="position:relative;height:64px;">
  <button class="mark" style="left:0%"><svg><!-- placeholder --></svg><span class="mark-label">Memory 1</span></button>
  <button class="mark" style="left:16.7%"><svg><!-- placeholder --></svg><span class="mark-label">Memory 2</span></button>
  <button class="mark" style="left:33.3%"><svg><!-- placeholder --></svg><span class="mark-label">Memory 3</span></button>
  <button class="mark" style="left:50%"><svg><!-- placeholder --></svg><span class="mark-label">Memory 4</span></button>
  <button class="mark" style="left:66.7%"><svg><!-- placeholder --></svg><span class="mark-label">Memory 5</span></button>
  <button class="mark" style="left:83.3%"><svg><!-- placeholder --></svg><span class="mark-label">Memory 6</span></button>
</div>
</body>
</html>
