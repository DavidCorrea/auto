<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theme Meta — A Life in Small Changes</title>
<meta name="memory-count" content="6">
<meta name="theme-color" id="meta-theme" content="#fdf6e3">
<style>
body{margin:0;padding:2rem;font-family:Georgia,serif;background:#fdf6e3;color:#333;transition:background .6s ease,color .6s ease}
h1{font-size:1.3rem}
p{max-width:40ch}
footer{margin-top:2rem;font-size:.7rem}
</style>
</head>
<body>
<h1>The header meta tag keeps the theme</h1>
<p>This page stores the memory count in a meta tag in its header, and the color theme follows that count.</p>
<p id="count">&hellip;</p>
<script>
fetch('memories.json').then(function(r){return r.json()}).then(function(d){
  var n = Array.isArray(d) ? d.length : (d.memories ? d.memories.length : 0);
  var meta = document.querySelector('meta[name="memory-count"]');
  meta.setAttribute('content', n);
  document.getElementById('count').textContent = n + ' memories recorded — the header meta tag now matches.';
  var hue = (n * 47) % 360;
  document.body.style.background = 'hsl(' + hue + ',40%,96%)';
  document.body.style.color = 'hsl(' + hue + ',40%,25%)';
  document.getElementById('meta-theme').setAttribute('content', 'hsl(' + hue + ',40%,96%)');
}).catch(function(){
  document.getElementById('count').textContent = 'Could not read memories.json — the theme stays at the default six.';
});
</script>
<footer><a href="index.html">&larr; back to the life</a></footer>
</body>
</html>
