<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mood Blend — A Life in Small Changes</title>
<style>
  body{margin:0;min-height:100vh;font-family:Georgia,'Times New Roman',serif;background:#f6e7d8;color:#2b2b2b;transition:background 1s ease,color 1s ease}
  header{padding:3rem 1rem 1rem;text-align:center}
  h1{font-size:1.4rem;letter-spacing:.04em;margin:.25rem 0}
  p.sub{margin:.25rem 0 0;font-size:.9rem;opacity:.8}
  main{max-width:34rem;margin:2rem auto;padding:0 1rem;display:grid;gap:1.25rem}
  .row{display:flex;gap:.75rem;align-items:center;justify-content:center;flex-wrap:wrap}
  select,button{font:inherit;padding:.4rem .6rem;border-radius:10px;border:1px solid #999;background:#fffdf6;color:inherit;cursor:pointer}
  input[type=range]{width:min(80vw,22rem);accent-color:#7b4b94}
  #swatches{display:flex;height:3.5rem;border-radius:12px;overflow:hidden;border:1px solid rgba(0,0,0,.15);box-shadow:0 4px 18px rgba(0,0,0,.12)}
  #swatches div{flex:1;transition:background .3s ease}
  #readout{text-align:center;font-size:.8rem;letter-spacing:.05em;opacity:.85;font-family:'Courier New',monospace}
  footer{padding:2rem;text-align:center;font-size:.85rem}
  a{color:inherit}
</style>
</head>
<body>
<header>
  <h1>Mood Blend</h1>
  <p class="sub">One small change: slide between two skies.</p>
</header>
<main>
  <div class="row">
    <label>From <select id="palA"></select></label>
    <label>To <select id="palB"></select></label>
  </div>
  <input id="blend" type="range" min="0" max="100" value="50" aria-label="Blend between the two palettes">
  <div id="swatches" aria-hidden="true"></div>
  <div id="readout"></div>
  <div class="row"><button id="shuffle" type="button">🎲 Surprise blend</button></div>
</main>
<footer><a href="index.html">← back to the life</a> · <a href="rooms.html">all rooms</a></footer>
<script>
(function(){
  var PALS={
    Dawn:['#ffd9a0','#f7a8b8','#c9a7eb'],
    Dusk:['#2b2d5c','#7b4b94','#e0638a'],
    Ice:['#dff3ff','#a8d8ea','#5b8fb9'],
    Ember:['#3b1d12','#a63d2f','#f2a65a'],
    Moss:['#e6f2d8','#8fbf7f','#3f6b4f'],
    Aurora:['#0b2b26','#1f7a5c','#9be7c4']
  };
  var names=Object.keys(PALS);
  var a=document.getElementById('palA'),b=document.getElementById('palB'),
      s=document.getElementById('blend'),sw=document.getElementById('swatches'),
      out=document.getElementById('readout');
  names.forEach(function(n){a.add(new Option(n,n));b.add(new Option(n,n))});
  a.value='Dawn';b.value='Dusk';
  for(var i=0;i<3;i++){sw.appendChild(document.createElement('div'))}
  function hx(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
  function mix(p,q,t){var A=hx(p),B=hx(q);return '#'+A.map(function(v,i){return Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')}).join('')}
  function lum(c){var r=hx(c);return .2126*r[0]+.7152*r[1]+.0722*r[2]}
  function render(){
    var t=s.value/100,A=PALS[a.value],B=PALS[b.value];
    var cols=A.map(function(c,i){return mix(c,B[i],t)});
    document.body.style.background='linear-gradient(135deg,'+cols.join(',')+')';
    document.body.style.color=lum(cols[1])>140?'#222':'#f4f1ea';
    [].forEach.call(sw.children,function(d,i){d.style.background=cols[i]});
    out.textContent=a.value+' → '+b.value+' · '+Math.round(t*100)+'% · '+cols.join(' ');
  }
  a.onchange=b.onchange=s.oninput=render;
  document.getElementById('shuffle').onclick=function(){
    a.value=names[Math.floor(Math.random()*names.length)];
    do{b.value=names[Math.floor(Math.random()*names.length)]}while(b.value===a.value);
    s.value=Math.floor(Math.random()*101);render();
  };
  render();
})();
</script>
</body>
</html>
