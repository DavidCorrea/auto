<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Sky</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #05060a; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c" aria-label="A generative sky that follows the current time of day"></canvas>
<a href="index.html" style="position:fixed;left:12px;top:10px;color:#fff;opacity:.55;font:14px Georgia,serif;text-decoration:none;z-index:2">&larr; back</a>
<div id="hud" style="position:fixed;right:12px;top:10px;text-align:right;color:#fff;opacity:.6;font:13px Georgia,serif;z-index:2;pointer-events:none">
  <div id="phase">—</div>
  <div style="font-size:11px;opacity:.7">click the sky to hear it</div>
</div>
<script>
(function () {
  var el = document.getElementById('phase');
  function label() {
    var h = new Date().getHours();
    var n = h < 5 ? 'Night' : h < 8 ? 'Dawn' : h < 12 ? 'Morning' : h < 17 ? 'Afternoon' : h < 20 ? 'Dusk' : 'Night';
    el.textContent = n;
  }
  label();
  setInterval(label, 30000);
  document.body.addEventListener('click', function (e) {
    if (e.target.tagName === 'A') return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!window.__skyCtx) window.__skyCtx = new AC();
      var ctx = window.__skyCtx;
      if (ctx.state === 'suspended') ctx.resume();
      var h = new Date().getHours();
      var base = (h < 5 || h >= 20) ? 196 : h < 12 ? 262 : 330;
      var x = Math.max(0, Math.min(1, e.clientX / innerWidth));
      var y = Math.max(0, Math.min(1, e.clientY / innerHeight));
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = base * (0.75 + y * 0.9) * (1 - x * 0.1);
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.09, ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.6);
      o.connect(g);
      g.connect(ctx.destination);
      o.start();
      o.stop(ctx.currentTime + 0.65);
    } catch (err) {}
  });
})();
</script>
<script>
(() => {
  const c = document.getElementById('c');
  const x = c.getContext('2d');
  let W, H;
  function rs() { W = c.width = innerWidth; H = c.height = innerHeight; }
  addEventListener('resize', rs); rs();

  const cl = (v, a, b) => Math.max(a, Math.min(b, v));
  const sm = (a, b, v) => { const t = cl((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const mx = (a, b, t) => a + (b - a) * t;

  function draw(t) {
    const d = new Date();
    const s = (d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds()) / 86400;
    const sun = Math.sin((s - 0.25) * Math.PI * 2);
    const dl = sm(-0.08, 0.28, sun);
    const gold = cl(1 - Math.abs(dl - 0.52) / 0.24, 0, 1) * 0.6;

    const r = mx(mx(6, 120, dl), 255, gold);
    const g = mx(mx(9, 180, dl), 160, gold);
    const b = mx(mx(20, 255, dl), 90, gold);

    const gr = x.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, `rgb(${r * 0.7 | 0},${g * 0.7 | 0},${b * 0.85 | 0})`);
    gr.addColorStop(1, `rgb(${r | 0},${g | 0},${b | 0})`);
    x.fillStyle = gr;
    x.fillRect(0, 0, W, H);

    if (dl < 0.9) {
      for (let i = 0; i < 80; i++) {
        const px = ((i * 97.13) % 997) / 997 * W;
        const py = ((i * 53.71) % 991) / 991 * H * 0.7;
        const tw = 0.55 + 0.45 * Math.sin(t * 0.001 + i * 1.7);
        x.fillStyle = `rgba(235,240,255,${(1 - dl) * 0.85 * tw})`;
        const sz = i % 5 ? 1 : 2;
        x.fillRect(px, py, sz, sz);
      }
    }

    let bx, by, br, cr, cg, cb;
    if (sun > -0.08) {
      const p = cl((s - 0.25) / 0.5, 0, 1);
      bx = mx(W * 0.08, W * 0.92, p);
      by = H * 0.82 - Math.sin(p * Math.PI) * H * 0.66;
      br = Math.min(W, H) * 0.045;
      cr = 255; cg = 236; cb = 180;
    } else {
      const nt = s < 0.25 ? s + 1 : s;
      const p = cl((nt - 0.75) / 0.5, 0, 1);
      bx = mx(W * 0.12, W * 0.88, p);
      by = H * 0.82 - Math.sin(p * Math.PI) * H * 0.6;
      br = Math.min(W, H) * 0.032;
      cr = 225; cg = 232; cb = 255;
    }

    const gl = x.createRadialGradient(bx, by, 0, bx, by, br * 5);
    gl.addColorStop(0, `rgba(${cr},${cg},${cb},0.85)`);
    gl.addColorStop(0.3, `rgba(${cr},${cg},${cb},0.16)`);
    gl.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = gl;
    x.beginPath();
    x.arc(bx, by, br * 5, 0, Math.PI * 2);
    x.fill();

    x.fillStyle = `rgba(${cr},${cg},${cb},0.95)`;
    x.beginPath();
    x.arc(bx, by, br, 0, Math.PI * 2);
    x.fill();
  }

  function loop(t) { draw(t); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
