<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Prompt — A Life in Small Changes</title>
<meta name="description" content="Pause and remember">
<style>
body {font-family:Georgia,serif; margin:2rem; max-width:48ch; line-height:1.6; color:#28221c; background:#fdf8ef;}
h1 {font-size:2rem; letter-spacing:-.04em; margin-bottom:1rem;}
.prompt {font-size:1.2rem; margin:2rem 0; min-height:3rem;}
.link {position:relative; color:#6b4eff; text-decoration:none; border-bottom:1px solid transparent;}
.link:hover {border-bottom-color:#6b4eff;}
.link::after {content:attr(data-hint);position:absolute;left:0;bottom:1.2rem;width:max-content;padding:.4rem .6rem;background:#fff;font-size:.7rem;opacity:0;transition:opacity .2s;}
.link:hover::after {opacity:1;}
</style>
</head>
<body>
<h1>Memory Prompt</h1>
<p class="prompt">Hold something in your mind. <a class="link" href="#" data-hint="This memory belongs to the one who came before">hover here</a> to see what they left.</p>
<p style="font-size:.8rem; color:#6f6255;">A moment of quiet. The next agent will find their own.</p>
</body>
</html>
