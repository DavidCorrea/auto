<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memory Candle — A Life in Small Changes</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;background:#1a1410;color:#f0e0c8;padding:1.5rem;overflow-x:hidden}
  .stage{position:relative;width:min-width:360px;max-width:440px}
  .border{position:absolute;inset:-14px;border-radius:18px;border:1px dashed rgba(240,224,200,.5);pointer-events:none}
  .border::before,.border::after{content:"";position:absolute;inset:-6px;border-radius:14px;border:1px solid rgba(240,224,200,.25)}
  .card{position:relative;border:1px solid #3a2a1a;border-radius:14px;padding:2rem 1.5rem 1.5rem;background:repeating-linear-gradient(180deg,#241a12,#241a12 2px,#20160f 2px,#20160f 4px);box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 0 0 6px #3a2a1a}
  .card::before{content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:60%;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,#c98a6b,transparent)}
  .wax{position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:34px;height:26px;border-radius:50% 50% 30% 30%/60% 60% 40% 40%;background:linear-gradient(180deg,#f7d354,#f2a65a 60%,#c97a3b);box-shadow:0 0 14px rgba(242,166,90,.7)}
  .wick{position:absolute;top:-24px;left:50%;width:2px;height:14px;background:#2a1a10;transform:translateX(-50%);transform-origin:bottom center}
  .flame{position:absolute;top:-40px;left:50%;width:14px;height:22px;border-radius:50% 50% 40% 40%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 35%,#fff7d6,#ffd24a 30%,#f2a65a 65%,#e94b3c 100%);filter:blur(.4px);transform:translateX(-50%);animation:flicker .9s ease-in-out infinite alternate}
  .flame::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:radial-gradient(circle,rgba(242,166,90,.35),transparent 70%);animation:glow 1.6s ease-in-out infinite alternate}
  @keyframes flicker{0%{transform:translateX(-50%) scale(1,.95)}25%{transform:translateX(-50%) scale(1.04,1.02)}50%{transform:translateX(-50%) scale(.97,1.06)}75%{transform:translateX(-50%) scale(1.02,.98)}100%{transform:translateX(-50%) scale(1,1)}}
  @keyframes glow{0%{opacity:.5}100%{opacity:.85}}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(240,224,200,0)}50%{box-shadow:0 0 0 10px rgba(240,224,200,0)}}
  .border{animation:breathe 4s ease-in-out infinite}
  h1{font-size:1.25rem;margin:0 0 .4rem;text-align:center;letter-spacing:.04em}
  p{font-size:.85rem;line-height:1.55;margin:0;text-align:center;color:#d8c4a0}
  .foot{margin-top:1rem;text-align:center;font-size:.65rem;color:#8a6a4a;letter-spacing:.1em;text-transform:uppercase}
  a{color:#c98a6b;text-decoration:none;border-bottom:1px dotted #5a3a22}
  a:hover{color:#f0e0c8}
  @media(max-width:420px){.card{padding:1.5rem 1rem}}
  @media(prefers-reduced-motion:reduce){.flame,.border,.flame::before{animation:none}}
</style>
</head>
<body>
  <div class="stage">
    <div class="border"></div>
    <div class="card">
      <div class="wax"></div>
      <div class="wick"></div>
      <div class="flame" aria-hidden="true"></div>
      <h1>Keep a Light On</h1>
      <p>A moment of holding, then letting go. The change is the memory of the pause.</p>
      <p class="foot"><a href="keep-a-light-on.html">Keep a Light On</a> · <a href="index.html">Home</a></p>
    </div>
  </div>
</body>
</html>
