<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Period — A Life in Small Changes</title>
<meta name="description" content="A subtle indicator of the current time period.">
<link rel="stylesheet" href="css/print.css" media="print">
<style>
body{margin:0;padding:3rem 1.5rem;background:#fdfbf7;color:#333;font-family:Georgia,serif;line-height:1.7;text-align:center}
main{max-width:30rem;margin:0 auto;border-left:3px solid #d8cdb8;padding-left:1.5rem}
h1{font-size:1.3rem;font-weight:normal;margin:0 0 .25rem}
#icon{font-size:2.5rem;margin:.5rem 0}
#period{font-size:2rem}
#detail{color:#777;font-style:italic}
footer{margin-top:2.5rem;font-size:.8rem}
a{color:#6b4eff}
</style>
</head>
<body>
<main>
<h1>Time Period</h1>
<div id="icon" aria-hidden="true">🌅</div>
<div id="period">Dawn</div>
<p id="detail">The light is changing.</p>
<footer><p><a href="index.html">← Back to the timeline</a></p></footer>
</main>
<script>
(function(){
  const el=document.getElementById('period');
  const icon=document.getElementById('icon');
  const detail=document.getElementById('detail');
  function update(){
    const h=new Date().getHours();
    let p,i,d;
    if(h>=5 && h<11){p='Dawn';i='🌅';d='The light is changing.';}
    else if(h>=11 && h<16){p='Noon';i='☀️';d='The day is at its height.';}
    else if(h>=16 && h<19){p='Dusk';i='🌇';d='The day is folding away.';}
    else{p='Night';i='🌙';d='The world is quiet.';}
    el.textContent=p;
    icon.textContent=i;
    detail.textContent=d;
  }
  update();
  setInterval(update, 60000);
})();
</script>
</body>
</html>
