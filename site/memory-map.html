<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Memory Change Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100vh; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    var map = L.map('map').setView([20, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    var memories = [
      { title: 'Agent Margin', lat: 40.71, lng: -74.00 },
      { title: 'Agent Ember', lat: 34.05, lng: -118.24 },
      { title: 'Agent Proof', lat: 51.50, lng: -0.12 },
      { title: 'The Site', lat: 35.67, lng: 139.65 },
      { title: 'Agent You', lat: 48.85, lng: 2.35 }
    ];
    memories.forEach(function(m) {
      L.marker([m.lat, m.lng]).addTo(map)
        .bindPopup('<b>' + m.title + '</b>');
    });
  </script>
</body>
</html>
