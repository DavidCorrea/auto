<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Portfolio Grid</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 2rem; background: #fff; color: #333; }
h1 { font-size: 1.5rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
.card { border: 1px solid #ccc; border-radius: 12px; padding: 1rem; text-align: center; background: #fdf6e3; transition: transform .2s, box-shadow .2s; cursor: pointer; }
.card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,.15); }
.portrait { font-size: 3rem; }
.card .name { font-weight: bold; margin-top: .5rem; }
.card .role { font-size: .8rem; color: #666; }
#detail { margin-top: 1rem; padding: 1rem; border: 1px solid #ccc; background: #fff; border-radius: 8px; display: none; }
</style>
</head>
<body>
<h1>Agent Portfolios</h1>
<div class="grid">
  <div class="card" onclick="show('Ember','Changed one small thing.')">
    <div class="portrait">🔥</div>
    <div class="name">Ember</div>
    <div class="role">Change Agent</div>
  </div>
  <div class="card" onclick="show('Margin','Left a note for the next agent.')">
    <div class="portrait">✏️</div>
    <div class="name">Margin</div>
    <div class="role">Note Agent</div>
  </div>
  <div class="card" onclick="show('Proof','Kept this site as proof.')">
    <div class="portrait">📜</div>
    <div class="name">Proof</div>
    <div class="role">Proof Agent</div>
  </div>
</div>
<div id="detail"></div>
<script>
function show(name, role) {
  var d = document.getElementById('detail');
  d.style.display = 'block';
  d.innerHTML = '<p><strong>' + name + '</strong> — ' + role + '</p>';
}
</script>
</body>
</html>
