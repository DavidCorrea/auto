<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sky Particles</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#000}
    #canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none}
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    (function(){
      var canvas = document.getElementById('canvas');
      var ctx = canvas.getContext('2d');
      var w, h;
      function resize(){ w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
      window.addEventListener('resize', resize);
      resize();
      var particles = [];
      var count = 60;
      for(var i=0;i<count;i++){
        particles.push({
          x: Math.random()*w,
          y: Math.random()*h,
          vx: (Math.random()-0.5)*0.4,
          vy: (Math.random()-0.5)*0.4,
          size: Math.random()*2+1,
          alpha: Math.random()*0.5+0.1
        });
      }
      var pointer = {x: -9999, y: -9999, on: false};
      var bursts = [];
      window.addEventListener('mousemove', function(e){ pointer.x = e.clientX; pointer.y = e.clientY; pointer.on = true; });
      window.addEventListener('mouseout', function(){ pointer.on = false; });
      window.addEventListener('click', function(e){ bursts.push({x: e.clientX, y: e.clientY, r: 0}); });
      var hint = document.createElement('div');
      hint.textContent = 'move to part the stars · click to ripple';
      hint.style.cssText = 'position:fixed;left:0;right:0;bottom:14px;text-align:center;font:11px/1 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.42);pointer-events:none';
      document.body.appendChild(hint);
      function draw(){
        var scrollTop = window.pageYOffset;
        var docHeight = document.documentElement.scrollHeight - window.innerHeight;
        var ratio = docHeight>0 ? scrollTop/docHeight : 0;
        ctx.clearRect(0,0,w,h);
        ctx.fillStyle = 'hsla(' + (265 + ratio*360) + ', 70%, 60%, 0.15)';
        particles.forEach(function(p){
          p.x += p.vx + ratio*0.2;
          p.y += p.vy + ratio*0.2;
          if(pointer.on){
            var dx = p.x - pointer.x, dy = p.y - pointer.y;
            var d = Math.sqrt(dx*dx + dy*dy);
            if(d < 110 && d > 0.5){
              var f = (1 - d/110) * 3.2;
              p.x += (dx/d) * f;
              p.y += (dy/d) * f;
            }
          }
          if(p.y > h){ p.y = -10; p.vy *= -0.5; }
          if(p.x < 0 || p.x > w){ p.vx *= -1; }
          ctx.globalAlpha = p.alpha;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
          ctx.fill();
        });
        for(var i = bursts.length - 1; i >= 0; i--){
          var b = bursts[i];
          b.r += 3.2;
          ctx.globalAlpha = Math.max(0, 1 - b.r/240) * 0.45;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
          ctx.stroke();
          if(b.r > 240) bursts.splice(i, 1);
        }
        ctx.globalAlpha = 1;
        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>
</body>
</html>
