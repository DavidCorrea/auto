  <script>
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'memories.json', false);
    xhr.send();
    var memoryData = JSON.parse(xhr.responseText);
    var memories = Array.isArray(memoryData) ? memoryData : memoryData.memories;
    var style = document.createElement('style');
    style.textContent = '.track{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:1rem;height:auto!important;border:0!important;border-bottom:2px solid var(--site-accent)!important;padding-bottom:.6rem;align-items:start}.mark{position:relative!important;left:auto!important;bottom:auto!important;margin:0!important;width:100%;height:auto!important;border:0!important;border-radius:12px!important;display:flex;flex-direction:column;align-items:center;justify-content:center}.mark svg{width:18px;height:18px}.mark-label{position:static!important;left:auto!important;bottom:auto!important;transform:none!important;white-space:normal;font-size:.6rem}#constellation{pointer-events:auto!important;cursor:pointer}';
    document.head.appendChild(style);
    var icons = memories.map(function (m) { return window.TimelineIcons[m[0]]; });
    document.addEventListener('click', function (e) {
      var target = e.target;
      if (!target || target.id !== 'constellation') return;
      var idx = ((window.__starIndex == null ? -1 : window.__starIndex) + 1) % memories.length;
      window.__starIndex = idx;
      if (window.show) window.show(idx);
    });
    var track = document.getElementById('track');
    var marks = [];
    memories.forEach(function(m, i) {
      var b = document.createElement('button');
      b.className = 'mark' + (i === 0 ? ' on' : '');
      b.style.left = (i * 100 / (memories.length - 1)) + '%';
      b.setAttribute('aria-label', m[1]);
      b.innerHTML = icons[i];
      var label = document.createElement('span');
      label.className = 'mark-label';
      label.textContent = m[1];
      label.style.left = '50%';
      label.style.transform = 'translateX(-50%)';
      b.appendChild(label);
      var tooltip = document.createElement('span');
      tooltip.className = 'mark-tooltip';
      tooltip.textContent = m[1];
      tooltip.style.cssText = 'position:absolute;bottom:100%;left:50%;transform:translateX(-50%) translateY(-8px);background:var(--site-mark-bg);border:1px solid var(--site-border);color:var(--site-text);padding:.3rem .5rem;border-radius:6px;font-size:.65rem;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s ease,transform .15s ease;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15)';
      b.appendChild(tooltip);
      b.addEventListener('mouseenter', function() { tooltip.style.opacity = '1'; tooltip.style.transform = 'translateX(-50%) translateY(-4px)'; });
      b.addEventListener('mouseleave', function() { tooltip.style.opacity = '0'; tooltip.style.transform = 'translateX(-50%) translateY(-8px)'; });
      b.style.cursor = 'pointer';
      b.title = 'Open this memory';
      b.addEventListener('click', function() {
        new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAABCxAgAEABAAZGF0YUgAAAA=').play();
        show(i);
        b.style.borderColor = 'var(--site-accent)';
        b.style.boxShadow = '0 0 12px var(--site-accent)';
      });
      track.appendChild(b);
      marks.push(b);
    });
    var frag = document.getElementById('fragment');
    var current = 0;
    var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches || document.documentElement.classList.contains('text-mode');
    if(!calm)marks.forEach(function(m,i){m.children[0].style.animation='halo 2.4s '+(i*0.4)+'s infinite'});
    if (!calm) frag.style.transition = 'opacity 0.28s ease';
    function show(i) {
      current = i;
      var title = document.getElementById('frag-title');
      var body = document.getElementById('frag-body');
      frag.style.boxShadow = '0 0 14px var(--site-accent)';
      setTimeout(function() { frag.style.boxShadow = ''; }, 400);
      marks.forEach(function(b, j) { b.className = 'mark' + (j === i ? ' on' : ''); });
      if(!calm)marks[i].animate([{transform:'scale(1.8)'},{transform:'scale(1)'}],{duration:280,easing:'ease-out'});
      if (calm) {
        title.textContent = memories[i][1];
        body.textContent = memories[i][2];
        return;
      }
      frag.style.opacity = '0';
      setTimeout(function () {
        title.textContent = memories[i][1];
        body.textContent = memories[i][2];
        frag.style.opacity = '1';
      }, 280);
    }
    show(0);
// subtle keyboard nudge: ArrowLeft / ArrowRight move through memories
document.addEventListener('keydown', function(e) {
  if(e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault();
    var next = current + (e.key === 'ArrowRight' ? 1 : -1);
    if (next < 0) next = memories.length - 1;
    if (next >= memories.length) next = 0;
    show(next);
  }
});
  var a=document.createElement('a');a.href='memory-submit.html';a.textContent='Share your memory';frag.appendChild(a);

  var counter = document.createElement('p');
  counter.id = 'mem-count';
  counter.setAttribute('aria-live', 'polite');
  counter.style.cssText = 'margin:.75rem 0 0;padding-top:.4rem;border-top:1px dashed var(--site-border);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--site-accent)';
  function syncCount() {
    counter.textContent = 'Memory ' + (current + 1) + ' of ' + memories.length + ' \u00b7 ' + memories[current][1];
  }
  syncCount();
  var titleEl = document.getElementById('frag-title');
  if (window.MutationObserver && titleEl) {
    new MutationObserver(syncCount).observe(titleEl, { childList: true, characterData: true, subtree: true });
  }
  frag.appendChild(counter);

  </script>
