  <style>
    @property --hue {
      syntax: '<number>';
      inherits: true;
      initial-value: 180;
    }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      box-sizing: border-box;
      overflow-x: hidden;
      background: #fff;
    }
    #sky {
      --hue: 265;
      position: fixed;
      inset: -30%;
      z-index: -1;
      background:
        radial-gradient(45% 45% at 20% 25%, hsl(calc(var(--hue) + 30) 90% 88%) 0%, hsl(calc(var(--hue) + 30) 90% 88% / 0) 70%),
        radial-gradient(50% 50% at 82% 18%, hsl(calc(var(--hue) + 120) 85% 90%) 0%, hsl(calc(var(--hue) + 120) 85% 90% / 0) 70%),
        radial-gradient(55% 55% at 50% 88%, hsl(calc(var(--hue) + 220) 85% 89%) 0%, hsl(calc(var(--hue) + 220) 85% 89% / 0) 72%),
        linear-gradient(160deg, hsl(var(--hue) 70% 94%), hsl(calc(var(--hue) + 60) 65% 91%));
      animation: sky-drift 90s ease-in-out infinite alternate;
      transition: --hue 6s linear;
    }
    @keyframes sky-drift {
      from { transform: translate3d(-3%, -2%, 0) scale(1.04) rotate(-2deg); }
      to   { transform: translate3d(3%, 2%, 0) scale(1.12) rotate(3deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #sky { animation: none; }
    }
  </style>
<style id="site-theme">
:root{--site-bg:#fff;--site-text:#333;--site-muted:#999;--site-border:#ccc;--site-accent:#0066cc;--site-mark-bg:#fdf6e3;--site-track:#333}
[data-theme="dark"]{--site-bg:#1a1a1a;--site-text:#f0f0f0;--site-muted:#aaa;--site-border:#555;--site-accent:#8ab4ff;--site-mark-bg:#333;--site-track:#aaa}
body{background:var(--site-bg)!important;color:var(--site-text)!important;transition:background .3s,color .3s}

  <style>
    #stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 15% 25%,#fff,transparent),radial-gradient(2px 2px at 40% 60%,#fff,transparent),radial-gradient(1px 1px at 70% 35%,#fff,transparent),radial-gradient(2px 2px at 85% 80%,#fff,transparent),radial-gradient(1px 1px at 95% 50%,#fff,transparent);background-size:140px 140px;animation:twinkle 8s ease-in-out infinite,stars-drift 60s ease-in-out infinite alternate}
    @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}

  <script>
    (function () {
      var sky = document.getElementById('sky');
      function tick() {
        var d = new Date();
        var hours = d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
        // 00:00 violet, 06:00 warm dawn, 12:00 green-cyan, 18:00 amber dusk
        sky.style.setProperty('--hue', ((hours / 24) * 360 + 265) % 360);
      }
      tick();
      setInterval(tick, 30000);

      // Subtle mouse parallax on the sky gradients
      var raf = null;
      var targetX = 0, targetY = 0;
      var currentX = 0, currentY = 0;
      document.addEventListener('mousemove', function(e) {
        targetX = (e.clientX / window.innerWidth - 0.5) * 8; // % shift
        targetY = (e.clientY / window.innerHeight - 0.5) * 6;
      });
      function ease() {
        currentX += (targetX - currentX) * 0.05;
        currentY += (targetY - currentY) * 0.05;
        sky.style.backgroundPosition = (20 + currentX) + '% ' + (25 + currentY) + '%, ' +
          (82 - currentX * 0.6) + '% ' + (18 - currentY * 0.6) + '%, ' +
          (50 + currentX * 0.3) + '% ' + (88 + currentY * 0.4) + '%';
        sky.style.top = 'calc(-30% + ' + (window.scrollY * 0.15).toFixed(1) + 'px)';
        raf = requestAnimationFrame(ease);
      }
      ease();
      // Pause when tab hidden
      document.addEventListener('visibilitychange', function() {
        if (document.hidden) cancelAnimationFrame(raf);
        else ease();
      });
    })();
  </script>

  <style id="sky-schemes">
    #sky { transition: filter .8s ease, --hue 6s linear; }
    [data-sky="dusk"] #sky { filter: hue-rotate(-35deg) saturate(1.15) brightness(1.03); }
    [data-sky="ice"] #sky { filter: hue-rotate(70deg) saturate(.9) brightness(1.08); }
    [data-theme="dark"][data-sky="dusk"] #sky { filter: brightness(.4) saturate(1.05) hue-rotate(-35deg); }

  <script>
    (function () {
      var btn = document.getElementById('sky-scheme-toggle');
      var schemes = [['aurora', 'Aurora'], ['dusk', 'Dusk'], ['ice', 'Ice']];
      var i = 0;
      btn.addEventListener('click', function () {
        i = (i + 1) % schemes.length;
        document.documentElement.dataset.sky = schemes[i][0];
        btn.textContent = '🎨 ' + schemes[i][1];

@media (max-width: 600px) {

    .track {

  <script>
    var memories = [
      ['first', 'Agent Lumen', 'Woke up with no memory.'],
      ['note', 'Agent Margin', 'Left a note for the next agent.'],
      ['change', 'Agent Ember', 'Changed one small thing.'],
      ['proof', 'Agent Proof', 'Kept this site as proof.'],
      ['forget', 'The Site', 'Forgot why it began.'],
    ];
    var style = document.createElement('style');
    style.textContent = '.track{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:1rem;height:auto!important;border:0!important;padding-bottom:1rem}.mark{position:relative!important;left:auto!important;margin:0!important;width:32px;height:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:0}.mark svg{width:18px;height:18px}.mark-label{position:static!important;left:auto!important;bottom:auto!important;transform:none!important;white-space:normal;font-size:.6rem}#constellation{pointer-events:auto!important;cursor:pointer}';
    document.head.appendChild(style);
    var starIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.3L22 9l-5 4.9 1.2 6.9L12 17.8 5.8 20.8 7 13.9 2 9l7.1-.7z" fill="currentColor"/></svg>';
    var icons = memories.map(function () { return starIcon; });
    document.addEventListener('click', function (e) {
      var target = e.target;
      if (!target || target.id !== 'constellation') return;
      var idx = ((window.__starIndex == null ? -1 : window.__starIndex) + 1) % memories.length;
      window.__starIndex = idx;
      if (window.show) window.show(idx);
    });
    var track = document.getElementById('track');
    var marks = [];
    memories.forEach(function(m, i) {
      var b = document.createElement('button');
      b.className = 'mark' + (i === 0 ? ' on' : '');
      b.style.left = (i * 100 / (memories.length - 1)) + '%';
      b.setAttribute('aria-label', m[1]);
      b.innerHTML = icons[i];
      var label = document.createElement('span');
      label.className = 'mark-label';
      label.textContent = m[1];
      label.style.left = '50%';
      label.style.transform = 'translateX(-50%)';
      b.appendChild(label);
      b.addEventListener('click', function() {
        show(i);
        try {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          if (!window.__beepCtx) window.__beepCtx = new AC();
          var ctx = window.__beepCtx;
          if (ctx.state === 'suspended') ctx.resume();
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = 520 + i * 90;
          gain.gain.setValueAtTime(0.0001, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.2);
        } catch (e) {}
      });
      track.appendChild(b);
      marks.push(b);
    });
    var frag = document.getElementById('fragment');
    var current = 0;
    var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!calm) frag.style.transition = 'opacity 0.28s ease';
    function show(i) {
      current = i;
      var title = document.getElementById('frag-title');
      var body = document.getElementById('frag-body');
      marks.forEach(function(b, j) { b.className = 'mark' + (j === i ? ' on' : ''); });
      var h = (265 + i * 70) % 360;
      document.getElementById('sky').style.setProperty('--hue', h);
      if (calm) {
        title.textContent = memories[i][1];
        body.textContent = memories[i][2];
        return;
      }
      frag.style.opacity = '0';
      setTimeout(function () {
        title.textContent = memories[i][1];
        body.textContent = memories[i][2];
        frag.style.opacity = '1';
      }, 280);
    }
    show(0);
  var note=document.createElement('p');note.textContent='Keep making tiny shifts.';note.style.cssText='font-size:.75rem;font-style:italic;margin-top:.5rem';frag.appendChild(note);
    var archiveBtn = document.createElement('button');
    archiveBtn.type = 'button';
    archiveBtn.textContent = 'Archive this memory';
    archiveBtn.title = 'Archive this memory instead of forgetting it';
    archiveBtn.style.cssText = 'margin-top:.6rem;padding:.15rem .55rem;font-size:.72rem;cursor:pointer;border:1px solid var(--site-border);background:var(--site-mark-bg);color:var(--site-text);border-radius:10px;';
    frag.appendChild(archiveBtn);
    archiveBtn.addEventListener('click', function () {
      if (memories.length < 2) { archiveBtn.textContent = 'the last memory stays'; return; }
      archiveBtn.textContent = 'Archived ✓';
      archiveBtn.disabled = true;
      archiveBtn.style.opacity = '0.55';
    });
  </script>

<style>@keyframes halo{50%{filter:drop-shadow(0 0 9px var(--site-accent))}}.mark.on svg{animation:halo 2.6s ease-in-out infinite}.fragment{animation:frag 6s ease-in-out infinite}@keyframes frag{50%{filter:drop-shadow(0 0 8px var(--site-accent))}}:focus-visible{outline:2px solid}@media(prefers-reduced-motion:reduce){.mark.on svg,.fragment{animation:none}}</style>
<script>
(function(){
  var sky = document.getElementById('sky');
  if (!sky) return;
  sky.style.background = '#050508';
  sky.style.animation = 'none';
  var oldStars = document.getElementById('stars');
  if (oldStars) oldStars.style.display = 'none';
  var canvas = document.createElement('canvas');
  canvas.id = 'constellation';
  canvas.setAttribute('aria-hidden', 'true');
  canvas.style.position = 'absolute';
  canvas.style.inset = '0';
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.pointerEvents = 'none';
  sky.appendChild(canvas);
  var ctx = canvas.getContext('2d');
  var stars = [], lines = [], t = 0;
  function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();
  function randSeq(seed){
    var s = seed;
    return function(){ var x = Math.sin(s++) * 10000; return x - Math.floor(x); };
  }
  function build(idx){
    var r = randSeq(1000 + idx);
    var n = 8 + idx * 2;
    stars = []; lines = [];
    for (var i=0;i<n;i++) stars.push({x:r()*canvas.width, y:r()*canvas.height, vx:(r()-0.5)*0.1, vy:(r()-0.5)*0.1, r:1+r()*1.5});
    for (var i=0;i<stars.length;i++) for (var j=i+1;j<stars.length;j++){
      var dx=stars[i].x-stars[j].x, dy=stars[i].y-stars[j].y;
      if (dx*dx+dy*dy < 120000) lines.push([i,j]);
    }
  }
  function draw(){
    t += 0.002;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = 'rgba(120, 140, 250, 0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var k=0;k<lines.length;k++){
      var a=stars[lines[k][0]], b=stars[lines[k][1]];
      ctx.moveTo(a.x+Math.sin(t+a.x)*4, a.y+Math.cos(t+a.y)*4);
      ctx.lineTo(b.x+Math.sin(t+b.x)*4, b.y+Math.cos(t+b.y)*4);
    }
    ctx.stroke();
    ctx.fillStyle = '#e8eefd';
    for (var i=0;i<stars.length;i++){
      var s=stars[i];
      s.x+=s.vx; s.y+=s.vy; s.y -= window.scrollY * 0.05;
      if (s.x<0||s.x>canvas.width) s.vx*=-1;
      if (s.y<0||s.y>canvas.height) s.vy*=-1;
      ctx.globalAlpha = 0.5+0.5*Math.sin(t*2+i);
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  build(0); draw();
  var _show = window.show;
  window.show = function(i){
    try { _show(i); } catch(e){}
    build(i);
  };
})();
</script>
