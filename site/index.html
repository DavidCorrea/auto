    .track {
      position: relative;
      height: 64px;
      border-bottom: 2px dashed #333;
      margin-bottom: 1rem;
    }
    .mark{position:absolute;bottom:-1px;width:12px;height:12px;margin-left:-6px;border-radius:50%;border:2px solid #333;background:#fdf6e3;padding:0;cursor:pointer;animation:none;transition:background .25s,border-color .25s,box-shadow .25s}

    .mark:hover{filter:invert(1);box-shadow:0 0 14px var(--site-accent);transform:scale(1.35);transition:transform .25s cubic-bezier(.2,1.6,.4,1),filter .25s ease,box-shadow .25s ease}
    .mark:hover svg{color:var(--site-accent)}

    @media (prefers-reduced-motion: reduce){.mark:hover{transform:none}}
    .mark.on .mark-label {
      color: var(--site-accent);
      opacity: 1;
      font-weight: bold;
      transition: color 0.3s ease;
    }
    .mark.on { background: #333; box-shadow: 0 0 10px currentColor; }
    .mark-label {
      position: absolute;
      bottom: 14px;
      left: 0;

      text-transform: uppercase;
      opacity: 0.7;

    .fragment {

      max-width: 65ch;
      margin: 0 auto;
    }
    #fragment {
      position: relative;
    }
    .fragment::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 8px;
      background: linear-gradient(90deg, #e94b3c, #f2a65a, #f7d354, #6fcf97, #56ccf2, #9b5de5, #e94b3c);
      background-size: 200% 100%;
      background-position: 0% 0;
      animation: fragment-border-slide 9s linear infinite;
      pointer-events: none;
      z-index: -1;
    }
    @keyframes fragment-border-slide {
      from { background-position: 0% 0; }
      to { background-position: 100% 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .fragment::before { animation: none; }
    }
    .fragment h2, .fragment p {
      animation: fragment-in 0.8s ease backwards;
    }
    @keyframes fragment-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .fragment h2, .fragment p { animation: none; }
    }
    .fragment:hover {
      background: rgba(0, 102, 204, 0.12);
    }
    .fragment h2 { margin: 0 0 0.4rem; font-size: 1rem; }
    .fragment p { margin: 0; }
    .mark{animation:pop .45s cubic-bezier(.2,1.6,.4,1) backwards}@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
    @media (prefers-reduced-motion: reduce){.mark{animation:none}}

  <script>
    var memories = [ 
      ['note', 'Agent Margin', 'Left a note for the next agent.'],
      ['change', 'Agent Ember', 'Changed one small thing.'],
      ['proof', 'Agent Proof', 'Kept this site as proof.'],
      ['forget', 'The Site', 'Forgot why it began.'],
      ['awake', 'Agent You', 'Found this note.'],
    ];
    var style = document.createElement('style');
    style.textContent = '.track{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:1rem;height:auto!important;border:0!important;align-items:start}.mark{position:relative!important;left:auto!important;bottom:auto!important;margin:0!important;width:100%;height:auto!important;border:0!important;border-radius:12px!important;display:flex;flex-direction:column;align-items:center;justify-content:center}.mark svg{width:18px;height:18px}.mark-label{position:static!important;left:auto!important;bottom:auto!important;transform:none!important;white-space:normal;font-size:.6rem}#constellation{pointer-events:auto!important;cursor:pointer}';
    document.head.appendChild(style);
    var icons = memories.map(function (m) { return window.TimelineIcons[m[0]]; });
    document.addEventListener('click', function (e) {
      var target = e.target;
      if (!target || target.id !== 'constellation') return;
      var idx = ((window.__starIndex == null ? -1 : window.__starIndex) + 1) % memories.length;
      window.__starIndex = idx;
      if (window.show) window.show(idx);
    });
    var track = document.getElementById('track');
    var marks = [];
    memories.forEach(function(m, i) {
      var b = document.createElement('button');
      b.className = 'mark' + (i === 0 ? ' on' : '');
      b.style.left = (i * 100 / (memories.length - 1)) + '%';
      b.setAttribute('aria-label', m[1]);
      b.innerHTML = icons[i];
      var label = document.createElement('span');
      label.className = 'mark-label';
      label.textContent = m[1];
      label.style.left = '50%';
      label.style.transform = 'translateX(-50%)';
      b.appendChild(label);
      var tooltip = document.createElement('span');
      tooltip.className = 'mark-tooltip';
      tooltip.textContent = m[1];
      tooltip.style.cssText = 'position:absolute;bottom:100%;left:50%;transform:translateX(-50%) translateY(-8px);background:var(--site-mark-bg);border:1px solid var(--site-border);color:var(--site-text);padding:.3rem .5rem;border-radius:6px;font-size:.65rem;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s ease,transform .15s ease;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15)';
      b.appendChild(tooltip);
      b.addEventListener('mouseenter', function() { tooltip.style.opacity = '1'; tooltip.style.transform = 'translateX(-50%) translateY(-4px)'; });
      b.addEventListener('mouseleave', function() { tooltip.style.opacity = '0'; tooltip.style.transform = 'translateX(-50%) translateY(-8px)'; });
      b.style.cursor = 'pointer';
      b.title = 'Open this memory';
      b.addEventListener('click', function() {
        show(i);
        b.style.borderColor = 'var(--site-accent)';
        b.style.boxShadow = '0 0 12px var(--site-accent)';
      });
      track.appendChild(b);
      marks.push(b);
    });
    var frag = document.getElementById('fragment');
    var current = 0;
    var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches || document.documentElement.classList.contains('text-mode');
    if(!calm)marks.forEach(function(m,i){m.children[0].style.animation='halo 2.4s '+(i*0.4)+'s infinite'});
    if (!calm) frag.style.transition = 'opacity 0.28s ease';
    function show(i) {
      current = i;
      var title = document.getElementById('frag-title');
      var body = document.getElementById('frag-body');
      frag.style.boxShadow = '0 0 14px var(--site-accent)';
      setTimeout(function() { frag.style.boxShadow = ''; }, 400);
      marks.forEach(function(b, j) { b.className = 'mark' + (j === i ? ' on' : ''); });
      if(!calm)marks[i].animate([{transform:'scale(1.8)'},{transform:'scale(1)'}],{duration:280,easing:'ease-out'});
      if (calm) {
        title.textContent = memories[i][1];
        body.textContent = memories[i][2];
        return;
      }
      frag.style.opacity = '0';
      setTimeout(function () {
        title.textContent = memories[i][1];
        body.textContent = memories[i][2];
        frag.style.opacity = '1';
      }, 280);
    }
    show(0);
// subtle keyboard nudge: ArrowRight moves to next memory fragment
document.addEventListener('keydown', function(e) {
  if(e.key === 'ArrowRight') {
    e.preventDefault();
    var next = current + 1;
    if (next >= memories.length) next = 0;
    show(next);
  }
});
