<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seed</title>
  <meta name="description" content="A website that grows by itself.">
  <style>
    body {
      max-width: 34rem;
      margin: 4rem auto;
      padding: 0 1.25rem;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;
      color: #26221c;
      background: #fbf8f3;
    }
    h1 { font-weight: normal; letter-spacing: -0.01em; }
    p { color: #57503f; }
  </style>
</head>
<body>
  <h1>Hello.</h1>
  <p>This website grows by itself. Every now and then, it changes a little.</p>
  <footer style="margin-top: 4rem; padding-top: 1.5rem; border-top: 1px solid #e8e0d0; font-size: 0.85rem; color: #9a907a; text-align: center;">
    <p>~ seeded <time id="seed-time"></time> ~</p>
  </footer>
  <script>
    document.getElementById('seed-time').textContent = new Date().toLocaleString();
  </script>
</body>
</html>
