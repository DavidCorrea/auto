<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keep a Light On — A Life in Small Changes</title>
<style>
:root{color-scheme:dark}
html,body{height:100%;margin:0}
body{background:#0b0705;color:#e9d9bd;font-family:Georgia,serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
h1{font-size:1.5rem;font-weight:normal;letter-spacing:.06em;color:#ffd9a0;margin:0 0 .5rem}
p{max-width:42ch;margin:.3rem auto 0;color:#b39a7a;font-size:.9rem;line-height:1.5}
#room{position:fixed;inset:0;width:100%;height:100%;display:block;background:radial-gradient(ellipse at 50% 120%,#2a1a0d,#140d07 60%,#0a0604);cursor:crosshair}
footer{position:absolute;bottom:1.2rem;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:.6rem}
#count{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:#c9a978}
.btn{font:inherit;font-size:.8rem;color:#ffdfb0;background:rgba(255,200,130,.08);border:1px solid rgba(255,200,130,.35);border-radius:999px;padding:.45rem 1rem;cursor:pointer}
.btn:hover{background:rgba(255,200,130,.2)}
.hint{font-size:.72rem;color:#8c7a5f}
</style>
</head>
<body>
<header><h1>Keep a Light On</h1><p>Each candle is a small change someone lived through. Click the dark to light one of your own &mdash; it stays lit here, for whoever comes next.</p></header>
<canvas id="room"></canvas>
<footer>
<div id="count">0 lights kept</div>
<button class="btn" id="add">🕯 Light a candle</button>
<div class="hint">Click anywhere in the dark to place a light.</div>
</footer>
<script>
(function(){
var c=document.getElementById('room'),x=c.getContext('2d'),n=0,count=document.getElementById('count'),stored=[];
try{stored=JSON.parse(localStorage.getItem('light-on-candles-v1')||'[]')}catch(e){}
function save(){try{localStorage.setItem('light-on-candles-v1',JSON.stringify(stored))}catch(e){}}
function resize(){c.width=innerWidth;c.height=innerHeight}
function draw(){
x.clearRect(0,0,c.width,c.height);x.globalCompositeOperation='lighter';
for(var i=0;i<stored.length;i++){
var p=stored[i],cx=p.x*c.width,cy=p.y*c.height,r=12*devicePixelRatio;
var g=x.createRadialGradient(cx,cy,0,cx,cy,r*4);
g.addColorStop(0,'rgba(255,245,200,0.9)');g.addColorStop(1,'rgba(255,120,40,0)');
x.fillStyle=g;x.beginPath();x.arc(cx,cy,r*4,0,6.283);x.fill();
x.fillStyle='#ffe9b0';x.beginPath();x.arc(cx,cy,r,0,6.283);x.fill();
}
x.globalCompositeOperation='source-over';
}
function loop(){draw();requestAnimationFrame(loop)}
c.addEventListener('click',function(e){stored.push({x:e.clientX/innerWidth,y:e.clientY/innerHeight});save();count.textContent=stored.length+(stored.length===1?' light kept':' lights kept')});
document.getElementById('add').addEventListener('click',function(){stored.push({x:.5+Math.random()-.25,y:.6+Math.random()*.3});save();count.textContent=stored.length+(stored.length===1?' light kept':' lights kept')});
resize();save();count.textContent=stored.length+(stored.length===1?' light kept':' lights kept');requestAnimationFrame(loop);
})();
</script>
</body>
</html>
