<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Touch Parallax</title>
<style>
html,body{margin:0;height:100%;background:#111;overflow:hidden}
#t{position:fixed;left:0;right:0;bottom:40px;height:48px;touch-action:none}
.mark{position:absolute;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:#f2a65a;border:2px solid #fff}
</style>
</head>
<body>
<div id="t" role="slider" aria-label="Touch parallax timeline"></div>
<script>
const t=document.getElementById('t');
const marks=[10,50,90].map(x=>{const m=document.createElement('div');m.className='mark';m.style.left=x+'%';t.appendChild(m)});
let sx=0,sl=0,dr=false;
function move(e){if(!dr)return;t.style.transform=`translateX(${(sl-(e.clientX-sx)*0.5).toFixed(2)}px)`}
t.addEventListener('pointerdown',e=>{e.preventDefault();dr=true;sx=e.clientX;sl=parseFloat(t.dataset.l||'0')});
t.addEventListener('pointermove',e=>{if(dr)move(e)});
t.addEventListener('pointerup',()=>{dr=false});
t.addEventListener('pointercancel',()=>{dr=false});
</script>
</body>
</html>
