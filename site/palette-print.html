<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Color Palette — A Life in Small Changes</title>
  <style>
    body { 
      min-height: 100vh; 
      margin: 0; 
      padding: 2rem; 
      box-sizing: border-box; 
      background: #fff; 
      color: #333; 
      font-family: sans-serif;
    }
    .palette { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 1rem; 
      margin: 2rem 0; 
    }
    .swatch { 
      width: 60px; 
      height: 60px; 
      background: #fdf6e3; 
      border: 2px solid #ccc; 
      border-radius: 8px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 0.8rem; 
      color: #333;
    }
    .label { 
      margin-left: 0.5rem; 
      font-size: 0.7rem; 
    }
    @media print {
      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <h1>Color Palette</h1>
  <div class="palette" id="palette">
    <!-- swatches generated by script -->
  </div>
  <button id="print-btn" style="margin:2rem auto; padding:.5rem 1rem; font-size:.9rem; border:1px solid #ccc; background:#0066cc; color:#fff; border-radius:4px; cursor:pointer;">Print</button>

  <script>
    const colors = [
      { name: 'Background', hex: '#fff' },
      { name: 'Text', hex: '#333' },
      { name: 'Muted', hex: '#999' },
      { name: 'Border', hex: '#ccc' },
      { name: 'Accent', hex: '#0066cc' },
      { name: 'Mark BG', hex: '#fdf6e3' },
      { name: 'Track', hex: '#333' }
    ];
    const paletteDiv = document.getElementById('palette');
    function textOn(hex) {
      const n = hex.replace('#', '');
      const r = parseInt(n.substr(0, 2), 16), g = parseInt(n.substr(2, 2), 16), b = parseInt(n.substr(4, 2), 16);
      return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#333' : '#fff';
    }
    colors.forEach(c => {
      const swatch = document.createElement('div');
      swatch.className = 'swatch';
      swatch.style.background = c.hex;
      swatch.title = 'Copy ' + c.hex;
      swatch.style.cursor = 'pointer';
      const label = document.createElement('span');
      label.className = 'label';
      label.style.color = textOn(c.hex);
      label.textContent = c.name + ' ' + c.hex;
      swatch.appendChild(label);
      swatch.addEventListener('click', () => {
        const reset = () => { label.textContent = c.name + ' ' + c.hex; };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(c.hex).then(() => {
            label.textContent = 'Copied ' + c.hex;
            setTimeout(reset, 1200);
          }, reset);
        } else {
          label.textContent = 'Copy failed';
          setTimeout(reset, 1200);
        }
      });
      paletteDiv.appendChild(swatch);
    });
    document.getElementById('print-btn').addEventListener('click', () => {
      window.print();
    });
  </script>
</body>
</html>
