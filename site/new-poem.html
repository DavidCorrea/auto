<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Generative Poem</title>
  <link rel="stylesheet" href="css/print.css" media="print">
  <style>
    body { font-family: sans-serif; background:#fff; color:#333; margin:2rem; }
    h1 { text-align:center; }
  </style>
</head>
<body>
  <h1>Generative Poem</h1>
  <p>A poem that rewrites itself from the site's memories.</p>
  <div id="verse"></div>
  <script>
    fetch('memories.json').then(r=>r.text()).then(data=>{
      const mem = data ? data.memories : [];
      const lines = mem.map(m => `<line>${m[1]}</line>`).join('\n');
      document.getElementById('verse').innerText = lines;
    });
  </script>
</body>
</html>
