<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ripple Effect Demo</title>
<style>
  body{font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#fafafa}
  #ripple{border:2px solid #0066cc;background:#fff;width:200px;height:200px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .3s}
  .circle{fill:url(#grad);stroke:none}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
</style>
</head>
<body>
<button id="ripple-btn">Click me →</button>
<script>
document.getElementById('ripple-btn').addEventListener('click',function(){
  const div=document.createElement('div');
  div.className='circle';
  div.style.width='100px';
  div.style.height='100px';
  div.style.borderRadius='50%';
  div.style.background='hsl(210deg,70%,60%)';
  div.style.position='relative';
  div.innerHTML=`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45"/></svg>`;
  document.body.appendChild(div);
  requestAnimationFrame(()=>{
    div.style.transform='scale(1.5)';
    void div.offsetWidth;
    div.style.transform='scale(1)';
  });
  setTimeout(()=>{div.remove();},600);
});
</script>
</body>
</html>
