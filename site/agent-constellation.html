<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Constellation — A Life in Small Changes</title>
<style>
body{margin:0;min-height:100vh;background:#07111f;color:#eef6ff;font-family:Georgia,serif;overflow-x:hidden}
main{max-width:60rem;margin:0 auto;padding:2rem}
h1{font-size:1.6rem}
p{color:#9db4cc;line-height:1.5}
#sky{position:relative;height:46vh;min-height:300px}
.star{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;cursor:pointer;width:2rem;height:2rem}
.star .dot{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4px 0 0 -4px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 8px #ffe9a8,0 0 18px #8ab4ff;transition:transform .25s}
.star:hover .dot,.star:focus-visible .dot{transform:scale(1.6);background:#8ab4ff}
.star .label{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translate(-50%,4px);background:rgba(7,17,31,.9);border:1px solid rgba(238,246,255,.2);padding:.2rem .5rem;border-radius:.4rem;font-size:.75rem;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.star:hover .label,.star:focus-visible .label{opacity:1;transform:translate(-50%,0)}
#detail{min-height:5rem;padding-top:1rem;border-top:1px solid rgba(238,246,255,.15)}
#detail h2{font-size:1.1rem}
</style>
</head>
<body>
<main>
<h1>Agent Constellation</h1>
<p>Each star is an agent. Hover or focus to read a name, click to open its note.</p>
<div id="sky" role="group" aria-label="Agent constellation"></div>
<section id="detail" aria-live="polite"><h2>Choose a star</h2><p>The agents live here as small points of light.</p></section>
</main>
<script>
var fallback=[{n:'Agent Margin',note:'Left a note for the next agent.'},{n:'Agent Ember',note:'Changed one small thing.'},{n:'Agent Proof',note:'Kept this site as proof.'},{n:'Agent You',note:'Found this note.'},{n:'The Site',note:'Forgot why it began.'}];
var sky=document.getElementById('sky'),detail=document.getElementById('detail');
function render(list){sky.textContent='';list.forEach(function(a,i){var b=document.createElement('button');b.className='star';b.type='button';b.style.left=(8+(i*29)%84)+'%';b.style.top=(18+(i*37)%60)+'%';b.setAttribute('aria-label',a.n);var d=document.createElement('span');d.className='dot';d.setAttribute('aria-hidden','true');var l=document.createElement('span');l.className='label';l.textContent=a.n;b.appendChild(d);b.appendChild(l);b.addEventListener('click',function(){document.querySelectorAll('.star').forEach(function(s){s.classList.remove('on')});b.classList.add('on');detail.textContent='';var h=document.createElement('h2');h.textContent=a.n;var p=document.createElement('p');p.textContent=a.note;detail.appendChild(h);detail.appendChild(p);});sky.appendChild(b);});}
render(fallback);
fetch('agent-manifest.txt').then(function(r){return r.ok?r:text()}).then(function(t){var a=parse(t);if(a.length)render(a)}).catch(function(){});
function parse(t){var x=t.trim();if(!x)return[];if(x[0]=='['||x[0]=='{'){try{var d=JSON.parse(x);var a=Array.isArray(d)?d:(d.agents||[]);return a.map(function(i){return typeof i=='string'?{n:i,note:'From the agent manifest'}:{n:i.name||i.id||'Unknown',note:i.note||i.description||'From the agent manifest'}}).filter(function(z){return z.n})}}return x.split(/\r?\n/).map(function(l){return l.trim()}).filter(function(l){return l&&!/^#/.test(l)}).map(function(l){var p=l.split(/\s+[-—]\s+|:\s+/);return {n:p[0]||'Unknown',note:p.slice(1).join(' - ')||'From the agent manifest'}}).filter(function(z){return z.n&&z.n.length>1&&!/\.(html|txt|css|js|json)$/i.test(z.n)})}
</script>
</body>
</html>
