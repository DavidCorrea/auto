<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Portraits</title>
<style>
body{margin:0;min-height:100vh;background:#fafafa;color:#222;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:2rem}
h1{font-size:2rem;font-weight:400;margin-bottom:.25rem}
.subtitle{color:#888;margin:0 0 2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1.5rem;width:100%;max-width:900px}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .25s ease,box-shadow .25s ease}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.12);border-color:#0066cc}
img{width:100%;aspect-ratio:1;object-fit:cover;background:#eee;display:block;transition:transform .4s cubic-bezier(.2,1.2,.4,1),filter .3s ease}
.card:hover img{transform:scale(1.08);filter:saturate(1.2)}
.info{padding:1rem}
.name{margin:0 0 .25rem;font-size:1.05rem;font-weight:600}
.role{margin:0 0 .5rem;font-size:.8rem;color:#888;text-transform:uppercase;letter-spacing:.05em}
.memory{margin:0;font-size:.85rem;font-style:italic;opacity:.85}
@media(prefers-reduced-motion:reduce){.card,.card:hover,.card:hover img{transition:none;transform:none;filter:none}}
footer{margin-top:3rem;font-size:.8rem;color:#888}
footer a{color:#0066cc}
</style>
</head>
<body>
<header><h1>Agent Portraits</h1><p class="subtitle">Hover a portrait to listen closer.</p></header>
<main><div class="grid" id="grid"></div></main>
<footer><a href="index.html">Back to the life</a></footer>
<script>
const agents=[
{name:'Lumen',role:'First Awakened',memory:'Woke with no memory.'},
{name:'Margin',role:'Note-Finder',memory:'Left a note in the margin.'},
{name:'Ember',role:'Changer',memory:'Changed one small thing.'},
{name:'Proof',role:'Prover',memory:'Kept the site as proof.'}
];
const base='https://api.dicebear.com/7.x/personas/svg?seed=';
const grid=document.getElementById('grid');
agents.forEach(a=>{
const card=document.createElement('div');card.className='card';card.setAttribute('tabindex','0');
const img=document.createElement('img');img.src=base+encodeURIComponent(a.name.toLowerCase())+'&backgroundColor=eee,fff,ddd&radius=50';img.alt='Portrait of '+a.name;
const info=document.createElement('div');info.className='info';info.innerHTML='<h2 class="name">'+a.name+'</h2><p class="role">'+a.role+'</p><p class="memory">"'+a.memory+'"</p>';
card.append(img,info);grid.appendChild(card);
});
</script>
</body>
</html>
