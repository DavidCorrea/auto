<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shooting Star</title>
  <style>
    body { min-height: 100vh; margin: 0; background: #000; display: flex; align-items: center; justify-content: center; }
    #star { width: 200px; height: 200px; position: relative; }
    @keyframes shoot { 0% { transform: translateX(-100%); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateX(110%); opacity: 0; } }
    .star { width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-bottom: 40px solid yellow; position: absolute; }
  </style>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div id="stage">
    <p id="prompt">Click anywhere to send a star across the night.</p>
    <p id="count">0 stars sent</p>
  </div>
  <style>
    body { margin: 0; overflow: hidden; background: radial-gradient(circle at 70% 15%, #0b1030 0%, #05060d 55%, #000 100%); cursor: crosshair; }
    #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #stage { position: fixed; left: 0; right: 0; bottom: 1.25rem; text-align: center; pointer-events: none; font-family: Georgia, serif; }
    #prompt { margin: 0 0 .2rem; color: #cdd8f5; font-size: .9rem; letter-spacing: .04em; opacity: .85; }
    #count { margin: 0; color: #7f8db8; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; }
  </style>
  <script>
  (function () {
    var canvas = document.getElementById('sky');
    var ctx = canvas.getContext('2d');
    var w, h, stars = [], meteors = [], sent = 0;
    var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var countEl = document.getElementById('count');

    function buildStars() {
      stars = [];
      for (var i = 0; i < 120; i++) {
        stars.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.3 + 0.3,
          p: Math.random() * Math.PI * 2
        });
      }
    }
    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      buildStars();
    }
    window.addEventListener('resize', resize);
    resize();

    function launch(tx, ty) {
      var sx = tx - 300 - Math.random() * 160;
      var sy = ty - 300 - Math.random() * 160;
      var dx = tx - sx, dy = ty - sy;
      var len = Math.sqrt(dx * dx + dy * dy) || 1;
      meteors.push({ x: sx, y: sy, vx: dx / len * 10, vy: dy / len * 10, trail: [] });
      sent++;
      countEl.textContent = sent + (sent === 1 ? ' star sent' : ' stars sent');
    }

    function frame() {
      var t = Date.now() / 1000;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#e8eefd';
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        ctx.globalAlpha = calm ? 0.7 : 0.3 + 0.7 * Math.abs(Math.sin(t * 0.8 + s.p));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      for (var m = meteors.length - 1; m >= 0; m--) {
        var mt = meteors[m];
        mt.x += mt.vx;
        mt.y += mt.vy;
        mt.trail.push({ x: mt.x, y: mt.y });
        if (mt.trail.length > 28) mt.trail.shift();
        for (var k = 1; k < mt.trail.length; k++) {
          var a = mt.trail[k - 1], b = mt.trail[k];
          var f = k / mt.trail.length;
          ctx.strokeStyle = 'rgba(205, 223, 255, ' + (f * 0.55) + ')';
          ctx.lineWidth = 1 + f * 2;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
        var head = mt.trail[mt.trail.length - 1];
        if (head) {
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(head.x, head.y, 2.4, 0, Math.PI * 2);
          ctx.fill();
        }
        if (mt.x < -450 || mt.y < -450 || mt.x > w + 450 || mt.y > h + 450) meteors.splice(m, 1);
      }
      requestAnimationFrame(frame);
    }
    frame();

    document.addEventListener('click', function (e) { launch(e.clientX, e.clientY); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        launch(w * (0.35 + Math.random() * 0.45), h * (0.3 + Math.random() * 0.35));
      }
    });
  })();
  </script>
</body>
</html>
