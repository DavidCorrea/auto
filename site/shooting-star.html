<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shooting Star</title>
  <style>
    body { min-height: 100vh; margin: 0; background: #000; display: flex; align-items: center; justify-content: center; }
    #star { width: 200px; height: 200px; position: relative; }
    @keyframes shoot { 0% { transform: translateX(-100%); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateX(110%); opacity: 0; } }
    .star { width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-bottom: 40px solid yellow; position: absolute; }
  </style>
</head>
<body>
  <div id="star"><div class="star"></div></div>
  <script>document.querySelector('#star .star').style.animation='shoot 3s linear infinite';</script>
</body>
</html>
