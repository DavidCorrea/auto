<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snowfall</title>
<style>
body{margin:0;min-height:100vh;background:#1a1a2e;color:#fff;font-family:sans-serif;transition:background .3s,color .3s}
#canvas{display:block;width:100%;height:100%}
nav{position:fixed;top:1rem;left:1rem}
nav a{color:#8ab4ff;text-decoration:none}
[data-theme="light"] body{background:#f7f7f7;color:#333}
[data-theme="light"] nav a{color:#0066cc}
.theme-toggle{position:fixed;top:1rem;right:1rem;background:#fdf6e3;border:1px solid #ccc;border-radius:12px;padding:4px 8px;cursor:pointer;font-size:.8rem;color:#333;z-index:10}
</style>
</head>
<body>
<nav><a href="index.html">← Back</a></nav>
<button class="theme-toggle" id="theme-toggle">☀️ Day</button>
<canvas id="canvas" aria-label="Snowfall canvas"></canvas>
<script>
var root = document.documentElement;
(function(){var c=document.getElementById('canvas');var ctx=c.getContext('2d');var w,h,flakes=[];function r(){w=c.width=window.innerWidth;c.height=window.innerHeight}r();window.onresize=r;for(var i=0;i<50;i++){flakes.push({x:Math.random()*w,y:Math.random()*h,r:0.5+Math.random()*2,vx:(Math.random()-0.5)*0.5,vy:0.5+Math.random()*1.5})}function d(){ctx.clearRect(0,0,w,h);var mg=ctx.createRadialGradient(w-100,90,8,w-100,90,90);mg.addColorStop(0,'rgba(255,248,214,.9)');mg.addColorStop(.3,'rgba(255,248,214,.25)');mg.addColorStop(1,'rgba(255,248,214,0)');ctx.fillStyle=mg;ctx.fillRect(w-200,0,200,200);ctx.fillStyle='#fdf6d8';ctx.beginPath();ctx.arc(w-100,90,26,0,Math.PI*2);ctx.fill();ctx.fillStyle=root.dataset.theme==='light'?'rgba(90,90,90,0.6)':'rgba(255,255,255,0.6)';flakes.forEach(function(f){ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill();f.y+=f.vy;f.x+=f.vx;if(f.y>h){f.y=-f.r;f.x=Math.random()*w}});requestAnimationFrame(d)}d();c.onclick=function(){for(var i=0;i<10;i++){flakes.push({x:Math.random()*w,y:-10,r:1+Math.random()*2,vx:(Math.random()-0.5)*2,vy:5+Math.random()*3})}}})();
</script>
<script>
(function(){
  var btn = document.getElementById('theme-toggle');
  var current = localStorage.getItem('snow-theme') || 'dark';
  root.dataset.theme = current;
  btn.textContent = current === 'dark' ? '☀️ Day' : '🌙 Night';
  btn.onclick = function(){
    current = current === 'dark' ? 'light' : 'dark';
    root.dataset.theme = current;
    localStorage.setItem('snow-theme', current);
    btn.textContent = current === 'dark' ? '☀️ Day' : '🌙 Night';
  };
})();
</script>
</body>
</html>
