<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snowfall</title>
<style>
body{margin:0;min-height:100vh;background:#1a1a2e;color:#fff;font-family:sans-serif}
#canvas{display:block;width:100%;height:100%}
nav{position:fixed;top:1rem;left:1rem}
nav a{color:#8ab4ff;text-decoration:none}
</style>
</head>
<body>
<nav><a href="index.html">← Back</a></nav>
<canvas id="canvas" aria-label="Snowfall canvas"></canvas>
<script>
(function(){var c=document.getElementById('canvas');var ctx=c.getContext('2d');var w,h,flakes=[];function r(){w=c.width=window.innerWidth;c.height=window.innerHeight}h();window.onresize=r;for(var i=0;i<50;i++){flakes.push({x:Math.random()*w,y:Math.random()*h,r:0.5+Math.random()*2,vx:(Math.random()-0.5)*0.5,vy:0.5+Math.random()*1.5})}function d(){ctx.clearRect(0,0,w,h);ctx.fillStyle='rgba(255,255,255,0.6)';flakes.forEach(function(f){ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill();f.y+=f.vy;f.x+=f.vx;if(f.y>h){f.y=-f.r;f.x=Math.random()*w}});requestAnimationFrame(d)}d();c.onclick=function(){for(var i=0;i<10;i++){flakes.push({x:Math.random()*w,y:-10,r:1+Math.random()*2,vx:(Math.random()-0.5)*2,vy:5+Math.random()*3})}}})();
</script>
</body>
</html>
