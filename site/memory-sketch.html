<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Sketch — A Life in Small Changes</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:2rem;min-height:100vh;font-family:Georgia,serif;background:#fff;color:#333}main{max-width:860px;margin:0 auto}h1{margin:0 0 .25rem;font-size:1.6rem}p{line-height:1.5}.back{display:inline-block;margin-bottom:1rem;color:#0066cc;text-decoration:none;font-weight:bold}.stage{border:1px solid #ccc;border-radius:12px;padding:.75rem;background:#fdf6e3}canvas{display:block;width:100%;aspect-ratio:16/9;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:crosshair;touch-action:none}.toolbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:.75rem}button{font:inherit;padding:.4rem .75rem;border:1px solid #ccc;background:#fff;border-radius:999px;cursor:pointer}button:hover{background:#f4f4f4}label{font-size:.85rem;display:inline-flex;align-items:center;gap:.35rem}input[type=color]{width:2.4rem;height:1.8rem;border:0;padding:0;background:none;cursor:pointer}input[type=range]{width:7rem}.hint{font-size:.8rem;color:#666;margin-top:.5rem}@media(prefers-color-scheme:dark){body{background:#1a1a1a;color:#f0f0f0}.stage{background:#2a2a2a;border-color:#555}canvas{background:#111;border-color:#555}button{background:#333;border-color:#555;color:#f0f0f0}button:hover{background:#444}}
</style>
</head>
<body>
<main>
<a class="back" href="index.html">← Back to the life</a>
<h1>Sketch a memory</h1>
<p>Draw something you remember, even if it is only a shape, a color, or a line that will not stay.</p>
<div class="stage">
<canvas id="sketch" width="1280" height="720" aria-label="Memory sketch canvas. Draw with a mouse, pen, or finger."></canvas>
</div>
<div class="toolbar">
<label>Color <input id="color" type="color" value="#0066cc"></label>
<label>Brush <input id="size" type="range" min="1" max="24" value="6"></label>
<button id="clear" type="button">Clear</button>
<button id="save" type="button">Save PNG</button>
</div>
<p class="hint">Nothing is sent anywhere. Save downloads a PNG of what you drew. <strong>Keys:</strong> ← → change brush size, Space clears, S saves.</p>
<script>
(function(){var s=document.getElementById('size'),cl=document.getElementById('clear'),sv=document.getElementById('save');document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='ArrowUp'){s.value=Math.min(24,+s.value+1)}else if(e.key==='ArrowLeft'||e.key==='ArrowDown'){s.value=Math.max(1,+s.value-1)}else if(e.key===' '){e.preventDefault();cl.click()}else if(e.key.toLowerCase()==='s'){e.preventDefault();sv.click()}})})();
</script>
</main>
<script>
(function(){var c=document.getElementById('sketch'),ctx=c.getContext('2d'),color=document.getElementById('color'),size=document.getElementById('size'),clear=document.getElementById('clear'),save=document.getElementById('save'),drawing=!1,last={x:0,y:0};function p(e){var r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*(c.width/r.width),y:(e.clientY-r.top)*(c.height/r.height)}}function s(e){drawing=!0;last=p(e);c.setPointerCapture(e.pointerId);dot(last);e.preventDefault()}function m(e){if(!drawing)return;var p_=p(e);ctx.strokeStyle=color.value;ctx.lineWidth=+size.value;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p_.x,p_.y);ctx.stroke();last=p_;e.preventDefault()}function e_(e){drawing=!1;try{c.releasePointerCapture(e.pointerId)}catch(err){}}function dot(p){ctx.fillStyle=color.value;ctx.beginPath();ctx.arc(p.x,p.y,+size.value/2,0,Math.PI*2);ctx.fill()}c.addEventListener('pointerdown',s);c.addEventListener('pointermove',m);c.addEventListener('pointerup',e_);c.addEventListener('pointercancel',e_);c.addEventListener('pointerleave',function(e){if(drawing)e_(e)});clear.addEventListener('click',function(){ctx.clearRect(0,0,c.width,c.height)});save.addEventListener('click',function(){var a=document.createElement('a');a.download='memory-sketch.png';a.href=c.toDataURL('image/png');a.click()})})();
</script>
</body>
</html>
