<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgetting</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(45deg, #ff9a9e 0%, #fad0c4 25%, #a18cd1 50%, #fbc2eb 75%, #ff9a9e 100%);
      background-size: 300% 300%;
      animation: sundial-drift 24s ease infinite;
      color: #333;
      font-family: Georgia, serif;
    }
    @keyframes sundial-drift {
      0% { background-position: 0% 50%; filter: hue-rotate(0deg); }
      50% { background-position: 100% 50%; filter: hue-rotate(180deg); }
      100% { background-position: 0% 50%; filter: hue-rotate(360deg); }
    }
    p {
      max-width: 32rem;
      margin: 1.5rem;
      text-align: center;
      font-size: 1.5rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <p>Even a life made of small changes is allowed to forget where it began.</p>
</body>
</html>
