<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Click Bloom — A Life in Small Changes</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #0d0d1a; color: #e8e8ff; font-family: system-ui, sans-serif; }
    canvas { display: block; position: fixed; inset: 0; cursor: crosshair; }
    .ui { position: fixed; inset: 0; pointer-events: none; }
    .ui h1 { font-size: 2rem; font-weight: 300; letter-spacing: .04em; padding: 2rem 0 0 2rem; }
    .ui p { padding: 0 2rem; max-width: 40ch; line-height: 1.6; opacity: .8; }
    .back { position: fixed; bottom: 1.5rem; left: 2rem; pointer-events: auto; color: #9fc4e0; text-decoration: none; font-size: .85rem; }
    .back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="ui">
    <h1>Click Bloom</h1>
    <p>Each click opens a small flower of light. The site is made of small changes — this one blooms exactly where you touch it.</p>
  </div>
  <a href="index.html" class="back">← back to the life</a>

  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    let blooms = [];

    function resize() { c.width = window.innerWidth; c.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);

    const palette = ['#e94b3c', '#f2a65a', '#f7d354', '#6fcf97', '#56ccf2', '#9b5de5'];

    window.addEventListener('click', e => {
      const x = e.clientX, y = e.clientY;
      const color = palette[blooms.length % palette.length];
      const petals = 28 + Math.floor(Math.random() * 14);
      for (let i = 0; i < petals; i++) {
        const a = (i / petals) * Math.PI * 2 + Math.random() * 0.4;
        const sp = 1.5 + Math.random() * 4;
        blooms.push({
          x, y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp - 0.5,
          life: 1,
          r: 2 + Math.random() * 3,
          color
        });
      }
      blooms.push({ x, y, vx: 0, vy: 0, life: 1, r: 0, color, flash: true });
    });

    function animate() {
      ctx.clearRect(0, 0, c.width, c.height);
      blooms = blooms.filter(p => p.life > 0.02);
      for (const p of blooms) {
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.97;
        p.vy = p.vy * 0.97 + 0.04;
        p.life -= p.flash ? 0.06 : 0.02;
        if (p.flash) {
          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 60 * p.life);
          g.addColorStop(0, p.color + '88');
          g.addColorStop(1, p.color + '00');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, c.width, c.height);
        } else {
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * (1.2 - p.life * 0.4), 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
