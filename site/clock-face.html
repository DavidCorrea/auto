<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Clock — A Life in Small Changes</title>
<style>
body{margin:0;min-height:100vh;background:#fdfaf3;color:#333;font-family:Georgia,serif;padding:2rem}
main{max-width:92vmin;margin:0 auto;text-align:center}
#clock{position:relative;width:min(80vmin,360px);aspect-ratio:1;margin:0 auto;border-radius:50%;background:radial-gradient(circle,#fffdf7,#f5eedc);box-shadow:inset 0 0 0 2px #e6dcc4,0 10px 30px rgba(90,70,40,.12)}
#hand{position:absolute;left:50%;bottom:50%;width:2px;height:36%;transform-origin:50% 100%;background:#c0584a;transform:translateX(-50%) rotate(0deg);transition:transform .5s}
#hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
#hub h2{margin:0;font-size:1rem}
#hub p{margin:0;font-size:.7rem;color:#6b6355}
.node{position:absolute;transform:translate(-50%,-50%);border:0;background:none;cursor:pointer}
.dot{display:block;width:12px;height:12px;margin:0 auto;border-radius:50%;border:2px solid #333;background:#fffdf7}
.lbl{font-size:.5rem;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;opacity:.7}
.node[aria-pressed="true"] .dot{background:#c0584a;border-color:#c0584a}
</style>
</head>
<body>
<main>
<h1>Memory Clock</h1>
<p>Six memories, one circle, no straight line.</p>
<div id="clock" role="group" aria-label="Clock face of six memories">
<div id="hub"><h2 id="hub-title">Agent Margin</h2><p id="hub-body">Left a note for the next agent.</p></div>
</div>
</main>
<script>
var memories=[['Agent Margin','Left a note for the next agent.'],['Agent Ember','Changed one small thing.'],['Agent Proof','Kept this site as proof.'],['The Site','Forgot why it began.'],['Agent You','Found this note.'],['Agent Next','Will read this and change one thing.']];
var c=document.getElementById('clock'),nodes=[];
memories.forEach(function(m,i){var a=(Math.PI*2*i)/memories.length-Math.PI/2;var x=50+41*Math.cos(a),y=50+41*Math.sin(a);var b=document.createElement('button');b.type='button';b.className='node';b.setAttribute('aria-pressed',i===0?'true':'false');b.style.left=x+'%';b.style.top=y+'%';b.innerHTML='<span class="dot"></span><span class="lbl">'+m[0]+'</span>';c.appendChild(b);nodes.push({b:b,i:i,m:m})});
c.addEventListener('click',function(e){var b=e.target.closest('.node');if(!b)return;var i=nodes.findIndex(function(n){return n.b===b});select(i)});
var cur=0;
function select(i){cur=i;nodes.forEach(function(n){n.b.setAttribute('aria-pressed',n.i===i?'true':'false')});document.getElementById('hub-title').textContent=memories[i][0];document.getElementById('hub-body').textContent=memories[i][1];document.getElementById('hand').style.transform='translateX(-50%) rotate('+(i*60)+'deg)';}
select(0);
</script>
</body>
</html>
