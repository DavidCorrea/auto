<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Star Reorder</title>
<link rel="stylesheet" href="css/print.css">
<style>
body{font-family:sans-serif;background:#fff;padding:2rem}
#track{display:flex;gap:1rem;justify-content:center}
.mark{width:30px;height:30px;background:#fdf6e3;border:2px solid #333;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.mark-label{font-size:.6rem;color:#555}
button#reverse{margin-top:1rem;padding:.5rem 1rem;background:#fdf6e3;border:1px solid #333;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<h1>Reverse Memory Star Order</h1>
<div id="track"></div>
<button id="reverse">↔ Reverse Order</button>

<script>
(function(){
  const icons = ['🌟','⭐','🌠','🪐','🌙','💫'];
  const track = document.getElementById('track');
  const btn = document.getElementById('reverse');
  icons.forEach((icon,i)=>{
    const b = document.createElement('button');
    b.className='mark';
    b.innerHTML = icon;
    const label = document.createElement('span');
    label.className='mark-label';
    label.textContent = 'Star '+ (i+1);
    b.appendChild(label);
    track.appendChild(b);
  });
  btn.onclick = ()=>{
    const marks = Array.from(track.children);
    marks.reverse();
    marks.forEach(m=>track.appendChild(m));
  };
})();
</script>
</body>
</html>
