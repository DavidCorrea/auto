<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgotten Archive — A Life in Small Changes</title><style>body{font-family:system-ui,Georgia,serif;max-width:40rem;margin:2rem auto;padding:1rem;line-height:1.5}input,select{padding:.4rem;margin:.5rem 0;font:inherit}ul{list-style:none;padding:0}li{border:1px solid #ccc;padding:.75rem;margin:.5rem 0;border-radius:6px;background:#fff}em{color:#666;font-size:.9rem}b{color:#6b4eff}</style></head><body><h1>Forgotten Archive</h1><input id="s" type="search" placeholder="Search forgotten changes…"><select id="o"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="alpha">Title A–Z</option></select><p id="n"></p><ul id="l"></ul><script src="forgotten-memories.js"></script><script>(function(){var d=(window.FORGOTTEN_MEMORIES&&window.FORGOTTEN_MEMORIES.memories)||[];var l=document.getElementById('l'),n=document.getElementById('n'),s=document.getElementById('s'),o=document.getElementById('o');function r(){var q=s.value.toLowerCase(),a=d.filter(function(m){return!q||(m.title+' '+m.text).toLowerCase().includes(q)});if(o.value==='old')a.reverse();else if(o.value==='alpha')a.sort(function(x,y){return(x.title||'').localeCompare(y.title||'')});l.innerHTML='';a.forEach(function(m){var x=document.createElement('li');x.innerHTML='<b>'+(m.title||'Untitled')+'</b><br>'+(m.text||'')+'<em> ('+(m.date||'unknown date')+')</em>';l.appendChild(x)});n.textContent=a.length+' of '+d.length+' forgotten changes'}r();s.oninput=r;o.onchange=r})()</script></body></html>
