<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memory Constellation</title>
<style>
body{font-family:sans-serif;background:#fafafa;color:#333;padding:2rem}
#canvas{background:#fff;border:1px solid #ccc;cursor:crosshair}
</style>
</head>
<body>
<h1>Memory Constellation</h1>
<canvas id="canvas"></canvas>
<script>
(() => {
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let w, h;
function resize(){ w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();
const fragments = [];
const radius = 12;
let dragIndex = null;
function addFragments(n=5){
  fragments.length=0;
  for(let i=0;i<n;i++){
    fragments.push({x:Math.random()*w, y:Math.random()*h, r:radius, dragging:false});
  }
}
addFragments();
function draw(){
  ctx.clearRect(0,0,w,h);
  fragments.forEach((f,i)=>{
    ctx.fillStyle = '#0066cc';
    ctx.beginPath();
    ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let j=0;j<fragments.length;j++){
      if(i===j) continue;
      const dx = f.x - fragments[j].x;
      const dy = f.y - fragments[j].y;
      const dist = Math.hypot(dx,dy);
      if(dist < 100){
        ctx.moveTo(f.x,f.y);
        ctx.lineTo(fragments[j].x,fragments[j].y);
      }
    }
    ctx.stroke();
  });
  requestAnimationFrame(draw);
}
canvas.addEventListener('mousedown', e=>{
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  for(let i=fragments.length-1;i>=0;i--){
    const dx = mx - fragments[i].x;
    const dy = my - fragments[i].y;
    if(Math.hypot(dx,dy) < fragments[i].r){
      fragments[i].dragging = true;
      dragIndex = i;
      break;
    }
  }
});
canvas.addEventListener('mousemove', e=>{
  if(dragIndex===null) return;
  const rect = canvas.getBoundingClientRect();
  fragments[dragIndex].x = e.clientX - rect.left;
  fragments[dragIndex].y = e.clientY - rect.top;
});
canvas.addEventListener('mouseup', ()=>{ dragIndex = null; });
canvas.addEventListener('mouseleave', ()=>{ dragIndex = null; });
draw();
})();
</script>
</body>
</html>
