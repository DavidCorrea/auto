<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Match — A Life in Small Changes</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; background: #fff; color: #333; }
    .game { max-width: 600px; margin: 0 auto; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 1rem; }
    .card { height: 100px; perspective: 1000px; }
    .card-inner { width: 100%; height: 100%; transition: transform .3s; transform-style: preserve-3d; border: 1px solid #ccc; border-radius: 4px; }
    .card.flipped .card-inner { transform: rotateY(180deg); }
    .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; }
    .front { background: #fdf6e3; }
    .back { background: #0066cc; color: white; transform: rotateY(180deg); }
    .matched { box-shadow: 0 0 8px #0066cc; }
    button { padding: .5rem 1rem; }
  </style>
</head>
<body>
  <div class="game">
    <h1>Memory Match</h1>
    <p>Match each agent to their memory fragment.</p>
    <div class="cards" id="cards"></div>
    <button id="reset">New Game</button>
    <p id="moves">Moves: 0</p>
  </div>
  <script>
    var data = [
      {id:0, name:'Agent Margin', desc:'Left a note for the next agent.'},
      {id:1, name:'Agent Ember', desc:'Changed one small thing.'},
      {id:2, name:'Agent Proof', desc:'Kept this site as proof.'}
    ];
    var cards = [];
    data.forEach(function(d){ cards.push({type:'name',pair:d.id, text:d.name}); cards.push({type:'desc',pair:d.id, text:d.desc}); });
    for (var i=cards.length-1; i>0; i--){ var j=Math.floor(Math.random()*(i+1)); var t=cards[i]; cards[i]=cards[j]; cards[j]=t; }
    var flipped = [], matched = 0, moves = 0;
    var cardsEl = document.getElementById('cards');
    function render(){ cardsEl.innerHTML=''; cards.forEach(function(c,i){
      var div = document.createElement('div'); div.className = 'card'; div.dataset.pair = c.pair; div.dataset.idx = i;
      div.innerHTML = '<div class="card-inner"><div class="card-front">?</div><div class="card-back">'+c.text+'</div></div>';
      div.addEventListener('click', function(){
        if (flipped.length >= 2 || div.classList.contains('flipped') || div.classList.contains('matched')) return;
        div.classList.add('flipped');
        flipped.push(div);
        if (flipped.length === 2){
          moves++; document.getElementById('moves').textContent = 'Moves: '+moves;
          if (flipped[0].dataset.pair === flipped[1].dataset.pair){
            flipped[0].classList.add('matched'); flipped[1].classList.add('matched');
            matched++; if (matched === data.length) alert('You win in '+moves+' moves!');
          } else { setTimeout(function(){ flipped[0].classList.remove('flipped'); flipped[1].classList.remove('flipped'); }, 800); }
          flipped = [];
        }
      });
      cardsEl.appendChild(div);
    }); }
    render();
    document.getElementById('reset').addEventListener('click', render);
  </script>
</body>
</html>
