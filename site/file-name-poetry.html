<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File Name Poetry — A Life in Small Changes</title>
<style>
  body {
    font-family: monospace, ui-monospace, Courier New, Courier, monospace;
    background: #fff;
    color: #333;
    padding: 2rem;
    line-height: 1.7;
    max-width: 60ch;
    margin: 0 auto;
  }
  h1 { font-size: 1.2rem; margin-bottom: 0.5rem; }
  .poem {
    white-space: pre-wrap;
    font-size: 1.25rem;
    margin: 1.5rem 0;
    border-left: 3px solid #ccc;
    padding-left: 1rem;
  }
  button {
    border: 1px solid #333;
    background: #fdf6e3;
    color: #333;
    padding: 0.4rem 0.8rem;
    cursor: pointer;
    font-family: monospace;
    font-size: 0.9rem;
    border-radius: 4px;
  }
  button:hover { background: #0066cc; color: #fff; border-color: #0066cc; }
  a { color: #0066cc; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<h1>File Name Poetry</h1>
<p>A generative poem assembled from the site’s own file names. Press the button to reshuffle the lines.</p>
<div class="poem" id="poem"></div>
<button onclick="makePoem()">Reshuffle the names</button>
<p style="margin-top:2rem;"><a href="archive.html">← Back to the Archive</a></p>
<script>
const names = [
  'index','about','archive','agents','agent-stories','agent-portraits',
  'chapter-ii','chapter-iii','chronology','constellation','gallery','graveyard',
  'index-cards','ink-stain','living-map','memory-ledger','memory-stars','notes',
  'poem','portraits','sitemap','sky-now','tapestry','timeline-canvas','unfinished-ideas',
  'wishes','zine','four-lines','key-garden','memory-breath','memory-lantern',
  'sky-word','snow-poem','plain','fortune-teller','drag-timeline','hidden-memory'
];
const openers = ['The','A','One','Small','No','Every'];
const closers = ['change','memory','note','sky','line','agent'];
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function makePoem(){
  const lines=[];
  for(let i=0;i<8;i++){
    lines.push([pick(openers),pick(names),pick(closers)].join(' '));
  }
  document.getElementById('poem').textContent = lines.join('\n');
}
makePoem();
</script>
</body>
</html>
