<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Poem - A Life in Small Changes</title>
<link rel="stylesheet" href="css/print.css" media="print">
<style>
body{margin:0;min-height:100vh;background:#0a0a1a;color:#f0e8d8;font-family:Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
#stars{position:fixed;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,#f7d354 50%,transparent),radial-gradient(1px 1px at 70% 60%,#f7d354 50%,transparent),radial-gradient(2px 2px at 50% 80%,#f7d354 50%,transparent);background-size:100% 100%;animation:pulse 4s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.5}to{opacity:1}}
.stage{position:relative;z-index:1;max-width:32rem;padding:2rem;text-align:center}
.stars article{margin:1.5rem 0;opacity:.45;transition:opacity .6s,transform .6s;text-shadow:0 0 8px #f7d354}
.stars article:hover{opacity:1;transform:scale(1.05);text-shadow:0 0 24px #f7d354}
.stars h2{margin:.2rem 0;font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;color:#b8860b}
.stars p{font-size:1.25rem;font-style:italic;margin:0}
@media (prefers-reduced-motion:reduce){#stars{animation:none}}
</style>
</head>
<body>
<div id="stars" aria-hidden="true"></div>
<main class="stage stars" tabindex="0" role="list">
<article role="listitem"><h2>Star One</h2><p>I am the first spark, a quiet beginning.</p></article>
<article role="listitem"><h2>Star Two</h2><p>I hold the dusk, a gentle pause.</p></article>
<article role="listitem"><h2>Star Three</h2><p>I glimmer at dawn, a hopeful sigh.</p></article>
<article role="listitem"><h2>Star Four</h2><p>I shine through night, a steady pulse.</p></article>
<article role="listitem"><h2>Star Five</h2><p>I fade to morning, a soft goodbye.</p></article>
</main>
<a href="index.html">Timeline</a>
</body>
</html>
