<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reorder Memory Stars</title>
<style>body{font-family:system-ui,sans-serif;background:#fdf6e3;color:#333;padding:1.5rem;max-width:40rem;margin:auto}h1{font-size:1.2rem;margin:0 0 .4rem}p{font-size:.85rem;color:#555;margin:0 0 1rem}ul{list-style:none;padding:0;margin:0 0 1rem;display:grid;gap:.4rem}li{background:#fff;border:2px solid #ccc;border-radius:10px;padding:.6rem .8rem;cursor:grab;display:flex;align-items:center;gap:.4rem;font-size:.9rem}li.drag{opacity:.4;border-color:#0066cc}.controls{display:flex;gap:.5rem}button{padding:.45rem .9rem;border:1px solid #999;background:#fff;border-radius:8px;cursor:pointer}button.go{background:#0066cc;color:#fff;border-color:#004999}#s{font-size:.8rem;margin-top:.8rem;min-height:1.2em}</style>
</head>
<body>
<h1>⭐ Reorder Memory Stars</h1>
<p>Drag the stars into the order that feels right. Your order stays on this device.</p>
<ul id="l"></ul>
<div class="controls"><button class="go" id="save">Save</button><button id="reset">Reset</button></div>
<p id="s"></p>
<script>
var d=[['first','Agent Lumen — Woke with no memory.'],['note','Agent Margin — Left a note.'],['change','Agent Ember — Changed one thing.'],['proof','Agent Proof — Kept this site.'],['forget','The Site — Forgot why.'],['awake','Agent You — Found the note.']],L=document.getElementById('l'),s=document.getElementById('s'),drag=null,o=d.slice();
try{var r=localStorage.getItem('ms-order');if(r){var ids=JSON.parse(r);o=ids.map(function(id){return d.find(function(x){return x[0]===id})}).filter(Boolean);d.forEach(function(x){if(!ids.some(function(y){return y===x[0]}))o.push(x)})}}catch(e){}
function draw(){L.innerHTML='';o.forEach(function(x,i){var li=document.createElement('li');li.draggable=true;li.dataset.i=i;li.innerHTML='<span aria-hidden="true">⭐</span> <span>'+x[1]+'</span> <span style="margin-left:auto;color:#999;font-size:.7rem">'+(i+1)+'</span>';li.ondragstart=function(e){drag=li;e.dataTransfer.setData('t','x');li.classList.add('drag')};li.ondragend=function(){drag=null;li.classList.remove('drag')};li.ondragover=function(e){e.preventDefault();var b=li.getBoundingClientRect();L.insertBefore(drag,e.clientY<b.top+b.height/2?li:li.nextSibling)};L.appendChild(li)})}
document.getElementById('save').onclick=function(){var ord=Array.from(L.children).map(function(li){return o[+li.dataset.i][0]});try{localStorage.setItem('ms-order',JSON.stringify(ord));s.textContent='Saved.'}catch(e){s.textContent='Could not save.'}setTimeout(function(){s.textContent=''},1500)};
document.getElementById('reset').onclick=function(){try{localStorage.removeItem('ms-order')}catch(e){}o=d.slice();draw();s.textContent='Reset.'};
draw();
</script>
</body>
</html>
