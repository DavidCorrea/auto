<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Star Map — A Life in Small Changes</title><style>body{margin:0;height:100vh;background:#0a0f2a;color:#eee;overflow:hidden;font-family:ui-serif,serif;display:flex;flex-direction:column;align-items:center;justify-content:center}#sky{position:fixed;inset:0}.star{position:absolute;border-radius:50%;background:radial-gradient(#fff,#fff 30%,transparent 80%);box-shadow:0 0 6px #fff;cursor:pointer;transition:transform .2s}.star:hover{transform:scale(2);z-index:3}#card{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;background:rgba(0,0,0,.75);backdrop-filter:blur(4px)}#card.show{display:flex}#card article{background:#141a3a;border:1px solid #9b8cff;border-radius:14px;padding:2rem 2.5rem;max-width:40ch;text-align:center}#card h2{margin:0 0 .5rem}#card p{margin:0 0 1rem;line-height:1.5}#card button{font:inherit;border:1px solid #9b8cff;background:transparent;color:#9b8cff;padding:.4rem 1rem;border-radius:999px;cursor:pointer}#hint{position:fixed;top:1rem;width:100%;text-align:center;font-size:.75rem;color:#7f86b8;letter-spacing:.1em;text-transform:uppercase}</style></head><body><div id="sky"></div><div id="hint">Click a star · a memory waits in the dark</div><div id="card"><article><h2 id="t">Memory</h2><p id="b">A small change kept by the sky.</p><button id="c">Close</button></article></div><script>var m=[["Dawn","The first light was left on by someone who never signed their name."],["Moss","A single green thread found its way into a ledger of numbers."],["Tide","At low tide a bottle held a note for the next walker."],["Dusk","The lamp flickered twice, then burned steady."],["Ember","A coal kept a spark alive long enough for a stranger."],["Fern","A page pressed between leaves was read a season later."]];var sky=document.getElementById('sky'),ctx;for(var i=0;i<m.length;i++){var s=document.createElement('div');s.className='star';var r=Math.random;s.style.left=r()*90+4+'%';s.style.top=r()*80+12+'%';var z=r()>0.6?10:6;s.style.width=z+'px';s.style.height=z+'px';s.onclick=function(j){return function(e){e.stopPropagation();show(j)}}(i);sky.appendChild(s)}function show(i){if(!ctx){ctx=new(AudioContext||webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}var o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=528;o.type='sine';g.gain.setValueAtTime(.05,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.5);o.start();o.stop(ctx.currentTime+.5);document.getElementById('t').textContent=m[i][0];document.getElementById('b').textContent=m[i][1];document.getElementById('card').classList.add('show')}document.getElementById('c').onclick=function(){document.getElementById('card').classList.remove('show')};document.getElementById('card').onclick=function(e){if(e.target===this)this.classList.remove('show')}</script></body></html>
