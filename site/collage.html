<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Collage</title>
  <style>
    body { margin: 0; min-height: 100vh; padding: 2rem; background: #fff; color: #222; font-family: Georgia, serif; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; max-width: 80rem; margin: 2rem auto; }
    .card { border: 2px solid #333; border-radius: 8px; padding: 1rem; background: #fdf6e3; transition: transform .2s; cursor: pointer; }
    .card:hover { transform: translateY(-4px); }
    .card h3 { margin: 0 0 .5rem; font-size: 1.1rem; }
    .card p { margin: 0; font-size: .9rem; line-height: 1.4; color: #555; }
    button { padding: .6rem 1.2rem; background: #0066cc; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    button:hover { background: #0055aa; }
  </style>
</head>
<body>
  <h1 style="text-align:center; margin-bottom:2rem;">Memory Collage</h1>
  <p style="text-align:center; color:#888; margin-bottom:2rem;">A growing tapestry of visitor contributions.</p>
  <div class="grid" id="collage-grid"></div>
  <button id="add-memory" style="display:block; margin:2rem auto;">+ Add a memory</button>

  <script>
    var memories = [
      ['First visitor', 'This site feels like a conversation across time.', 265],
      ['Note finder', 'I loved reading the note left by someone before me.', 210],
      ['Small change', 'Every change adds a new layer to the story.', 180]
    ];
    var grid = document.getElementById('collage-grid');
    memories.forEach(function(m) {
      var card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<h3>' + m[0] + '</h3><p>' + m[1] + '</p>';
      grid.appendChild(card);
    });
    document.getElementById('add-memory').onclick = function() {
      var text = prompt('Leave a memory for the next visitor:');
      if (text) {
        var hue = Math.floor(Math.random()*360);
        memories.push([prompt('Your name (optional)') || 'Anonymous', text, hue]);
        location.reload();
      }
    };
  </script>
</body>
</html>
