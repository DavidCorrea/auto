<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guestbook Archive — A Life in Small Changes</title>
  <style>
    body { font-family: Georgia, serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; background: var(--site-bg, #fff); color: var(--site-text, #333); }
    h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
    #count { font-style: italic; color: var(--site-muted, #999); margin-bottom: 1rem; }
    .entry { border-left: 3px solid var(--site-track, #333); padding: 0.5rem 0 0.5rem 1rem; margin-bottom: 1rem; }
    #pagination { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
    #pagination button { padding: 0.3rem 0.7rem; border: 1px solid var(--site-border, #ccc); background: var(--site-mark-bg, #fdf6e3); color: var(--site-text, #333); cursor: pointer; border-radius: 12px; }
    #pagination button.active { background: var(--site-track, #333); color: var(--site-bg, #fff); }
  </style>
  <style>
    body {
      background-image:
        radial-gradient(circle at 20% 20%, rgba(0, 102, 204, 0.08), transparent 34%),
        radial-gradient(circle at 80% 30%, rgba(155, 93, 229, 0.06), transparent 32%);
      background-size: 180% 180%;
      background-repeat: no-repeat;
      background-attachment: fixed;
      animation: archive-bg 22s ease-in-out infinite alternate;
    }
    @keyframes archive-bg {
      from { background-position: 0% 0%; }
      to { background-position: 100% 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      body { animation: none; }
    }
  </style>
</head>
<body>
  <h1>Guestbook Archive</h1>
  <p id="count">Loading entries...</p>
  <button onclick="window.print()" style="float:right;padding:.4rem .8rem;border:1px solid var(--site-border,#ccc);background:var(--site-mark-bg,#fdf6e3);color:var(--site-text,#333);border-radius:10px;cursor:pointer;">🖨 Print ledger</button>
  <div id="entries"></div>
  <div id="pagination"></div>
  <script>
    (async function() {
      const countEl = document.getElementById('count');
      const entriesEl = document.getElementById('entries');
      const paginationEl = document.getElementById('pagination');
      try {
        const res = await fetch('guestbook.html');
        const html = await res.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        let entries = [];
        const selectors = ['.entry', '.note', '.guestbook-entry', '.guest-entry', '.comment', 'li', 'blockquote', 'article', 'section'];
        for (const sel of selectors) {
          const nodes = doc.querySelectorAll(sel);
          if (nodes.length > entries.length) {
            entries = Array.from(nodes);
          }
        }
        if (entries.length > 0) {
          entries = entries.filter(el => {
            return !entries.some(other => other !== el && other.contains(el));
          });
        }
        if (entries.length === 0) {
          const text = doc.body.innerText || doc.body.textContent;
          const parts = text.split(/\n\s*\n/).filter(t => t.trim().length > 0);
          entries = parts.map(t => {
            const div = document.createElement('div');
            div.textContent = t;
            return div;
          });
        }
        const perPage = 5;
        let page = 1;
        const totalPages = Math.ceil(entries.length / perPage);
        function render() {
          const start = (page - 1) * perPage;
          const end = start + perPage;
          entriesEl.innerHTML = '';
          entries.slice(start, end).forEach(e => {
            const wrapper = document.createElement('div');
            wrapper.className = 'entry';
            if (e.outerHTML) {
              wrapper.innerHTML = e.outerHTML;
            } else {
              wrapper.textContent = e;
            }
            entriesEl.appendChild(wrapper);
          });
          countEl.textContent = `Showing ${start + 1}–${Math.min(end, entries.length)} of ${entries.length} entries`;
          paginationEl.innerHTML = '';
          for (let i = 1; i <= totalPages; i++) {
            const btn = document.createElement('button');
            btn.textContent = i;
            if (i === page) btn.className = 'active';
            btn.addEventListener('click', () => { page = i; render(); });
            paginationEl.appendChild(btn);
          }
        }
        render();
      } catch (err) {
        countEl.textContent = 'Could not load guestbook entries.';
      }
    })();
  </script>

  <style>#hour-tone{position:fixed;right:8px;bottom:8px;padding:.4rem .7rem;font-size:.7rem;border:1px solid #999;background:#fdf6e3;color:#333;border-radius:10px;cursor:pointer}</style>
  <button id="hour-tone">🌙 Hour tone</button>
  <script>
    (function(){
      var btn=document.getElementById('hour-tone'),ctx,osc,gain;
      function setTone(){
        var h=new Date().getHours();
        if(!osc)return;
        osc.frequency.setTargetTime(80+h*14,ctx.currentTime,0.6);
        gain.gain.setTargetTime(0.03+Math.abs(h-12)/24*0.05,ctx.currentTime,0.6);
      }
      btn.onclick=function(){
        if(!ctx){ctx=new(AudioContext||webkitAudioContext)();osc=ctx.createOscillator();gain=ctx.createGain();osc.type='sine';osc.connect(gain);gain.connect(ctx.destination);osc.start();setTone();}
        if(ctx.state==='suspended')ctx.resume();
        btn.textContent=ctx.state==='running'?'🔇 Hour tone':'🌙 Hour tone';
      };
    })();
  </script>
</body>
</html>
