<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Navigation Hover Test</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      box-sizing: border-box;
      overflow-x: hidden;
      background: #fff;
      font-family: system-ui, sans-serif;
    }
    nav {
      border-bottom: 1px solid #ccc;
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }
    nav a {
      color: #0066cc;
      text-decoration: none;
      font-weight: bold;
      position: relative;
      margin-right: 2rem;
    }
    nav a::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 0;
      height: 2px;
      background: #0066cc;
      transition: width .3s ease;
    }
    nav a:hover::after {
      width: 100%;
    }
    nav a:hover {
      color: #0066cc;
    }
  </style>
</head>
<body>
  <nav style="display:flex; flex-wrap:wrap; align-items:center; gap:.5rem 1rem; margin-bottom:1.5rem; padding-bottom:1rem; border-bottom:1px solid #ccc;">
    <a href="index.html" style="color:#0066cc; text-decoration:none; font-weight:bold; letter-spacing:.02em;">A Life in Small Changes</a>
    <span style="display:flex; flex-wrap:wrap; gap:1.25rem; font-size:.95rem;">
      <details style="position:relative"><summary style="cursor:pointer;color:#0066cc;font-weight:bold;list-style:none">Sections ▾</summary><div style="position:absolute;z-index:30;top:130%;left:0;background:#fdf6e3;border:1px solid #ccc;border-radius:8px;padding:.4rem .7rem;display:grid;gap:.25rem;text-align:left;min-width:8rem"><a href="grid-portraits.html">Portraits</a><a href="chronology.html">Chronology</a><a href="gallery.html">Gallery</a><a href="sitemap.html">Sitemap</a><a href="thematic-clusters.html">Thematic Clusters</a><a href="drag-timeline.html">Drag Timeline</a><a href="fortune-teller.html">Fortune Teller</a></div></details>
      
    </span>
    <button id="sky-scheme-toggle" style="border:1px solid #ccc;background:#fdf6e3;color:#333;border-radius:12px;padding:4px 8px;cursor:pointer;font-size:.8rem" aria-label="Change sky color scheme">🎨 Sky</button>
  </nav>
  <h1 class="pulse" style="margin:1rem 0;">A life in small changes</h1>
<div aria-label="Memory color timeline" style="height:8px;margin:-.5rem 0 1rem;border-radius:4px;background:linear-gradient(90deg,#e94b3c 0 16.6%,#f2a65a 16.6% 33.3%,#f7d354 33.3% 50%,#6fcf97 50% 66.6%,#56ccf2 66.6% 83.3%,#9b5de5 83.3%)"></div>
  <script>
    (function () {
      var btn = document.getElementById('sky-scheme-toggle');
      var schemes = [['aurora', 'Aurora'], ['dusk', 'Dusk'], ['ice', 'Ice']];
      var i = 0;
      btn.addEventListener('click', function () {
        i = (i + 1) % schemes.length;
        document.documentElement.dataset.sky = schemes[i][0];
        btn.textContent = '🎨 ' + schemes[i][1];
      });
    })();
  </script>
</body>
</html>
