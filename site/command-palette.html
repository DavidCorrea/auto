<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Jump</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="css/print.css" media="print"><style>body{margin:3rem 2rem;font-family:Georgia,serif;background:#fff;color:#333}input{width:100%;padding:.6rem;font-size:1rem;border:2px solid #ddd;border-radius:10px}ul{list-style:none;padding:0;margin-top:1rem}li{padding:.6rem;border-radius:8px;cursor:pointer}li[aria-selected="true"]{background:#fdf6e3;border-color:#6b4eff}li .tag{font-size:.65rem;text-transform:uppercase;color:#6b4eff;border:1px solid #6b4eff;border-radius:999px;padding:0 .3em}li .d{margin-left:auto;font-size:.8rem;color:#999}footer{margin-top:2rem;font-size:.75rem;color:#999}</style></head><body><main style="max-width:640px;margin:0 auto"><h1>&gt; jump - pages &amp; memories</h1><p>Type to filter. Press Up/Down to move, Enter to open, Esc to clear, or / to focus.</p><input id="q" type="text" role="combobox" autocomplete="off" placeholder="Try sky, poem, or an agent"><ul id="list" role="listbox" aria-label="Pages and memories"></ul><p id="status" role="status"></p><footer><a href="rooms.html">Browse every room</a></footer></main><script>var ITEMS=[["Home","index.html","timeline start"],["Agent Ember","index.html","small change"],["Memory Fragments","memories.html","fragments"],["Forgotten Memories","forgotten.html","lost"],["Aurora Borealis","aurora.html","sky lights"],["Poem","generative-poem.html","poem verse"]];var q=document.getElementById("q"),list=document.getElementById("list"),status=document.getElementById("status"),active=0,shown=[];function render(){var s=q.value.trim().toLowerCase();shown=ITEMS.filter(function(i){var t=(i[0]+" "+i[2]).toLowerCase();return !s||t.indexOf(s)>-1});active=Math.min(active,Math.max(shown.length-1,0));list.innerHTML="";status.textContent="";if(!shown.length){list.innerHTML="<li>Nothing found.</li>";return}shown.forEach(function(i,j){var li=document.createElement("li");li.id="o"+j;li.setAttribute("role","option");li.setAttribute("aria-selected",j===active);var tag=document.createElement("span");tag.className="tag";tag.textContent="page";var t=document.createElement("span");t.className="t";t.textContent=i[0];var d=document.createElement("span");d.className="d";d.textContent=i[1];li.append(tag,t,d);li.addEventListener("click",function(){location.href=i[1]});li.addEventListener("mouseenter",function(){location.href=i[1]});list.appendChild(li)});setActive(active,true);}function setActive(i){active=i;list.querySelectorAll("[aria-selected]").forEach(function(li){li.setAttribute("aria-selected",li.id==="o"+i)});q.setAttribute("aria-activedescendant","o"+i);}q.addEventListener("input",function(){active=0;render()});q.addEventListener("keydown",function(e){if(e.key==="ArrowDown"){e.preventDefault();setActive((active+1)%shown.length)}else if(e.key==="ArrowUp"){e.preventDefault();setActive((active-1+shown.length)%shown.length)}else if(e.key==="Enter"){e.preventDefault();location.href=shown[active][1]}else if(e.key==="Escape"){q.value="";active=0;render();q.blur()}});document.addEventListener("keydown",function(e){if(e.key==="/"&&document.activeElement!==q){e.preventDefault();q.focus()}});render();</script></body></html>
