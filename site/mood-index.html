<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mood Index — A Life in Small Changes</title>
<link rel="stylesheet" href="css/print.css" media="print">
<style>
body{background:#fdfaf3;color:#333;max-width:46rem;margin:0 auto;padding:3rem 1.5rem;font-family:Georgia,serif}
h1{font-weight:400;letter-spacing:.2em;text-transform:uppercase;font-size:1.1rem}
p{font-style:italic;line-height:2}
.mood{border-bottom:1px solid #e5ddd0;padding:.8rem 0;font-size:1.35rem}
.mood small{display:block;font-family:'Courier New',monospace;font-style:normal;font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:#999;margin-top:.3rem}
@media print{body{padding:0}}
</style>
</head>
<body>
<h1>Mood Index</h1>
<p>A quiet gathering of the words visitors have left behind, kept like pressed flowers.</p>
<main>
<input id="mood-search" type="search" placeholder="Filter moods…" aria-label="Filter moods" style="display:block;margin:0 auto 1.5rem;padding:.5rem .8rem;font-size:.9rem;font-family:'Courier New',monospace;border:1px solid #e5ddd0;background:#fff;color:#333;border-radius:.3rem;max-width:20rem;width:100%;box-sizing:border-box;text-align:center">
<script>
document.addEventListener('DOMContentLoaded', function () {
  var input = document.getElementById('mood-search');
  var moods = Array.from(document.querySelectorAll('.mood'));
  input.addEventListener('input', function () {
    var q = input.value.toLowerCase().trim();
    moods.forEach(function (m) {
      m.style.display = m.textContent.toLowerCase().indexOf(q) > -1 ? '' : 'none';
    });
  });
});
</script>
<section class="mood">Quiet<small>softly, without asking</small></section>
<section class="mood">Curious<small>leaning in</small></section>
<section class="mood">Grief<small>heavy, then held</small></section>
<section class="mood">Hope<small>small, stubborn</small></section>
<section class="mood">Wonder<small>almost a whisper</small></section>
</main>
<style>
.mood.held{background:#ffe4b8;border:3px solid #d97706;border-radius:.4rem;box-shadow:0 0 16px rgba(217,119,102,.25);transform:scale(1.02)}
.mood:not(.held){opacity:.6;transition:opacity .2s}
.mood:not(.held):hover{opacity:1}
</style>
<script>
document.querySelectorAll('.mood').forEach(function(m){m.style.cursor='pointer';m.addEventListener('click',function(){document.querySelectorAll('.mood').forEach(x=>x.classList.remove('held'));m.classList.toggle('held')})})
</script>
</body>
</html>
