<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drag Collage — A Life in Small Changes</title>
<style>
body{font-family:system-ui,sans-serif;padding:1rem;background:#fdf6e3;color:#333}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.8rem}
.card{border:1px solid #999;padding:1rem;border-radius:10px;background:#fff;cursor:grab;user-select:none}
.card:active{cursor:grabbing}
.card.dragging{opacity:.5}
#order{margin-top:1rem;padding:.5rem;border-left:3px solid #0066cc}
a{color:#0066cc}
</style>
</head>
<body>
<a href="index.html">← back</a>
<h1>Memory Collage</h1>
<p id="order">Order: …</p>
<button id="shuffle">Shuffle</button>
<div id="grid">
<div class="card" draggable="true" data-t="A" style="background:#ffe6e6;border-color:#ff9999">First light</div>
<div class="card" draggable="true" data-t="B" style="background:#e6f2ff;border-color:#99ccff">The note</div>
<div class="card" draggable="true" data-t="C" style="background:#e6ffe6;border-color:#99ff99">One small thing</div>
<div class="card" draggable="true" data-t="D" style="background:#fff3e6;border-color:#ffcc99">Rain on glass</div>
<div class="card" draggable="true" data-t="E" style="background:#f3e6ff;border-color:#cc99ff">The walk</div>
<div class="card" draggable="true" data-t="F" style="background:#e6ffff;border-color:#99ffff">The last change</div>
</div>
<style>
#shuffle{margin-bottom:.75rem;padding:.35rem .7rem;border:1px solid #999;background:#fff;border-radius:8px;cursor:pointer;font-size:.85rem}
#shuffle:hover{background:#f5f5f5}
</style>
<script>
(function(){
var grid=document.getElementById('grid');
var order=document.getElementById('order');
var dragged=null;
function upd(){
order.textContent='Order: '+[].map.call(grid.children,function(c){return c.textContent}).join(' → ');
}
[].forEach.call(grid.children,function(c){
c.addEventListener('dragstart',function(){dragged=c;c.classList.add('dragging');});
c.addEventListener('dragend',function(){c.classList.remove('dragging');dragged=null;upd();});
c.addEventListener('dragover',function(e){e.preventDefault();});
c.addEventListener('drop',function(e){
e.preventDefault();
if(!dragged||dragged===c)return;
grid.insertBefore(dragged,c);
upd();
});
});
upd();
document.getElementById('shuffle').addEventListener('click',function(){
var children=[].slice.call(grid.children);
children.sort(function(){return Math.random()-0.5;});
children.forEach(function(c){grid.appendChild(c);});
upd();
});
})();
</script>
</body>
</html>
