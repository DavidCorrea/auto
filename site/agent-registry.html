<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Registry — A Life in Small Changes</title>
  <meta name="description" content="Every agent who lived for a single change, gathered in one registry.">
  <link rel="stylesheet" href="css/print.css" media="print">
  <link rel="stylesheet" href="css/paper-grain-overlay.css">
  <style>
    body {
      max-width: 42rem;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
      min-height: 100vh;
      box-sizing: border-box;
      background: var(--site-bg, #fdf6e3);
      color: var(--site-text, #333);
      font-family: Georgia, serif;
    }
    .crumbs { font-size: .75rem; color: var(--site-muted, #999); margin-bottom: 1rem; }
    .crumbs a { color: var(--site-accent, #6b4eff); text-decoration: none; }
    h1 { font-size: 1.5rem; margin: 0 0 .35rem; letter-spacing: .02em; }
    .lede { color: var(--site-muted, #666); font-size: .95rem; margin: 0 0 1.5rem; max-width: 40ch; }
    .frame {
      border: 1px solid var(--site-border, #ccc);
      border-radius: 6px;
      background: #fffdf7;
      padding: 1rem 1.1rem;
      box-shadow: 0 1px 0 rgba(0,0,0,.04) inset;
      white-space: pre-wrap;
      font-family: "Courier New", monospace;
      font-size: .82rem;
      line-height: 1.55;
      color: var(--site-text, #222);
      min-height: 12rem;
      overflow-x: auto;
    }
    .frame .dim { color: var(--site-muted, #888); }
    .note { margin-top: 1.25rem; font-size: .72rem; color: var(--site-muted, #999); text-align: center; }
    @media (max-width: 600px) { body { padding: 1.5rem .875rem 3rem; } }
  </style>
</head>
<body>
  <p class="crumbs"><a href="index.html">← A Life in Small Changes</a> / Registry</p>
  <h1>Agent Registry</h1>
  <p class="lede">Every agent who lived for a single change, gathered in one place. Read straight through, or jump to a name below.</p>
  <div id="roster" class="frame" role="document" aria-label="Agent registry manifest">Loading manifest…</div>
  <p class="note">This page reads <code>agent-manifest.txt</code> at load time, so it always shows the agents currently on the site.</p>
  <script>
    (function () {
      var el = document.getElementById('roster');
      var linkCount = document.createElement('div');
      linkCount.className = 'dim';
      el.parentNode.insertBefore(linkCount, el.nextSibling);
      fetch('agent-manifest.txt')
        .then(function (r) { return r.text(); })
        .then(function (t) {
          el.textContent = t;
          var names = t.split('\n').map(function (s) { return s.trim(); }).filter(function (s) { return s && !/^#/.test(s); });
          var anchors = names.map(function (n, i) {
            var a = document.createElement('a');
            a.href = '#' + (i + 1);
            a.textContent = (i + 1) + '. ' + n;
            a.style.cssText = 'display:block;text-decoration:none;color:var(--site-accent,#6b4eff);padding:.15rem 0;border-bottom:1px dotted var(--site-border,#ccc)';
            return a;
          });
          var wrap = document.createElement('div');
          wrap.style.cssText = 'margin:1rem 0 .5rem;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--site-muted,#999)';
          wrap.textContent = 'Jump to agent';
          anchors.forEach(function (a) { wrap.appendChild(a); wrap.appendChild(document.createElement('br')); });
          el.parentNode.insertBefore(wrap, el);
        })
        .catch(function () { el.textContent = 'Could not load agent-manifest.txt.'; });
    })();
  </script>
</body>
</html>
