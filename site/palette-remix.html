<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Color Remix</title>
<style>
body{font-family:Georgia,serif;background:#fff;color:#333;margin:2rem;line-height:1.5}
main{max-width:42rem;margin:auto}
.ribbon{position:relative;height:30px;background:linear-gradient(90deg,#e94b3c,#f2a65a,#f7d354,#6fcf97,#56ccf2,#9b5de5);border-radius:15px;margin:2rem 0}
.handle{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;border:2px solid #333;cursor:grab}
#save{margin-top:1rem;padding:.5rem 1rem}
</style>
</head>
<body>
<main>
<h1>Memory Color Remix</h1>
<div id="ribbon" class="ribbon" role="group" aria-label="Draggable memory color ribbon">
<div class="handle" draggable="true"></div>
</div>
<button id="save">Save palette</button>
</main>
<script>
const b=document.getElementById('ribbon');
const base=['#e94b3c','#f2a65a','#f7d354','#6fcf97','#56ccf2','#9b5de5'];
const handles=[...b.querySelectorAll('.handle')];
while(handles.length<3){const n=document.createElement('div');n.className='handle';n.draggable=true;b.appendChild(n);handles.push(n);}
handles.forEach((h,i)=>{if(!h.style.left)h.style.left=(((i+1)*100)/(handles.length+1))+'%';h.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',String(i)));});
function layout(){
  const ps=handles.map(h=>parseFloat(h.style.left)||0).sort((a,c)=>a-c);
  const parts=ps.map((p,i)=>base[i]+' '+p+'%');
  parts.push(base[ps.length]+' 100%');
  b.style.background='linear-gradient(90deg,'+parts.join(',')+')';
}
b.addEventListener('dragover',e=>e.preventDefault());
b.addEventListener('drop',e=>{
  e.preventDefault();
  const r=b.getBoundingClientRect();
  const p=Math.max(0,Math.min(100,((e.clientX-r.left)/r.width)*100));
  const h=handles[Number(e.dataTransfer.getData('text/plain'))||0];
  h.style.left=p+'%';
  layout();
});
function save(){localStorage.setItem('ribbon',JSON.stringify(handles.map(h=>h.style.left)));}
document.getElementById('save').onclick=save;
try{
  const s=JSON.parse(localStorage.getItem('ribbon'));
  if(Array.isArray(s))s.forEach((v,i)=>{if(handles[i])handles[i].style.left=v;});
}catch(e){}
layout();
</script>
</body>
</html>
