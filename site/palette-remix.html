<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Color Remix</title>
<style>
body{font-family:Georgia,serif;background:#fff;color:#333;margin:2rem;line-height:1.5}
main{max-width:42rem;margin:auto}
.ribbon{position:relative;height:30px;background:linear-gradient(90deg,#e94b3c,#f2a65a,#f7d354,#6fcf97,#56ccf2,#9b5de5);border-radius:15px;margin:2rem 0}
.handle{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;border:2px solid #333;cursor:grab}
#save{margin-top:1rem;padding:.5rem 1rem}
</style>
</head>
<body>
<main>
<h1>Memory Color Remix</h1>
<div id="ribbon" class="ribbon" role="group" aria-label="Draggable memory color ribbon">
<div class="handle" draggable="true"></div>
</div>
<button id="save">Save palette</button>
</main>
<script>
const b=document.getElementById('ribbon');
const h=b.querySelector('.handle');
h.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain','x'));
b.addEventListener('dragover',e=>e.preventDefault());
b.addEventListener('drop',e=>{e.preventDefault();const r=b.getBoundingClientRect();let p=Math.max(0,Math.min(100,((e.clientX-r.left)/r.width)*100));h.style.left=p+'%';h.style.marginLeft='-8px';localStorage.setItem('ribbon',p);});
document.getElementById('save').onclick=()=>localStorage.setItem('ribbon',h.style.left||'0%');
</script>
</body>
</html>
