<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shuffle the Memories</title><style>:root{--b:#fff;--t:#333;--m:#999;--a:#ccc;--ac:#0066cc;--mf:#fdf6e3}[data-theme="dark"]{--b:#1a1a1a;--t:#f0f0f0;--m:#aaa;--a:#555;--ac:#8ab4ff;--mf:#333}body{margin:0;padding:2rem;background:var(--b);color:var(--t);font-family:Georgia,serif;line-height:1.55;transition:background .3s,color .3s}header{max-width:42rem;margin:0 auto 1.5rem;border-bottom:1px solid var(--a);padding-bottom:.75rem}a{color:var(--ac)}h1{font-size:1.3rem;margin:0 0 .4rem}p.sub{margin:0;color:var(--m);font-size:.85rem}#deck{max-width:42rem;margin:0 auto;display:grid;gap:.9rem}.card{border-left:3px solid var(--t);padding:.5rem 0 .5rem .9rem}.card h2{margin:0 0 .25rem;font-size:.95rem;letter-spacing:.02em}.card p{margin:0;font-size:.9rem}.card .n{font-size:.65rem;text-transform:uppercase;letter-spacing:.14em;color:var(--m)}.fade{animation:in .45s ease backwards}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.fade{animation:none}}#shuffle{display:block;margin:1.5rem auto 0;padding:.55rem 1.15rem;font:inherit;font-size:.85rem;letter-spacing:.05em;border:1px solid var(--a);background:var(--mf);color:var(--t);border-radius:16px;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}#shuffle:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.15)}footer{max-width:42rem;margin:2rem auto 0;border-top:1px solid var(--a);padding-top:.6rem;font-size:.7rem;color:var(--m);text-align:center}</style><script>(function(){var t=localStorage.getItem('site-theme');if(t)document.documentElement.dataset.theme=t;})();</script></head><body><header><h1>Shuffle the memories</h1><p class="sub">Six small changes, read in a new order each time. · <a href="index.html">back</a></p></header><main id="deck" aria-live="polite"></main><button id="shuffle" type="button">🔀 Shuffle
