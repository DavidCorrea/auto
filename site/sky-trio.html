<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Trio — A Life in Small Changes</title>
<meta name="description" content="One sky, three moods: drift, particles, mirror. Replaces sky-drift, sky-particles and sky-mirror.">
<style>
body{margin:0;min-height:100vh;overflow:hidden;background:#0b1026;color:#eef;font-family:system-ui,sans-serif}
#stage{position:fixed;inset:0}
#drift{position:absolute;inset:-20%;background:radial-gradient(40% 40% at 30% 30%,#9b5de5 0,transparent 70%),radial-gradient(35% 35% at 70% 60%,#56ccf2 0,transparent 70%),radial-gradient(45% 45% at 50% 80%,#f2a65a 0,transparent 70%),#0b1026;animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(6%,4%) rotate(8deg)}}
#particles{position:absolute;inset:0}
.dot{position:absolute;bottom:-10px;border-radius:50%;background:#fff;opacity:.8;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-110vh);opacity:0}}
#mirror{position:absolute;inset:0;background:linear-gradient(120deg,#1a1a2e,#16213e,#0f3460)}
header{position:fixed;top:0;left:0;right:0;display:flex;gap:.5rem;align-items:center;padding:1rem;z-index:5}
h1{font-size:1rem;margin-right:auto;font-weight:600;letter-spacing:.05em}
button{border:1px solid #56ccf2;background:rgba(255,255,255,.08);color:#eef;border-radius:12px;padding:.4rem .8rem;cursor:pointer;font-size:.85rem}
button.on{background:#56ccf2;color:#0b1026}
footer{position:fixed;bottom:0;left:0;right:0;padding:.6rem;text-align:center;font-size:.7rem;color:#9aa;z-index:5}
a{color:#56ccf2}
@media (prefers-reduced-motion:reduce){#drift{animation:none}.dot{animation-duration:30s!important}}
</style>
</head>
<body>
<div id="stage">
  <div id="drift"></div>
  <div id="particles" hidden></div>
  <div id="mirror" hidden></div>
</div>
<header>
  <h1>SKY TRIO</h1>
  <button data-mode="drift" class="on">🌫 Drift</button>
  <button data-mode="particles">✨ Particles</button>
  <button data-mode="mirror">🪞 Mirror</button>
</header>
<footer>One sky, three moods — replaces <a href="sky-drift.html">sky-drift</a> · <a href="sky-particles.html">sky-particles</a> · <a href="sky-mirror.html">sky-mirror</a> — <a href="index.html">← back to the life</a></footer>
<script>
(function(){
  var panes={drift:document.getElementById('drift'),particles:document.getElementById('particles'),mirror:document.getElementById('mirror')};
  var btns=document.querySelectorAll('button[data-mode]');
  function show(m){for(var k in panes){panes[k].hidden=(k!==m)}}
  function makeParticles(){
    var box=panes.particles;
    for(var i=0;i<60;i++){
      var d=document.createElement('span');
      d.className='dot';
      var s=2+Math.random()*4;
      d.style.width=s+'px';d.style.height=s+'px';
      d.style.left=(Math.random()*100)+'%';
      d.style.animationDuration=(6+Math.random()*10)+'s';
      d.style.animationDelay=(-Math.random()*12)+'s';
      box.appendChild(d);
    }
  }
  btns.forEach(function(b){
    b.addEventListener('click',function(){
      btns.forEach(function(o){o.classList.toggle('on',o===b)});
      var m=b.getAttribute('data-mode');
      if(m==='particles'&&!panes.particles.childElementCount)makeParticles();
      show(m);
    });
  });
  document.addEventListener('mousemove',function(e){
    if(panes.mirror.hidden)return;
    var x=e.clientX/innerWidth,y=e.clientY/innerHeight;
    panes.mirror.style.filter='hue-rotate('+Math.round(x*160-40)+'deg) brightness('+(0.9+y*0.4).toFixed(2)+')';
  });
  document.addEventListener('keydown',function(e){
    var m={Digit1:'drift',Digit2:'particles',Digit3:'mirror'}[e.code];
    if(m){var b=document.querySelector('button[data-mode="'+m+'"]');if(b)b.click()}
  });
})();
</script>
</body>
</html>
