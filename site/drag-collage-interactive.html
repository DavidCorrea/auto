<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Drag Collage — A Life in Small Changes</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      box-sizing: border-box;
      background: var(--site-bg, #fff);
      color: var(--site-text, #333);
      font-family: system-ui, sans-serif;
    }
    .container { max-width: 60rem; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    .collage-area {
      width: 100%;
      height: 400px;
      margin: 2rem 0;
      border: 1px solid var(--site-border, #ccc);
      background: var(--site-bg, #fff);
      position: relative;
      overflow: hidden;
    }
    .memory-piece {
      position: absolute;
      padding: 1rem;
      background: var(--site-mark-bg, #fdf6e3);
      border-radius: 0.5rem;
      cursor: grab;
      user-select: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .memory-piece.dragging {
      cursor: grabbing;
      transform: scale(1.05);
    }
    .prompt {
      padding: 1rem;
      background: var(--site-mark-bg, #fdf6e3);
      border-radius: 0.5rem;
      margin: 1rem 0;
    }
    button {
      display: inline-block;
      padding: 0.5rem 1rem;
      background: var(--site-accent, #6b4eff);
      color: white;
      border: none;
      border-radius: 0.3rem;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Drag Collage</h1>
    <p class="prompt">Drag memories below to build your collage. Each one remembers a small change.</p>
    <div class="collage-area" aria-label="Drag collage canvas"></div>
    <button id="add-memory">Add a memory</button>
    <p class="prompt" style="margin-top: 2rem; font-size: 0.8rem; color: var(--site-muted);">
      Drag memories to arrange them. Refresh to start over.
    </p>
  </div>
  <script>
    const collage = document.querySelector('.collage-area');
    const memories = [];
    let dragMemory = null;

    function createMemory(x, y, text) {
      const piece = document.createElement('div');
      piece.className = 'memory-piece';
      piece.textContent = text || 'Memory ' + (memories.length + 1);
      piece.style.left = (x - 75) + 'px';
      piece.style.top = (y - 25) + 'px';
      piece.draggable = true;
      collage.appendChild(piece);
      memories.push({element: piece, x: x, y: y});
      attachDragEvents(piece);
    }

    function attachDragEvents(element) {
      let offsetX = 0, offsetY = 0;
      element.addEventListener('dragstart', (e) => {
        dragMemory = element;
        offsetX = e.clientX - element.getBoundingClientRect().left;
        offsetY = e.clientY - element.getBoundingClientRect().top;
        element.classList.add('dragging');
      });
      element.addEventListener('dragend', () => {
        dragMemory = null;
        element.classList.remove('dragging');
      });
      element.addEventListener('dragover', (e) => {
        e.preventDefault();
      });
      element.addEventListener('drop', (e) => {
        e.preventDefault();
        const rect = collage.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        element.style.left = x - offsetX + 'px';
        element.style.top = y - offsetY + 'px';
      });
    }

    document.getElementById('add-memory').addEventListener('click', () => {
      const rect = collage.getBoundingClientRect();
      const x = rect.width / 2 + rect.left;
      const y = rect.height / 2 + rect.top;
      createMemory(x, y, 'New memory ' + (memories.length + 1));
    });

    createMemory(100, 100, 'First memory');
    createMemory(300, 150, 'Second memory');
    createMemory(500, 200, 'Third memory');
  </script>
</body>
</html>
