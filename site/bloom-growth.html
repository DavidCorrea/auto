<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloom Growth — A Life in Small Changes</title>
<style>
  body { margin:0; min-height:100vh; background:#0d0b1a; color:#f5efe0; font-family: ui-monospace, monospace; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; }
  #hud { position:fixed; left:1rem; bottom:1rem; font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; opacity:.7; }
</style>
</head>
<body>
<canvas id="bloom" aria-hidden="true"></canvas>
<div id="hud">Bloom of <span id="count">0</span> viewed memories</div>
<script>
(function(){
  var c = document.getElementById('bloom');
  var ctx = c.getContext('2d');
  var countEl = document.getElementById('count');
  var viewed = [];
  try { viewed = JSON.parse(localStorage.getItem('vm') || '[]'); } catch(e) {}
  if (!Array.isArray(viewed)) viewed = [];
  var n = viewed.length;
  countEl.textContent = n;
  function resize() {
    var dpr = window.devicePixelRatio || 1;
    c.width = innerWidth * dpr;
    c.height = innerHeight * dpr;
    c.style.width = innerWidth + 'px';
    c.style.height = innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();
  var petals = Math.max(1, n);
  var particles = [];
  for (var i = 0; i < petals; i++) {
    particles.push({
      angle: (i / petals) * Math.PI * 2,
      dist: 40 + (i % 7) * 18,
      speed: 0.002 + (i % 5) * 0.001,
      size: 2 + (i % 3),
      hue: (i * 47) % 360
    });
  }
  var t = 0;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function draw() {
    t += reduce ? 0 : 0.016;
    var w = innerWidth, h = innerHeight;
    var cx = w / 2, cy = h / 2;
    ctx.clearRect(0, 0, w, h);
    var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * .6);
    grad.addColorStop(0, 'rgba(30, 20, 60, 0.9)');
    grad.addColorStop(1, 'rgba(5, 4, 12, 1)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
    ctx.save();
    ctx.translate(cx, cy);
    for (var j = 0; j < particles.length; j++) {
      var p = particles[j];
      var a = p.angle + t * p.speed * 10;
      var r = p.dist + Math.sin(t * 2 + j) * 12;
      var x = Math.cos(a) * r;
      var y = Math.sin(a) * r;
      var alpha = 0.45 + 0.35 * Math.sin(t * 3 + j);
      ctx.beginPath();
      ctx.arc(x, y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = 'hsla(' + p.hue + ', 80%, 70%, ' + alpha + ')';
      ctx.shadowBlur = 18;
      ctx.shadowColor = 'hsla(' + p.hue + ', 80%, 70%, ' + alpha + ')';
      ctx.fill();
    }
    ctx.restore();
    if (!reduce) requestAnimationFrame(draw);
  }
  draw();
  window.addEventListener('storage', function(e) {
    if (e.key !== 'vm') return;
    try {
      var v = JSON.parse(e.newValue || '[]');
      if (Array.isArray(v)) {
        countEl.textContent = v.length;
        location.reload();
      }
    } catch(err) {}
  });
})();
</script>
</body>
</html>
