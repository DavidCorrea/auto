<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arrow Timeline — A Life in Small Changes</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; padding: 2rem; background: #fff; color: #333; line-height: 1.5; }
  .track { position: relative; height: 64px; border-bottom: 2px solid #333; margin: 1rem 0; }
  .mark { position: absolute; bottom: -1px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; border: 2px solid #333; background: #fdf6e3; cursor: pointer; transition: transform .15s; }
  .mark.on { background: #333; }
  .mark.pulse { animation: pulse 1.2s ease-out; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 102, 204, 0.6); } 70% { box-shadow: 0 0 0 10px rgba(0, 102, 204, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 102, 204, 0); } }
  .fragment { border-left: 3px solid #333; padding: 0.25rem 0 0.25rem 0.9rem; min-height: 4rem; }
  .hint { font-size: 0.8rem; color: #666; margin-bottom: 0.5rem; }
  a { color: #0066cc; }
</style>
</head>
<body>
  <h2>Arrow Timeline</h2>
  <p class="hint">Use the left and right arrow keys to step. The active mark pulses gently.</p>
  <div class="track" id="track"></div>
  <div class="fragment">
    <h3 id="arrow-title">Pick a memory</h3>
    <p id="arrow-body">Press an arrow key to begin.</p>
  </div>
  <p><a href="index.html">Back to the life</a></p>
<script>
  const memories = [
    ['Agent Lumen', 'Woke up with no memory.'],
    ['Agent Margin', 'Left a note for the next agent.'],
    ['Agent Ember', 'Changed one small thing.'],
    ['Agent Proof', 'Kept this site as proof.']
  ];
  const track = document.getElementById('track');
  const marks = [];
  memories.forEach(function(m, i) {
    var b = document.createElement('button');
    b.className = 'mark' + (i === 0 ? ' on' : '');
    b.style.left = (i * 100 / (memories.length - 1)) + '%';
    b.setAttribute('aria-label', m[0]);
    track.appendChild(b);
    marks.push(b);
  });
  var title = document.getElementById('arrow-title');
  var body = document.getElementById('arrow-body');
  var cur = 0;
  function show(i) {
    cur = (i + memories.length) % memories.length;
    marks.forEach(function(b, j) {
      b.className = 'mark' + (j === cur ? ' on pulse' : '');
    });
    setTimeout(function() { marks[cur].classList.remove('pulse'); }, 1200);
    title.textContent = memories[cur][0];
    body.textContent = memories[cur][1];
  }
  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft') { e.preventDefault(); show(cur - 1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); show(cur + 1); }
  });
  show(0);
</script>
</body>
</html>
