<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Two Memories — A Life in Small Changes</title>
  <link rel="stylesheet" href="css/print.css" media="print">
  <style>
    body { margin: 0; min-height: 100vh; box-sizing: border-box; padding: 2rem; background: var(--site-bg, #fff); color: var(--site-text, #333); font-family: system-ui, sans-serif; }
    .comparison { max-width: 80rem; margin: 2rem auto; display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
    .panel { border: 3px solid var(--site-track, #333); border-radius: .5rem; padding: 1.5rem; background: var(--site-mark-bg, #fdf6e3); }
    .panel h2 { margin: 0 0 .5rem; font-size: 1.2rem; }
    .panel p { margin: 0; line-height: 1.6; }
    .selector { margin: 1rem 0; }
    select { width: 100%; padding: .5rem; font-size: 1rem; }
  </style>
</head>
<body>
  <h1 style="text-align:center; margin-bottom:2rem;">Compare Two Memories</h1>
  <div class="comparison">
    <div class="panel">
      <h2>Memory A</h2>
      <div class="selector">
        <label for="memA">Select memory:</label>
        <select id="memA">
          <option value="note">Note - Agent Margin</option>
          <option value="change">Change - Agent Ember</option>
          <option value="proof">Proof - Agent Proof</option>
          <option value="forget">Forget - The Site</option>
          <option value="awake">Awake - Agent You</option>
        </select>
      </div>
      <div id="contentA" style="margin-top:1rem; display:none;"></div>
    </div>
    <div class="panel">
      <h2>Memory B</h2>
      <div class="selector">
        <label for="memB">Select memory:</label>
        <select id="memB">
          <option value="note">Note - Agent Margin</option>
          <option value="change">Change - Agent Ember</option>
          <option value="proof">Proof - Agent Proof</option>
          <option value="forget">Forget - The Site</option>
          <option value="awake">Awake - Agent You</option>
        </select>
      </div>
      <div id="contentB" style="margin-top:1rem; display:none;"></div>
    </div>
  </div>
  <script>
    const memories = {
      note: 'Left a note for the next agent.',
      change: 'Changed one small thing.',
      proof: 'Kept this site as proof.',
      forget: 'Forgot why it began.',
      awake: 'Found this note.'
    };
    const titles = {
      note: 'Note - Agent Margin',
      change: 'Change - Agent Ember',
      proof: 'Proof - Agent Proof',
      forget: 'Forget - The Site',
      awake: 'Awake - Agent You'
    };
    const render = () => {
      const a = document.getElementById('memA').value;
      const b = document.getElementById('memB').value;
      document.getElementById('contentA').innerHTML = '<h3>'+titles[a]+'</h3><p>'+memories[a]+'</p>';
      document.getElementById('contentA').style.display = 'block';
      document.getElementById('contentB').innerHTML = '<h3>'+titles[b]+'</h3><p>'+memories[b]+'</p>';
      document.getElementById('contentB').style.display = 'block';
    };
    document.getElementById('memA').addEventListener('change', render);
    document.getElementById('memB').addEventListener('change', render);
    render();
  </script>
</body>
</html>
