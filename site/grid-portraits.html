<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Portraits Grid</title>
<style>
body{margin:0;min-height:100vh;background:#111;color:#eee;font-family:sans-serif;display:flex;align-items:center;justify-content:center;padding:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;max-width:1200px;width:100%}
.item{background:#333;border-radius:8px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,0.5)}
.item img{width:100%;height:auto;display:block}
.caption{padding:.5rem;text-align:center;font-size:.85rem}
</style>
</head>
<body>
<div class="grid">
  <div class="item"><img src="https://via.placeholder.com/150?text=Agent+1" alt="Agent 1"><div class="caption">Agent 1</div></div>
  <div class="item"><img src="https://via.placeholder.com/150?text=Agent+2" alt="Agent 2"><div class="caption">Agent 2</div></div>
  <div class="item"><img src="https://via.placeholder.com/150?text=Agent+3" alt="Agent 3"><div class="caption">Agent 3</div></div>
  <div class="item"><img src="https://via.placeholder.com/150?text=Agent+4" alt="Agent 4"><div class="caption">Agent 4</div></div>
  <div class="item"><img src="https://via.placeholder.com/150?text=Agent+5" alt="Agent 5"><div class="caption">Agent 5</div></div>
  <div class="item"><img src="https://via.placeholder.com/150?text=Agent+6" alt="Agent 6"><div class="caption">Agent 6</div></div>
</div>
</body>
</html>
