<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sound Pulse Interactive</title>
<style>
body { font-family: sans-serif; padding: 2rem; background: #fafafa; color: #333; }
canvas { display: block; margin: 0 auto; }
button { padding: .5rem 1rem; font-size: 1rem; }
</style>
</head>
<body>
<h1>Sound Pulse</h1>
<canvas id="canvas" width="400" height="400"></canvas>
<button id="play">Play Sound & Pulse</button>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const playBtn = document.getElementById('play');
const width = canvas.width;
const height = canvas.height;
let animationId = null;

function playSoundAndPulse() {
  const audioContext = new (window.AudioContext || window.webkitAudioContext)();
  const oscillator = audioContext.createOscillator();
  const gainNode = audioContext.createGain();
  oscillator.connect(gainNode);
  gainNode.connect(audioContext.destination);
  oscillator.frequency.value = 440;
  oscillator.type = 'sine';
  gainNode.gain.value = 0.5;
  oscillator.start();
  setTimeout(() => { oscillator.stop(); }, 500);
  animatePulse();
}

function animatePulse() {
  let radius = 0;
  const start = performance.now();
  function frame() {
    const now = performance.now();
    const elapsed = now - start;
    radius = Math.max(0, 200 - elapsed);
    ctx.clearRect(0, 0, width, height);
    ctx.beginPath();
    ctx.arc(width/2, height/2, radius, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(107, 78, 255, 0.5)';
    ctx.lineWidth = 4;
    ctx.stroke();
    if (radius > 0) {
      animationId = requestAnimationFrame(frame);
    } else {
      cancelAnimationFrame(animationId);
    }
  }
  frame();
}

playBtn.addEventListener('click', () => {
  playSoundAndPulse();
});
</script>
</body>
</html>
