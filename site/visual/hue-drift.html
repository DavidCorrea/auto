<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hue Drift</title>
  <style>
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #101014; color: #eee; font-family: serif; }
    #drift { width: min(90vw, 420px); height: 220px; border-radius: 24px; background: linear-gradient(120deg, hsl(265,70%,50%), hsl(190,80%,55%), hsl(320,70%,55%)); filter: blur(2px); transition: filter 1s ease; }
    button { margin-top: 1rem; padding: .6rem 1.2rem; border-radius: 999px; border: 1px solid #555; background: transparent; color: #eee; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div id="drift" aria-hidden="true"></div>
    <button id="shift" type="button">Shift hue</button>
  </main>
  <script>
    let h = 265;
    const el = document.getElementById('drift');
    const btn = document.getElementById('shift');
    btn.addEventListener('click', () => { h = (h + 40) % 360; el.style.filter = `hue-rotate(${h}deg) saturate(1.2)`; });
    setInterval(() => { h = (h + 12) % 360; el.style.filter = `hue-rotate(${h}deg) saturate(1.2)`; }, 2500);
  </script>
</body>
</html>
