<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atmosphere</title>
<style>
  body{margin:0;padding:0;overflow:hidden}
  #atmosphere{
    position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(ellipse 85% 55% at 50% 100%, hsl(var(--hue) 30% 95% / 0.12) 0%, transparent 60%),
      radial-gradient(ellipse 70% 45% at 20% 90%, hsl(calc(var(--hue)+20) 35% 92% / 0.08) 0%, transparent 55%),
      radial-gradient(ellipse 60% 40% at 80% 80%, hsl(calc(var(--hue)+40) 30% 90% / 0.07) 0%, transparent 50%);
    opacity:0;
    transition:opacity 180s ease;
    animation: mist-drift 240s ease-in-out infinite alternate;
  }
  @keyframes mist-drift{
    from{transform:translate3d(-3%,1%,0) scale(1.02);filter:blur(30px);}
    to{transform:translate3d(3%-1%,0) scale(1.05);filter:blur(55px);}
  }
  @media (prefers-reduced-motion:reduce){
    #atmosphere{animation:none;transition:none}
  }
</style>
<script>
(function(){
  const skyEl=document.getElementById('sky');
  const atmosphere=document.getElementById('atmosphere');
  function update(){
    const d=new Date();
    const hour=d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;
    // 0-6: cool blue mist, 6-12: light cyan, 12-18: warm amber, 18-24: deep violet
    let hue;
    if(hour<6){hue=210;}
    else if(hour<12){hue=180;}
    else if(hour<18){hue=30;}
    else {hue=270;}
    skyEl.style.setProperty('--hue',hue);
    // opacity varies: higher at dawn/dusk, lower at midday
    let opacity=0.1;
    if((hour>=5 && hour<8) || (hour>=18 && hour<22)) opacity=0.25;
    atmosphere.style.opacity=opacity;
  }
  update();
  setInterval(update,30000);
  // mouse move slight shift
  let tx=0,ty=0;
  document.addEventListener('mousemove',e=>{
    tx=(e.clientX/window.innerWidth-0.5)*6;
    ty=(e.clientY/window.innerHeight-0.5)*4;
  });
  function drift(){
    atmosphere.style.transform=`translate3d(${tx}% ${ty}% ,0) scale(1.03)`;
    requestAnimationFrame(drift);
  }
  drift();
})();
</script>
</head>
<body>
<div id="atmosphere" aria-hidden="true"></div>
<div id="memory-rain" aria-hidden="true" style="position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5"></div>
<script>
(function(){
  var c=['#6b4eff','#e94b3c','#2b6cb0','#805ad5','#f7d354','#6fcf97'];
  var r=document.getElementById('memory-rain');
  for(var i=0;i<30;i++){
    var d=document.createElement('div');
    d.style.cssText='position:absolute;width:5px;height:5px;border-radius:50%;opacity:.6;left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;background:'+(c[Math.floor(Math.random()*c.length)])+';animation:frall '+(Math.random()*7+5)+'s linear '+(Math.random()*8)+'s infinite';
    r.appendChild(d);
  }
  var s=document.createElement('style');
  s.textContent='@keyframes frall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}';
  document.head.appendChild(s);
})();
</script>
<div id="secret" style="position:fixed;left:50%;bottom:10%;transform:translate(-50%,12px);opacity:0;pointer-events:auto;transition:opacity .6s ease,transform .6s ease;background:rgba(20,20,30,.72);color:#f4f1ea;padding:.9rem 1.4rem;border-radius:14px;max-width:min(90vw,34rem);font:16px/1.5 Georgia,serif;z-index:6"><span style="border-bottom:1px dashed rgba(255,255,255,.5);cursor:help">✦ hover</span> <span id="secret-text" style="display:block;margin-top:.45rem;opacity:0;transition:opacity .5s ease">The quietest change is the one you almost didn't make.</span></div>
<script>const s=document.getElementById('secret');const t=document.getElementById('secret-text');s.onmouseenter=()=>{s.style.opacity='.95';s.style.transform='translate(-50%,0)';t.style.opacity='1'};s.onmouseleave=()=>{s.style.opacity='0';s.style.transform='translate(-50%,12px)';t.style.opacity='0'};</script>
</body>
</html>
