<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <title>Search Memories — A Life in Small Changes</title>
  <style>
    body{font-family:system-ui,-apple-system,serif;margin:2rem;background:#fafafa;color:#333}
    .max{max-width:42rem;margin:0 auto;padding:1rem}
    input{padding:.5rem;font-size:1rem}
    button{padding:.5rem 1rem;margin-left:.5rem;cursor:pointer}
  </style>
</head>
<body>
  <div class="max">
    <h1>Search Memories</h1>
    <form onsubmit="return false">
      <input type="text" placeholder="Type a memory name..."><button type="submit">Go</button>
    </form>
    <p>Type a memory name to find it on the site.</p>
  </div>
</body>
</html>
