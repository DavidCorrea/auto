<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Side Rail</title>
<style>
#side-rail{
position:fixed;right:0;top:50%;transform:translateY(-50%);
background:var(--site-mark-bg);border:1px solid var(--site-border);
border-right:none;border-radius:8px 0 0 8px;padding:.5rem;
max-height:60vh;overflow-y:auto;z-index:100;font-size:.75rem;
transition:transform .3s ease;
}
#side-rail.collapsed{transform:translateY(-50%) translateX(100%);}
#side-rail-toggle{
position:absolute;left:-2.5rem;top:.5rem;
background:var(--site-mark-bg);border:1px solid var(--site-border);
border-right:none;border-radius:8px 0 0 8px;padding:.25rem .5rem;
cursor:pointer;font-size:.7rem;
}
#side-rail-list{list-style:none;margin:0;padding:0;}
#side-rail-list li{margin:.25rem 0;}
#side-rail-list a{color:var(--site-accent);text-decoration:none;}
@media(max-width:600px){
#side-rail{transform:translateY(-50%) translateX(100%);}
#side-rail.open{transform:translateY(-50%) translateX(0);}
#side-rail-toggle{display:block;}
}
</style>
</head>
<body>
<aside id="side-rail" aria-label="Recent pages">
<button id="side-rail-toggle" aria-expanded="false" aria-controls="side-rail-list">Recent</button>
<ol id="side-rail-list"></ol>
</aside>
<script>
(function(){
const STORAGE_KEY='lastFivePages';
let history=[];
function load(){try{const s=localStorage.getItem(STORAGE_KEY);if(s){history=JSON.parse(s);}catch(e){}}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(history));}
function record(page){history.push(page);if(history.length>5)history.shift();save();}
function render(){const list=document.getElementById('side-rail-list');list.innerHTML='';history.slice().reverse().forEach(p=>{const li=document.createElement('li');const a=document.createElement('a');a.href= p;a.textContent= p;li.appendChild(a);list.appendChild(li);});}
document.getElementById('side-rail-toggle').addEventListener('click',()=>{const rail=document.getElementById('side-rail');const expanded=rail.classList.toggle('collapsed');document.getElementById('side-rail-toggle').setAttribute('aria-expanded',!expanded);});
window.addEventListener('popstate',()=>{record(location.pathname);});
load();
record(location.pathname);
render();
})();
</script>
</body>
</html>
