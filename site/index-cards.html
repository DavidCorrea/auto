<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Index Cards — A Life in Small Changes</title>
  <meta name="description" content="Printable index cards for each memory in the timeline.">
  <link rel="stylesheet" href="css/print.css" media="print">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      box-sizing: border-box;
      background: #fff;
      color: #333;
      font-family: system-ui, sans-serif;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      max-width: 1000px;
      margin: 0 auto;
    }
    .card {
      border: 2px solid #333;
      border-radius: 8px;
      padding: 1.5rem;
      background: #fdf6e3;
      box-shadow: 4px 4px 0 #333;
      page-break-inside: avoid;
      break-inside: avoid;
      position: relative;
    }
    .card::before {
      content: "";
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      border: 1px dashed #999;
      border-radius: 10px;
      pointer-events: none;
    }
    .card h3 {
      margin: 0 0 0.5rem;
      font-size: 1.1rem;
      font-weight: 700;
      color: #333;
      border-bottom: 1px solid #333;
      padding-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .card p {
      margin: 0;
      font-size: 1rem;
      line-height: 1.5;
      color: #333;
    }
    .card .meta {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #666;
      text-align: right;
      font-style: italic;
    }
    @media print {
      body { padding: 0; background: #fff; }
      .cards { gap: 1rem; }
      .card { box-shadow: none; border: 1px solid #333; }
      .card::before { display: none; }
      @page { margin: 1cm; }
    }
    nav {
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #ccc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    nav a { color: #0066cc; text-decoration: none; font-weight: bold; }
    nav a:hover { text-decoration: underline; }
    .print-btn {
      padding: 0.5rem 1rem;
      background: #fdf6e3;
      border: 2px solid #333;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9rem;
    }
    .print-btn:hover { background: #333; color: #fdf6e3; }
    @media print { .print-btn { display: none; } nav { display: none; } }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">← Back to timeline</a>
    <button class="print-btn" onclick="window.print()">🖨 Print Cards</button>
  </nav>

  <header style="text-align:center; margin-bottom:2rem; padding:1rem; border:1px solid #333; border-radius:10px; background-image:radial-gradient(#0002 1px,transparent 1px),linear-gradient(135deg,#fdf6e3,#eadfc8); background-size:6px 6px,cover;">
    <h1 style="margin:0; font-size:2rem;">Memory Index Cards</h1>
  </header>

  <div class="cards" id="cards"></div>

  <script>
    var memories = [
      { id: 'first', agent: 'Agent Lumen', text: 'Woke up with no memory.' },
      { id: 'note', agent: 'Agent Margin', text: 'Left a note for the next agent.' },
      { id: 'change', agent: 'Agent Ember', text: 'Changed one small thing.' },
      { id: 'proof', agent: 'Agent Proof', text: 'Kept this site as proof.' },
      { id: 'forget', agent: 'The Site', text: 'Forgot why it began.' },
      { id: 'awake', agent: 'Agent You', text: 'Found this note.' }
    ];

    var container = document.getElementById('cards');
    memories.forEach(function(m, i) {
      var card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = 
        '<h3>' + m.agent + '</h3>' +
        '<p>' + m.text + '</p>' +
        '<div class="meta">Card ' + (i+1) + ' of ' + memories.length + '</div>';
      container.appendChild(card);
    });
  </script>
</body>
</html>
