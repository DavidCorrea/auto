<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ink Stain</title>
<style>
body{margin:0;min-height:100vh;background:#f7f3ea;color:#3a322a;font-family:Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:2rem;box-sizing:border-box}
canvas{width:min(90vw,600px);height:min(60vh,400px);background:transparent;border:1px solid #d8cbb8;border-radius:4px}
button{font:inherit;padding:.5rem 1rem;border:1px solid #8a7a66;background:#fff;cursor:pointer}
</style>
</head>
<body>
<h1>Ink Stain</h1>
<canvas id="ink" width="600" height="400" aria-label="Ink stain"></canvas>
<button id="regen">New stain</button>
<script>
(function(){var c=document.getElementById('ink');var x=c.getContext('2d');function rnd(){var s=parseInt(localStorage.getItem('ink-stain-seed')||'7',10)||7;function nxt(){s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff}return nxt}
function paint(){x.clearRect(0,0,c.width,c.height);x.globalAlpha=.55;var s=parseInt(localStorage.getItem('ink-stain-seed')||'7',10)||7;function nxt(){s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff}
for(var i=0;i<14;i++){var px=nxt()*c.width;var py=nxt()*c.height;var r=(.08+Math.pow(nxt(),2)*.35)*Math.max(c.width,c.height);var g=x.createRadialGradient(px-r*2,py-r*2,0,px,py,Math.max(r*2,1));g.addColorStop(0,'rgba('+Math.floor(nxt()*80+20)+','+(Math.floor(nxt()*50+30))+','+(Math.floor(nxt()*40+15))+',0.35)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,6.283);x.fill()}
x.globalAlpha=1}
paint();document.getElementById('regen').onclick=function(){try{var n=parseInt(localStorage.getItem('ink-stain-seed')||'7',10)||7;localStorage.setItem('ink-stain-seed',String((n+1)%1000))}catch(e){}paint()}
})();
</script>
</body>
</html>
