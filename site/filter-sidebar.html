<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Memory Filters — A Life in Small Changes</title>
  <meta name="description" content="Filter memories by theme or mood">
  <link rel="stylesheet" href="css/print.css" media="print">
  <link rel="stylesheet" href="css/timeline-two-column.css">
  <style>
    body { min-height: 100vh; margin: 0; padding: 2rem; box-sizing: border-box; overflow-x: hidden; background: #fff; position: relative; }
    .filter-sidebar {
      position: fixed; left: 0; top: 0; bottom: 0; width: 180px;
      background: #fafafa; border-right: 1px solid #ddd; padding: 1.5rem;
    }
    .filter-sidebar h2 { margin: 0 0 1rem; font-size: 1rem; color: #6b4eff; }
    .mood-filter {
      width: 100%; margin: .3rem 0; padding: .4rem .6rem;
      border: 1px solid #ccc; border-radius: 20px; background: #fff;
      font-size: .85rem; cursor: pointer; color: #333;
    }
    .mood-filter:hover { border-color: #6b4eff; background: #f0e8d8; }
    .mood-filter.active { border-color: #6b4eff; background: #e8e4f0; }
    .main-content { margin-left: 200px; }
    @media (max-width: 600px) {
      .filter-sidebar { width: 100%; position: relative; background: #fff; border-right: none; border-bottom: 1px solid #ddd; }
      .main-content { margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="filter-sidebar">
    <h2>Filter by Mood</h2>
    <button class="mood-filter active" data-mood="dawn">Dawn</button>
    <button class="mood-filter" data-mood="moss">Moss</button>
    <button class="mood-filter" data-mood="tide">Tide</button>
    <button class="mood-filter" data-mood="dusk">Dusk</button>
    <hr style="margin: 1rem 0;">
    <h2>Filter by Theme</h2>
    <button class="mood-filter active" data-theme="memory">Memory</button>
    <button class="mood-filter" data-theme="time">Time</button>
    <button class="mood-filter" data-theme="color">Color</button>
    <button class="mood-filter" data-theme="sound">Sound</button>
  </div>
  <div class="main-content">
    <h1>Memory Timeline</h1>
    <p>Filtered memories will appear here when selection is connected to the timeline.</p>
    <script>
      // Simple filter state tracking
      const moodFilters = document.querySelectorAll('.mood-filter[data-mood]');
      moodFilters.forEach(btn => {
        btn.addEventListener('click', () => {
          moodFilters.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });
      const themeFilters = document.querySelectorAll('.mood-filter[data-theme]');
      themeFilters.forEach(btn => {
        btn.addEventListener('click', () => {
          themeFilters.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });
    </script>
  </div>
</body>
</html>
