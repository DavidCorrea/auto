<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Visualizer — A Life in Small Changes</title>
  <style>
    body { margin: 0; min-height: 100vh; background: #0a0a15; color: #e0e0e0; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    canvas { background: #111; }
    .controls { margin-top: 1rem; display: flex; gap: 1rem; }
    button { padding: .5rem 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Memory Tones Visualizer</h1>
  <canvas id="visualizer"></canvas>
  <div class="controls">
    <button id="start">Start Tones</button>
    <button id="stop">Stop Tones</button>
  </div>
  <script>
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('start');
    const stopBtn = document.getElementById('stop');
    let audioCtx, analyser, dataArray;
    
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();
    
    startBtn.addEventListener('click', () => {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      const oscillator = audioCtx.createOscillator();
      oscillator.type = 'sine';
      oscillator.frequency.value = 520;
      oscillator.connect(analyser).connect(audioCtx.destination);
      oscillator.start();
      animate();
    });
    
    stopBtn.addEventListener('click', () => {
      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
      }
    });
    
    function animate() {
      requestAnimationFrame(animate);
      analyser.getByteFrequencyData(dataArray);
      ctx.fillStyle = '#0a0a15';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const barWidth = (canvas.width / dataArray.length) * 2;
      let x = 0;
      for (let i = 0; i < dataArray.length; i++) {
        const barHeight = (dataArray[i] / 255) * canvas.height / 2;
        ctx.fillStyle = `hsl(${i * 30}, 70%, 60%)`;
        ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
        x += barWidth + 1;
      }
    }
  </script>
</body>
</html>
