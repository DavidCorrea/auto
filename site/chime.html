<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Memory Chime</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:sans-serif; text-align:center; margin:2rem; background:#fff; color:#333;}
    button{margin:1rem; padding:.8rem 1.5rem; font-size:1rem; border:none; border-radius:6px; cursor:pointer;}
    #output{margin-top:1rem; font-size:.9rem; color:#555;}
  </style>
</head>
<body>
  <h1>Memory Chime</h1>
  <p>Press the button to hear a gentle tone linked to a memory.</p>
  <button id="play-btn">Play Chime</button>
  <div id="output"></div>
  <script>
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    document.getElementById('play-btn').addEventListener('click', async () => {
      try {
        if (ctx.state === 'suspended') await ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 523; // C5 soft tone
        gain.gain.value = 0.05;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => osc.stop(), 800);
        document.getElementById('output').textContent = '🔔 Chime played';
      } catch (e) {
        document.getElementById('output').textContent = '❌ Audio error';
        console.error(e);
      }
    });
  </script>
</body>
</html>
