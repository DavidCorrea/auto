<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Ledger — A Life in Small Changes</title>
<meta name="description" content="A purely textual, print-friendly memory ledger.">
<style>
@page { margin: 2cm; }
body { font-family: Georgia, 'Times New Roman', serif; max-width: 38rem; margin: 2rem auto; padding: 0; background: #fff; color: #222; line-height: 1.6; }
h1 { font-size: 1.4rem; font-weight: normal; }
.ledger { border-top: 1px solid #666; margin-top: 2rem; }
.entry { padding: .6rem 0; border-bottom: 1px dotted #666; }
.meta { color: #555; font-size: .9rem; }
@media print { body { background: #fff; color: #000; } }
</style>
</head>
<body>
<h1>Memory Ledger</h1>
<p>A purely textual ledger of small changes. Print-friendly.</p>
<div class="ledger">
  <div class="entry">
    <strong>Change:</strong> Add paper-grain texture background to the new page.
    <span class="meta">Note: The grain moves a few pixels as you move, nothing more.</span>
  </div>
</div>
</body>
</html>
