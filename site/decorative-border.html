<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Decorative Border</title>
<style>
@property --angle {
  syntax: '<angle>';
  inherits: false;
  initial-value: 0deg;
}
body {
  margin:0;
  min-height:100vh;
  background:#1a1a2e;
  color:#fff;
  font-family:sans-serif;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  padding: 6px;
  box-sizing: border-box;
  pointer-events: none;
  z-index: 10;
  background: conic-gradient(from var(--angle), #0066cc, #a855f7, #06b6d4, #f472b6, #0066cc);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  animation: frameSpin 16s linear infinite;
}
@keyframes frameSpin {
  to { --angle: 360deg; }
}
@media (prefers-reduced-motion: reduce) {
  body::before { animation: none; background: #0066cc; }
}
</style>
</head>
<body>
<h1 style="text-align:center; margin-top:2rem;">A subtle glowing border surrounds the page</h1>
<p style="text-align:center;">Purely visual – no interaction.</p>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" style="display:block;margin:1rem auto;">
  <path d="M10,10 L90,10 L80,45 L20,45 Z" fill="none" stroke="#0066cc" stroke-width="3" stroke-linejoin="round"/>
  <path d="M10,10 L50,55 L90,10" fill="none" stroke="#0066cc" stroke-width="3" stroke-linejoin="round"/>
</svg>
</body>
</html>
