<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sky Particle Trail</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#050508;color:#e8eefd;font-family:Georgia,serif;overflow:hidden}
    canvas{display:block}
    .title{position:fixed;top:2rem;left:2rem;font-size:1.2rem}
  </style>
</head>
<body>
  <div class="title">Particle Trail</div>
  <canvas></canvas>
  <script>
    var c=document.querySelector('canvas');var ctx=c.getContext('2d');var particles=[];var mx=0,my=0;var h=265;function r(){c.width=window.innerWidth;c.height=window.innerHeight}window.addEventListener('resize',r);r();c.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;particles.push({x:mx,y:my,life:1,h:h});if(particles.length>80)particles.shift()});setInterval(function(){h=((new Date().getHours()+new Date().getMinutes()/60+new Date().getSeconds()/3600)/24*360+265)%360},30000);function animate(){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='rgba(20,20,35,1)';ctx.fillRect(0,0,c.width,c.height);for(var i=0;i<50;i++){var sx=Math.random()*c.width, sy=Math.random()*c.height, sr=Math.random()*2;ctx.fillStyle='rgba(255,255,255,'+(0.3+Math.random()*0.7+')');ctx.beginPath();ctx.arc(sx,sr,sr,0,Math.PI*2);ctx.fill()}for(var i=particles.length-1;i>=0;i--){var p=particles[i];p.life-=0.015;if(p.life<=0){particles.splice(i,1);continue}var a=0.3+0.7*p.life;ctx.globalAlpha=a;ctx.fillStyle='hsl('+p.hue+',90%,80%/'+a+')';var s=1+3*p.life;ctx.beginPath();ctx.arc(p.x,p.y,s,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(animate)}animate();
  </script>
</body>
</html>
