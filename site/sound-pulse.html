<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Pulse — A Life in Small Changes</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;font-family:sans-serif}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  #ui{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);text-align:center}
  button{background:#fff;color:#000;border:0;border-radius:999px;padding:.7rem 1.4rem;font-size:1rem;cursor:pointer}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div id="ui"><button id="start">Play a tone</button></div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = innerWidth; canvas.height = innerHeight;
let audio, analyser, raf;
const particles = [];
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', resize); resize();
function start(){
  if (audio) return;
  audio = new (AudioContext || webkitAudioContext)();
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  analyser = audio.createAnalyser();
  analyser.fftSize = 256;
  osc.type = 'sine';
  osc.frequency.value = 220;
  gain.gain.value = 0.15;
  osc.connect(gain); gain.connect(analyser); analyser.connect(audio.destination);
  osc.start();
  cancelAnimationFrame(raf);
  step();
}
function step(){
  if (analyser) requestAnimationFrame(step);
  const arr = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(arr);
  const val = arr[2] / 255;
  for(let i=0;i<2;i++){
    particles.push({x: innerWidth/2 + (Math.random()-0.5)*20, y: innerHeight/2 + (Math.random()-0.5)*20, vx:(Math.random()-0.5)*2, vy:(Math.random()-0.5)*2, life:1, hue: 200 + val*60});
  }
  if(particles.length > 120) particles.shift();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const p of particles){
    p.x += p.vx + (val*4 - 2);
    p.y += p.vy;
    p.life -= 0.02;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = `hsl(${p.hue} 90% 70%)`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
document.getElementById('start').onclick = async function(){
  if(audio && audio.state === 'suspended') await audio.resume();
  start();
};
</script>
</body>
</html>
