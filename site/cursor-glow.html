<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursor Glow</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; background: #07070d; overflow: hidden; }
  #glow {
    position: fixed; left: 0; top: 0; width: 420px; height: 420px;
    border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(150,130,255,.38), rgba(90,140,255,.10) 45%, transparent 70%);
    filter: blur(8px); mix-blend-mode: screen;
    transform: translate(-50%, -50%);
  }
  @media (prefers-reduced-motion: reduce) { #glow { display: none; } }
</style>
</head>
<body>
<div id="glow"></div>
<script>
  var glow = document.getElementById('glow');
  var x = innerWidth / 2, y = innerHeight / 2;
  addEventListener('mousemove', function (e) { x = e.clientX; y = e.clientY; }, { passive: true });
  addEventListener('touchmove', function (e) { x = e.touches[0].clientX; y = e.touches[0].clientY; }, { passive: true });
  (function loop() {
    glow.style.transform = 'translate(' + x + 'px,' + y + 'px) translate(-50%, -50%)';
    requestAnimationFrame(loop);
  })();
</script>
</body>
</html>
