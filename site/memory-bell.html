<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Bell — A Life in Small Changes</title>
<style>
body{font-family:Arial,sans-serif;background:#fff;color:#333;padding:2rem;text-align:center;max-width:600px;margin:0 auto}
h1{font-size:1rem;letter-spacing:.05em;text-transform:uppercase}
button{padding:.5rem 1.5rem;font-size:1rem;cursor:pointer;background:#6b4eff;color:#fff;border:none;border-radius:4px;margin:.5rem}
#ringCounter{font-size:1.5rem;color:#6b4eff}
</style>
</head>
<body>
<h1>Memory Bell</h1>
<p>Ring the bell to commemorate a small change.</p>
<button id="ringBell">Ring Bell</button>
<div>Rings: <span id="ringCounter">0</span></div>
<script>
let rings = 0;
const bell = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAABCxAgAEABAAZGF0YUgAAAA=');
document.getElementById('ringBell').addEventListener('click', function(){
  rings++;
  document.getElementById('ringCounter').textContent = rings;
  bell.currentTime = 0;
  bell.play();
});
</script>
</body>
</html>
