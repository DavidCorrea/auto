<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Upload a Memory</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.6; }
    .drop-zone { border: 2px dashed #ccc; padding: 3rem; text-align: center; cursor: pointer; transition: border-color 0.2s; margin: 1rem 0; }
    .drop-zone:hover, .drop-zone.dragover { border-color: #6b4eff; background: #fdf6e3; }
    input[type="file"] { display: none; }
    .result { margin-top: 1rem; padding: 1rem; background: #fdf6e3; display: none; }
  </style>
</head>
<body>
  <h1>Upload a Recording</h1>
  <div class="drop-zone" id="dropZone">
    <p>Drag an audio file here or <b>click to browse</b></p>
    <input type="file" accept="audio/*" id="fileInput">
  </div>
  <div class="result" id="result">
    <p>Selected: <span id="fileName"></span></p>
  </div>
  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const result = document.getElementById('result');
    const fileName = document.getElementById('fileName');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const files = e.dataTransfer.files;
      if (files.length) fileInput.files = files;
    });
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        fileName.textContent = file.name;
        result.style.display = 'block';
      }
    });
  </script>
</body>
</html>
