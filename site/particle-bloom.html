<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Particle Bloom — A Life in Small Changes</title>
  <style>
    body { margin: 0; min-height: 100vh; background: #050508; color: #e0e7ff; overflow: hidden; font-family: system-ui, sans-serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
    h1 { position: relative; z-index: 1; font-size: 1rem; font-weight: normal; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.6; }
  </style>
</head>
<body>
  <h1>Particle Bloom</h1>
  <canvas id="bloom" aria-hidden="true"></canvas>
  <script>
    const canvas = document.getElementById('bloom');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let raf;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function spawn() {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5,
        life: 1,
        decay: 0.005 + Math.random() * 0.01
      });
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (particles.length < 40) spawn();
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= p.decay;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.98;
        p.vy *= 0.98;
        ctx.globalAlpha = p.life;
        ctx.fillStyle = `hsla(${(p.x + p.y) % 360}, 70%, 70%, 1)`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (particles.length > 0) {
        raf = requestAnimationFrame(animate);
      }
    }
    raf = requestAnimationFrame(animate);
  </script>
</body>
</html>
