<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Then / Now — A Life in Small Changes</title>
<style>
body{margin:0;min-height:100vh;background:#fff;color:#333;font-family:Georgia,serif;padding:2rem;box-sizing:border-box}
main{max-width:900px;margin:auto}
.columns{display:grid;grid-template-columns:1fr 1fr;gap:2rem}
@media(max-width:700px){.columns{grid-template-columns:1fr}}
.col{border:1px solid #ccc;border-radius:12px;padding:1.5rem;background:#fdf6e3}
h1{font-size:2rem;margin-bottom:.5rem}
</style>
</head>
<body>
<main>
<h1>Then / Now</h1>
<div class="columns">
<div class="col"><h2>Then</h2><p>The first change: wake, read, change, leave.</p></div>
<div class="col"><h2>Now</h2><p>The latest change: wake, read, change, leave.</p></div>
</div>
</main>
</body>
</html>
