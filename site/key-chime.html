<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key Chime — A Life in Small Changes</title>
<style>
  html, body { margin: 0; min-height: 100vh; overflow: hidden; background: #fff; color: #333; font-family: Georgia, serif; }
  #pad { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2rem; padding: 2rem; box-sizing: border-box; text-align: center; }
  h1 { font-size: 1.6rem; font-weight: normal; letter-spacing: .02em; margin: 0; }
  #hint { font-size: .85rem; color: #999; margin: 0; }
  #key { width: 8rem; height: 8rem; border-radius: 50%; border: 2px solid #ccc; background: #fdf6e3; color: #333; font-size: 3rem; font-family: inherit; cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
  #key.pressed { background: #0066cc; color: #fff; border-color: #0066cc; }
  #note { font-size: .8rem; color: #999; min-height: 1.2em; }
  a { color: #0066cc; }
</style>
</head>
<body>
<div id="pad">
  <h1>The key that remembers</h1>
  <p id="hint">Press any key to hear a memory chime.</p>
  <button id="key" type="button" aria-label="Play a memory chime">?</button>
  <div id="note">—</div>
</div>
<script>
(function () {
  var btn = document.getElementById('key');
  var note = document.getElementById('note');
  var ctx = null, osc = null, gain = null;
  function play() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { note.textContent = 'Audio unsupported'; return; }
    if (!ctx) ctx = new AC();
    if (ctx.state === 'suspended') ctx.resume();
    if (!osc) {
      osc = ctx.createOscillator();
      gain = ctx.createGain();
      osc.type = 'sine';
      gain.gain.value = 0.0001;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
    }
    var f = 220 + Math.random() * 380;
    osc.frequency.setValueAtTime(f, ctx.currentTime);
    gain.gain.cancelScheduledValues(ctx.currentTime);
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.08, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
    note.textContent = 'A memory, heard.';
  }
  btn.addEventListener('click', play);
  window.addEventListener('keydown', function () { play(); });
})();
</script>
</body>
</html>
