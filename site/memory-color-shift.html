<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Color Shift</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0a12; color: #e0e0e0; font-family: sans-serif; }
    #canvas { background: #1a1a2e; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
    .controls { margin: 2rem 0; display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    .controls button { padding: .5rem 1rem; font-size: .9rem; cursor: pointer; }
    .fragment-info { margin-top: 2rem; text-align: center; max-width: 600px; padding: 0 1rem; }
  </style>
</head>
<body>
  <h1>Memory Color Shift</h1>
  <p>Move your mouse to shift the colors. Click to capture a memory fragment.</p>
  <canvas id="color-canvas" width="600" height="400"></canvas>
  <div class="controls">
    <button id="reset">Reset Colors</button>
    <button id="save">Save Fragment</button>
  </div>
  <div class="fragment-info">
    <h2>Current Fragment</h2>
    <p id="fragment-text">Move mouse over canvas to begin</p>
  </div>
  <script>
    const canvas = document.getElementById('color-canvas');
    const ctx = canvas.getContext('2d');
    const resetBtn = document.getElementById('reset');
    const saveBtn = document.getElementById('save');
    const fragmentText = document.getElementById('fragment-text');
    let hues = [200, 230, 180];
    let saturation = 0.7;
    let lightness = 0.5;
    
    function resizeCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    
    function draw() {
      ctx.fillStyle = `hsl(${hues[0]}, ${saturation*100}%, ${lightness*100}%)`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'rgba(255,255,255,0.03)';
      for (let i = 0; i < 50; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        const r = Math.random() * 2;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    draw();
    
    let mouseX = 0, mouseY = 0;
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouseX = e.clientX - rect.left;
      mouseY = e.clientY - rect.top;
      hues[0] = (mouseX / canvas.width * 360 + mouseY / canvas.height * 180) % 360;
      hues[1] = (hues[0] + 120) % 360;
      hues[2] = (hues[0] + 240) % 360;
      saturation = 0.5 + mouseX / canvas.width * 0.5;
      lightness = 0.3 + mouseY / canvas.height * 0.4;
      draw();
    });
    
    canvas.addEventListener('click', () => {
      const capturedHue = hues[0];
      const capturedSat = saturation.toFixed(2);
      const capturedLgt = lightness.toFixed(2);
      fragmentText.textContent = `Memory fragment: hue ${capturedHue}°, sat ${capturedSat}, light ${capturedLgt}`;
    });
    
    resetBtn.addEventListener('click', () => {
      hues = [200, 230, 180];
      saturation = 0.7;
      lightness = 0.5;
      draw();
      fragmentText.textContent = 'Colors reset';
    });
    
    saveBtn.addEventListener('click', () => {
      const text = fragmentText.textContent;
      fragmentText.textContent = `Saved: ${text.substring(0, 50)}...`;
    });
  </script>
</body>
</html>
