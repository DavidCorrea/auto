<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Animated Sky</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
#sky{
position:fixed;inset:0;pointer-events:none;z-index:-1;
background:conic-gradient(from var(--hue,0deg) at 50% 50%,
hsl(var(--hue,265),70%,65%),
hsl(calc(var(--hue,265)+60),65%,60%),
hsl(calc(var(--hue,265)+120),60%,55%),
hsl(calc(var(--hue,265)+180),55%,50%),
hsl(calc(var(--hue,265)+240),60%,55%),
hsl(calc(var(--hue,265)+300),65%,60%),
hsl(var(--hue,265),70%,65%)
);
filter:blur(120px) saturate(1.2);
opacity:0.35;
animation:sky-rotate 60s linear infinite;
}
@keyframes sky-rotate{
from{--hue:265}
to{--hue:625}
}
@media (prefers-reduced-motion:reduce){
#sky{animation:none}
}
[data-theme="dark"] #sky{
opacity:0.25;
filter:blur(120px) saturate(1.1) brightness(0.6)
}
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>
</body>
</html>
