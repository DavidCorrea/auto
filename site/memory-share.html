<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share a Memory</title>
<link rel="stylesheet" href="css/print.css" media="print">
<style>
body{min-height:100vh;margin:0;padding:2rem;box-sizing:border-box;overflow-x:hidden;background:#fff;font-family:sans-serif;color:#333}
nav{border-bottom:1px solid #ccc;padding-bottom:1rem;margin-bottom:2rem}
nav a{color:#0066cc;text-decoration:none;font-weight:bold}
.timeline{border-bottom:2px solid #333;height:64px;margin:4rem 0;position:relative;width:100%}
.mark{position:absolute;bottom:-8px;width:16px;height:16px;margin-left:-8px;border-radius:50%;border:2px solid #333;background:#fdf6e3;cursor:grab}
.mark:active{cursor:grabbing}
.mark-label{position:absolute;top:-25px;left:50%;transform:translateX(-50%);font-size:.7rem;white-space:nowrap;background:rgba(255,255,255,.8);padding:2px 4px}
.form{max-width:400px;margin-bottom:2rem}
textarea{width:100%;padding:.5rem;margin-bottom:.5rem;border:1px solid #ccc;border-radius:4px}
button{padding:.5rem 1rem;cursor:pointer;background:#333;color:#fff;border:none;border-radius:4px}
button:hover{background:#0066cc}
</style>
</head>
<body>
<nav><a href="index.html">← Back to Home</a></nav>
<h1>Share a Memory</h1>
<p>Type a small memory below. It will appear on the timeline. Drag the marks to reorder; double-click a mark to remove it.</p>
<div class="form">
<textarea id="memoryInput" rows="3" placeholder="A small moment..."></textarea>
<button id="addBtn">Add to Timeline</button>
</div>
<div class="timeline" id="timeline"></div>
<script>
const timeline=document.getElementById('timeline');
const input=document.getElementById('memoryInput');
const btn=document.getElementById('addBtn');
let memories=JSON.parse(localStorage.getItem('shared-memories'))||[];
function render(){
  timeline.innerHTML='';
  memories.forEach(function(text,index){
    const mark=document.createElement('div');
    mark.className='mark';
    mark.style.left=(index/Math.max(memories.length-1,1)*100)+'%';
    mark.draggable=true;
    const label=document.createElement('div');
    label.className='mark-label';
    label.textContent=text.length>15?text.substring(0,12)+'...':text;
    mark.appendChild(label);
    mark.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/plain',index)});
    mark.addEventListener('dblclick',function(){
      if(confirm('Remove this memory?')){memories.splice(index,1);save()}
    });
    timeline.appendChild(mark);
  });
}
timeline.addEventListener('dragover',function(e){e.preventDefault()});
timeline.addEventListener('drop',function(e){
  e.preventDefault();
  const fromIndex=parseInt(e.dataTransfer.getData('text/plain'));
  const rect=timeline.getBoundingClientRect();
  const percent=(e.clientX-rect.left)/rect.width*100;
  let toIndex=Math.floor(percent/100*memories.length);
  if(toIndex>=memories.length)toIndex=memories.length-1;
  if(toIndex<0)toIndex=0;
  const movedItem=memories.splice(fromIndex,1)[0];
  memories.splice(toIndex,0,movedItem);
  save();
});
function save(){localStorage.setItem('shared-memories',JSON.stringify(memories));render()}
btn.addEventListener('click',function(){
  const val=input.value.trim();
  if(val){memories.push(val);input.value='';save()}
});
render();
</script>
</body>
</html>
