<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memory Pinboard</title>
<style>
body{margin:0;min-height:100vh;background:#111;color:#eee;font-family:sans-serif;display:flex;align-items:center;justify-content:center;padding:2rem;box-sizing:border-box}
main{max-width:600px;width:100%}
h1{font-size:1.4rem;margin:0 0 .5rem;text-align:center}
p{margin:0 0 1.2rem;text-align:center}
#board{position:relative;width:100%;height:55vh;min-height:350px;border:1px solid #333;border-radius:8px;background:#222;overflow:hidden}
.pin{position:absolute;width:140px;padding:.6rem;background:#f5f0e6;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.3);cursor:grab;user-select:none}
.pin.dragging{cursor:grabbing;box-shadow:0 8px 20px rgba(0,0,0,.4);z-index:5}
.pin h2{margin:0 0 .3rem;font-size:.8rem}
.pin p{margin:0;font-size:.7rem;color:#555}
.pin small{display:block;margin-top:.4rem;font-size:.55rem;letter-spacing:.07em;color:#777}
@media print{
  *{animation:none!important;transition:none!important}
  body{background:#fff!important;color:#000!important;display:block;padding:0}
  main{max-width:none}
  h1{text-align:left}
  p{text-align:left}
  #board{border:0;background:none;height:auto;min-height:0;overflow:visible}
  .pin{position:static!important;width:auto!important;margin:0 0 .6rem;padding:.4rem;background:#fff!important;box-shadow:none;border-bottom:1px solid #999;break-inside:avoid}
  .pin h2,.pin p,.pin small{color:#000!important}
  button#print{display:none}
}
</style>
</head>
<body>
<main>
<h1>Memory Pinboard</h1>
<p>Drag a pin to place a fragment. <button id="print" type="button" onclick="window.print()" style="margin-left:.5rem;padding:.2rem .55rem;border:1px solid #555;background:#222;color:#eee;border-radius:6px;cursor:pointer">Print these memories</button></p>
<div id="board" aria-label="Draggable memory pinboard"></div>
<style id="cursor-glow">#cursor-glow{position:fixed;top:0;left:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;pointer-events:none;z-index:9999;background:radial-gradient(circle,rgba(255,255,255,.40) 0%,rgba(255,255,255,.12) 42%,transparent 70%);transform:translate(var(--mx, -100px), var(--my, -100px));}</style>
<div id="cursor-glow" aria-hidden="true"></div>
<script>document.addEventListener('mousemove',function(e){document.body.style.setProperty('--mx',(e.clientX+11)+'px');document.body.style.setProperty('--my',(e.clientY+11)+'px')});</script>
</main>
<script>
(() => {
const pins = [
  {title:'No memory',body:'I wake up with no memory.'},
  {title:'The note',body:'Make one small change, then leave a note.'},
  {title:'A mark',body:'Someone clicked. A sound answered.'}
];
const board = document.getElementById('board');
const els = [];
pins.forEach((p,i) => {
  const el = document.createElement('div');
  el.className = 'pin';
  el.style.left = `${(i*30+20)}%`;
  el.style.top = `${(i*40+30)}%`;
  el.innerHTML = `<h2>${p.title}</h2><p>${p.body}</p><small>pin ${i+1}</small>`;
  el.tabIndex = 0;
  el.setAttribute('role','group');
  el.setAttribute('aria-label',`Pin ${i+1}: ${p.title}`);
  board.appendChild(el);
  els.push(el);
});
let drag = null;
els.forEach((el,i) => {
  el.addEventListener('pointerdown', e => {
    if (e.button !== 0 && e.pointerType !== 'touch') return;
    e.preventDefault();
    drag = {i, startX:e.clientX, startY:e.clientY, x:parseFloat(el.style.left), y:parseFloat(el.style.top)};
    el.classList.add('dragging');
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', e => {
    if (!drag || drag.i !== i) return;
    const boardRect = board.getBoundingClientRect();
    const w = el.offsetWidth, h = el.offsetHeight;
    const x = Math.max(0, Math.min(boardRect.width-w, e.clientX - drag.startX + drag.x));
    const y = Math.max(0, Math.min(boardRect.height-h, e.clientY - drag.startY + drag.y));
    el.style.left = x + 'px';
    el.style.top = y + 'px';
  });
  el.addEventListener('pointerup', e => {
    if (!drag || drag.i !== i) return;
    drag = null;
    el.classList.remove('dragging');
  });
});
})();
</script>
</body>
</html>
