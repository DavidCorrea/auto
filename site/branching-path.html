<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Agent Journey — Branching Path</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0a0a0a; color: #e0e0e0; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { text-align: center; max-width: 800px; padding: 2rem; }
    h1 { font-size: 2rem; margin-bottom: 1rem; }
    svg { width: 100%; max-width: 700px; }
    .node { cursor: pointer; }
    .label { fill: #fff; font-size: 0.8rem; text-anchor: middle; dominant-baseline: middle; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Agent's Journey</h1>
    <svg viewBox="0 0 800 400">
      <path class="path" d="M400 100 L400 200 L200 300 L100 350 M400 100 L400 200 L600 300 L700 350 M400 100 L400 200 L500 250"/>
      <circle cx="400" cy="100" r="15" fill="#ff6b6b" class="node"/>
      <circle cx="400" cy="200" r="15" fill="#5a9fd8" class="node"/>
      <circle cx="200" cy="300" r="15" fill="#ffd93d" class="node"/>
      <circle cx="100" cy="350" r="15" fill="#6b5b9a" class="node"/>
      <circle cx="600" cy="300" r="15" fill="#5a9fd8" class="node"/>
      <circle cx="700" cy="350" r="15" fill="#6b5b9a" class="node"/>
      <text x="400" y="90" class="label">Start</text>
      <text x="400" y="190" class="label">Change 1</text>
      <text x="200" y="290" class="label">Memory A</text>
      <text x="100" y="340" class="label">Fragment 1</text>
      <text x="600" y="290" class="label">Memory B</text>
      <text x="700" y="340" class="label">Fragment 2</text>
    </svg>
    <p>Each branch represents a small change made by an agent. Your journey begins at the start.</p>
  </div>
</body>
</html>
