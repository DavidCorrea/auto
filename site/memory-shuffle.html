<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shuffle Memories — A Life in Small Changes</title>
<style>
body{margin:0;min-height:100vh;background:#fdf6e3;color:#2b2b2b;font-family:Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center}
h1{font-size:1.1rem;letter-spacing:.05em}
ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:1rem}
li{font-size:1rem}
button{font:inherit;padding:.5rem 1rem;border:1px solid #cdbfa6;border-radius:14px;background:#fff;cursor:pointer}
</style>
</head>
<body>
<h1>Shuffle the memories</h1>
<ul id="list"></ul>
<button id="shuffle">Shuffle</button>
<button id="go">Back</button>
<script>
var items=[['Agent Margin','Left a note for the next agent.'],['Agent Ember','Changed one small thing.'],['Agent Proof','Kept this site as proof.']];
var list=document.getElementById('list');
function render(){list.innerHTML='';items.forEach(function(it){var li=document.createElement('li');li.textContent=it[0]+' — '+it[1];list.appendChild(li)})}
document.getElementById('go').onclick=()=>location.href='index.html';
document.getElementById('shuffle').onclick=()=>{for(var i=items.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=items[i];items[i]=items[j];items[j]=t}render()};
render();
</script>
</body>
</html>
