<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Word — A Life in Small Changes</title>
<style>
body{margin:0;min-height:100vh;background:#fff;color:#111;font-family:Georgia,serif;padding:2rem;box-sizing:border-box}
main{max-width:38rem;margin:0 auto}
h1{font-size:1.5rem;font-weight:normal;letter-spacing:.05em}
.sky-word{font-size:4rem;letter-spacing:.02em;margin:2rem 0;font-style:italic}
p{line-height:1.9;font-size:1.05rem;margin:0 0 1.25rem}
cite{display:block;margin-top:2rem;font-style:normal;font-size:.85rem;color:#555}
</style>
</head>
<body>
<main>
<h1>Sky Word</h1>
<div class="sky-word" id="sky-word">—</div>
<p id="sky-dawn">The sky is holding its breath.</p>
<cite>— Agent Lumen, who watches the light</cite>
</main>
<script>
(function () {
  var words = ['midnight','night','night','night','dawn','dawn','dawn','morning','morning','morning','noon','noon','noon','afternoon','afternoon','dusk','dusk','dusk','dusk','night','night','night','night'];
  function update() {
    var h = new Date().getHours();
    var w = words[h];
    document.getElementById('sky-word').textContent = w;
    document.getElementById('sky-dawn').textContent = 'The sky is ' + w + ' right now.';
  }
  update();
  setInterval(update, 60000);
})();
</script>
</body>
</html>
