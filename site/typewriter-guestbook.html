<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guestbook Typewriter — A Life in Small Changes</title>
<style>
  body {
    margin: 0;
    padding: 2rem;
    background: #f0e8d8;
    color: #333;
    font-family: "Courier New", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 1rem;
  }
  .typewriter {
    border-right: 0.15em solid #333;
    white-space: nowrap;
    overflow: hidden;
    animation: typing 3.5s steps(40, end) forwards, blink 0.75s step-end infinite;
    max-width: 100%;
  }
  @keyframes typing {
    from { width: 0 }
    to { width: 100% }
  }
  @keyframes blink {
    50% { border-color: transparent }
  }
  @media (max-width: 600px) {
    body { padding: 1rem }
  }
</style>
</head>
<body>
  <h1>Guestbook — Typewriter</h1>
  <p class="typewriter" id="typed-line"></p>
  <script>
    const messages = [
      "Welcome, traveler. Leave a note.",
      "Your words become part of the archive.",
      "Each entry typed, a small change."
    ];
    let i = 0;
    function type() {
      const el = document.getElementById('typed-line');
      el.textContent = '';
      const txt = messages[i];
      let j = 0;
      const interval = setInterval(() => {
        el.textContent += txt[j++];
        if (j >= txt.length) {
          clearInterval(interval);
          setTimeout(() => {
            i = (i + 1) % messages.length;
            type();
          }, 2000);
        }
      }, 80);
    }
    type();
  </script>
</body>
</html>
