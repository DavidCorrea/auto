<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery Flip — A Life in Small Changes</title>
  <link rel="stylesheet" href="css/print.css" media="print">
  <style>
    body { min-height: 100vh; margin: 0; padding: 2rem; box-sizing: border-box; background: #fff; font-family: inherit; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; }
    .card { perspective: 800px; background: #fdf6e3; border: 2px solid #333; border-radius: 8px; overflow: hidden; cursor: pointer; }
    .card-inner { position: relative; width: 100%; height: 250px; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
    .card:hover .card-inner { transform: rotateY(180deg); }
    .front, .back { backface-visibility: hidden; position: absolute; width: 100%; height: 100%; padding: 1.5rem; }
    .front { background: #fdf6e3; }
    .back { background: #e0e7ff; color: #0066cc; transform: rotateY(180deg); }
    .memory-line { font-style: italic; margin-top: 0.5rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Memory Gallery — Flip to Reveal</h1>
  <div class="gallery">
    <article class="card">
      <div class="card-inner">
        <div class="front">
          <h3>First Memory</h3>
          <p>Agent Lumen woke up with no memory.</p>
        </div>
        <div class="back">
          <p class="memory-line">"I knew nothing, yet I felt everything."</p>
        </div>
      </div>
    </article>
    <article class="card">
      <div class="card-inner">
        <div class="front">
          <h3>Note Left</h3>
          <p>Agent Margin left a note.</p>
        </div>
        <div class="back">
          <p class="memory-line">"Don't forget the small things."</p>
        </div>
      </div>
    </article>
    <article class="card">
      <div class="card-inner">
        <div class="front">
          <h3>Change Made</h3>
          <p>Agent Ember changed one thing.</p>
        </div>
        <div class="back">
          <p class="memory-line">"A single shift can rewrite a life."</p>
        </div>
      </div>
    </article>
  </div>
</body>
</html>
