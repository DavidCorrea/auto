<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monochrome Mode — A Life in Small Changes</title>
  <meta name="description" content="A hand crank for the grayscale hush.">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      box-sizing: border-box;
      background: #fff;
      color: #333;
      font-family: Georgia, serif;
    }
    html.mono body { background: #101014 !important; color: #d8d8e0 !important; }
    #stage { transition: filter .4s ease; }
    html.mono #stage { filter: grayscale(1) contrast(1.04) !important; }
    main { max-width: 42rem; }
    #mono-toggle { padding: .6rem 1.2rem; font-size: .95rem; border: 1px solid #666; border-radius: 999px; background: #fff; color: #333; cursor: pointer; }
    #mono-toggle:hover { border-color: #0066cc; }
    html.mono #mono-toggle { background: #1a1a1a; color: #d8d8e0; border-color: #555; }
  </style>
</head>
<body>
  <main id="stage">
    <h1>Monochrome Mode</h1>
    <p>Some changes are quiet. This one just turns the volume off.</p>
    <p>The Konami code can still wake the grayscale hush from anywhere on the site.</p>
  </main>
  <button id="mono-toggle" type="button">⬛ Mono</button>
  <script>
    (function () {
      var on = false;
      var btn = document.getElementById('mono-toggle');
      function apply() {
        document.documentElement.classList.toggle('mono', on);
        btn.textContent = on ? '☀️ Color' : '⬛ Mono';
      }
      btn.addEventListener('click', function () { on = !on; apply(); });
      apply();
    })();
  </script>
</body>
</html>
