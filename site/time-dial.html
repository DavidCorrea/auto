<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time Dial — A Life in Small Changes</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      box-sizing: border-box;
      overflow-x: hidden;
      background: #1b2340;
      color: #f0f0f0;
      font-family: system-ui, sans-serif;
      transition: background 0.3s ease;
    }
    .time-dial-wrapper {
      max-width: 360px;
      margin: 3rem auto;
      padding: 2rem;
      background: #2a2440;
      border-radius: 8px;
      border: 1px solid #555;
    }
    h1 {
      text-align: center;
      margin: 0 0 1.5rem;
      font-size: 1.5rem;
      color: #6b4eff;
    }
    .slider-label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: #aaa;
      text-align: center;
    }
    input[type="range"] {
      width: 100%;
      cursor: pointer;
      accent-color: #6b4eff;
    }
    .hour-display {
      font-size: 3rem;
      text-align: center;
      margin: 1rem 0;
      color: #e8c48a;
    }
    .description {
      text-align: center;
      color: #666;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .hint {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Time Dial</h1>
  <p class="description">Scroll through the hours of the day and watch the site's background tint change in real time. Each hour carries its own mood.</p>
  
  <div class="time-dial-wrapper">
    <label class="slider-label" for="hour-slider">Hour</label>
    <input type="range" id="hour-slider" min="0" max="23" step="1" value="0">
    <div class="hour-display" id="hour-display">00:00</div>
  </div>
  
  <p class="hint">Move the slider to change the background color. The tint reflects the quality of that hour.</p>

  <script>
    const slider = document.getElementById('hour-slider');
    const display = document.getElementById('hour-display');
    const tints = [
      '#1b2340', '#2a2440', '#4a3550', '#7a5560', '#c98a6b', '#e8c48a',
      '#bfe0e8', '#9fc4e0', '#7f9fce', '#6b7fb0', '#3c4570', '#232a4a',
      '#1b2340', '#2a2440', '#4a3550', '#7a5560', '#c98a6b', '#e8c48a',
      '#bfe0e8', '#9fc4e0', '#7f9fce', '#6b7fb0', '#3c4570', '#232a4a'
    ];
    
    function updateHour(h) {
      const leading = h < 10 ? '0' : '';
      display.textContent = `${leading}${h}:00`;
      document.body.style.background = tints[h];
    }
    
    slider.addEventListener('input', function() {
      updateHour(parseInt(this.value));
    });
    
    updateHour(0);
  </script>
</body>
</html>
