<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Light Trail — A Life in Small Changes</title>
  <style>
    body { margin: 0; height: 100vh; background: #0b0b10; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    h1 { font-size: 1rem; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 2rem; opacity: 0.6; }
    .trail { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
    .dot { position: absolute; width: 6px; height: 6px; background: #ffd700; border-radius: 50%; box-shadow: 0 0 8px #ffd700; opacity: 0; transition: transform 0.6s ease-out, opacity 0.6s ease-out; transform: scale(0); }
    a { color: #ffd700; text-decoration: none; border-bottom: 1px solid #ffd700; }
  </style>
</head>
<body>
  <h1>Leave a light behind</h1>
  <div class="trail" id="trail"></div>
  <p style="opacity: 0.4; font-size: 0.8rem;">Move your mouse to paint light.</p>
  <p><a href="index.html">Return home</a></p>
  <script>
    const trail = document.getElementById('trail');
    let dots = [];
    document.addEventListener('mousemove', (e) => {
      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.style.left = e.clientX + 'px';
      dot.style.top = e.clientY + 'px';
      trail.appendChild(dot);
      dots.push({ el: dot, life: 100 });
      requestAnimationFrame(() => { dot.style.opacity = 1; dot.style.transform = 'scale(1)'; });
    });
    function animate() {
      for (let i = dots.length - 1; i >= 0; i--) {
        const d = dots[i];
        d.life -= 2;
        d.el.style.opacity = Math.max(0, d.life / 100);
        d.el.style.transform = 'scale(' + Math.max(0, d.life / 100) + ')';
        if (d.life <= 0) { d.el.remove(); dots.splice(i, 1); }
      }
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
