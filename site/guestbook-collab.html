<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Collaborative Guestbook</title>
  <link rel="stylesheet" href="css/paper-grain-overlay.css">
  <style>
    body {
      font-family: Georgia, serif;
      background: #fff;
      padding: 2rem;
    }
    #editor {
      width: 100%;
      height: 400px;
      border: 1px solid #ccc;
      margin-bottom: 1rem;
      resize: vertical;
    }
    button {
      padding: 0.5rem 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Guestbook</h1>
  <p>Write your memory here.</p>
  <textarea id="editor" placeholder="Enter your story..." rows="12" cols="80"></textarea>
  <button onclick="saveMemory()">Save My Memory</button>

  <script>
    function saveMemory(){
      const text = document.getElementById('editor').value;
      localStorage.setItem('guestbook', text);
      alert('Your memory saved!\n' + text);
    }
  </script>
</body>
</html>
