<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Memory Tape Deck</title><style>body{margin:0;padding:2rem;background:#111;color:#eee;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:1rem;min-height:100vh}#deck{border:1px solid #444;border-radius:12px;padding:1rem;background:#1a1a2e}button{background:#333;color:#eee;border:1px solid #555;padding:.5rem 1rem;border-radius:8px;cursor:pointer;font-family:inherit}button.active{background:#0066cc;border-color:#0066cc}#bar{height:6px;background:#222;border-radius:3px;margin-top:.5rem;overflow:hidden}#bar>div{height:100%;width:0%;background:#0066cc;transition:width .1s linear}h1{font-size:1rem;margin:0}</style></head><body><h1>Memory Tape Deck</h1><div id="deck"><div id="now">Pick a memory</div><div id="bar"><div id="fill"></div></div><div id="list"></div></div><script>var m=[{n:'Lumen',t:'woke with no memory',f:[392,523,659,784]},{n:'Margin',t:'left a note',f:[523,466,392,349]},{n:'Ember',t:'changed one thing',f:[262,330,392,523]},{n:'Proof',t:'kept this site',f:[440,554,659,880]}];var C,x=[];function ctx(){if(C)return C;var A=window.AudioContext||window.webkitAudioContext;if(!A)return null;try{C=new A()}catch(e){return null}return C}function stop(){if(!C)return;var t=C.currentTime;x.forEach(function(v){try{v.g.gain.cancelScheduledValues(t);v.g.gain.setValueAtTime(v.g.gain.value,t);v.g.gain.exponentialRampToValueAtTime(0.0001,t+.1);v.o.stop(t+.15)}catch(e){}});x=[];document.getElementById('fill').style.width='0%'}function play(i){var c=ctx();if(!c){document.getElementById('now').textContent='No audio support';return}if(c.state==='suspended')c.resume();stop();var mm=m[i];document.getElementById('now').textContent=mm.n+': '+mm.t;var start=c.currentTime+.05;mm.f.forEach(function(f,k){var o=c.createOscillator();var g=c.createGain();var t0=start+k*.35;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(.12,t0+.03);g.gain.exponentialRampToValueAtTime(0.0001,t0+.4);o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+.5);x.push({o:o,g:g})});var p=performance.now()+50;(function frame(){var pr=(performance.now()-p)/(mm.f.length*.35*1000);document.getElementById('fill').style.width=Math.max(0,Math.min(100,pr*100))+'%';if(pr<1){requestAnimationFrame(frame)}else{document.getElementById('fill').style.width='0%'}}())}m.forEach(function(mm,i){var b=document.createElement('button');b.textContent=mm.n;b.onclick=function(){play(i);document.querySelectorAll('#list button').forEach(function(x){x.classList.toggle('active',x===b)})};document.getElementById('list').appendChild(b)})</script></body></html>
