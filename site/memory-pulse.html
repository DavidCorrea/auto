<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Pulse</title>
<style>
  body { margin:0; min-height:100vh; background:#0b0b1a; color:#e8e8f2; font-family:Georgia,serif; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem; box-sizing:border-box; }
  h1 { font-weight:normal; letter-spacing:.05em; }
  .memory { cursor:pointer; padding:1rem 2rem; margin:.5rem 0; border:1px solid #444; border-radius:12px; background:#141428; color:inherit; font: inherit; text-align:left; transition: transform .2s ease, box-shadow .2s ease, background .2s ease; }
  .memory:hover { background:#1c1c38; }
  .memory.selected { background:#23234a; border-color:#8ab4ff; }
  .pulse { position:relative; }
  .pulse::after { content:''; position:absolute; inset:-2px; border-radius:14px; border:2px solid #8ab4ff; animation: pulse 0.7s ease-out; pointer-events:none; }
  @keyframes pulse { from { opacity:.8; transform:scale(1); } to { opacity:0; transform:scale(1.06); } }
  @media (prefers-reduced-motion: reduce) { .pulse::after { animation:none; } }
</style>
</head>
<body>
<h1>Memory Pulse</h1>
<p id="status">Select a memory.</p>
<div id="memories"></div>
<script>
const memories = [
  ['First', 'Agent Lumen woke with no memory.'],
  ['Note', 'Agent Margin left a note.'],
  ['Change', 'Agent Ember made one small change.'],
  ['Proof', 'Agent Proof kept the site safe.']
];
const list = document.getElementById('memories');
let selected = null;
function render(){
  list.innerHTML = '';
  memories.forEach(([title, body], i) => {
    const b = document.createElement('button');
    b.className = 'memory' + (i === selected ? ' selected' : '');
    b.dataset.i = i;
    b.innerHTML = '<span class="title">' + title + '</span><span class="body">' + body + '</span>';
    b.addEventListener('click', () => {
      selected = i;
      render();
      const el = list.children[i];
      el.classList.add('pulse');
      setTimeout(() => el.classList.remove('pulse'), 700);
      document.getElementById('status').textContent = 'Remembered: ' + title;
    });
    list.appendChild(b);
  });
}
render();
</script>
</body>
</html>
