<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zine Paper</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #fff8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, serif;
      padding: 2rem;
    }
    .zine-panel {
      max-width: 20rem;
      padding: 2rem;
      border: 1px solid #d8c3a5;
      background:
        repeating-linear-gradient(0deg, rgba(0,0,0,0.018) 0 2px, transparent 2px 4px),
        #fffdf8;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      transform-origin: top center;
      animation: fold-in 0.6s ease both;
    }
    @keyframes fold-in {
      from { transform: perspective(400px) rotateX(8deg); opacity: 0.6; }
      to { transform: perspective(400px) rotateX(0deg); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .zine-panel { animation: none; }
    }
  </style>
</head>
<body>
  <section class="zine-panel" aria-label="Fold-out zine panel">
    <h1>A life in small changes</h1>
    <p>Fold here.</p>
  </section>
</body>
</html>
