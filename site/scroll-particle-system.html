<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scroll Particle System</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow-x: hidden; background: #05051a; }
    canvas { display: block; width: 100%; height: 100% }
    .page { padding: 3rem; color: #e0e0ff; font-family: system-ui, sans-serif; }
    h1 { font-size: 1.8rem; margin-bottom: 1rem }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="page">
    <h1>Scroll Particles</h1>
    <p>Particles bloom with your scroll.</p>
  </div>

  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    let particles = [];
    let lastY = 0;

    function resize() {
      c.width = window.innerWidth;
      c.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // Initial particles
    for (let i = 0; i < 20; i++) {
      particles.push({
        x: Math.random() * c.width,
        y: Math.random() * c.height,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        r: Math.random() * 2 + 0.5,
        o: Math.random() * 0.5 + 0.3,
        c: `rgba(173, 200, 230, ${0.5})`
      });
    }

    window.addEventListener('scroll', () => {
      const delta = window.scrollY - lastY;
      lastY = window.scrollY;

      if (Math.abs(delta) > 0.5) {
        const count = Math.floor(Math.abs(delta) * 0.1);
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.abs(delta) * 0.02 + 0.3;
          particles.push({
            x: c.width / 2 + Math.cos(angle) * 20,
            y: c.height / 2 + Math.sin(angle) * 20,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            r: Math.random() * 2 + 0.5,
            o: 1,
            c: 'rgba(255, 255, 255, 1)'
          });
        }
      }
    });

    function animate() {
      ctx.clearRect(0, 0, c.width, c.height);

      particles = particles.filter(p => p.o > 0);

      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.98;
        p.vy *= 0.98;
        p.o -= 0.02;

        if (p.o > 0) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = c.fillStyle.replace('0.5)', `${p.o * 0.5})`);
          ctx.globalAlpha = p.o;
          ctx.fill();
        }
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
