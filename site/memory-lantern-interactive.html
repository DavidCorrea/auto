<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Lantern — A Life in Small Changes</title>
  <meta name="description" content="An interactive memory lantern that changes color with your presence.">
  <style>
    body{margin:0;padding:2rem;background:#1a1a1a;color:#f0f0f0;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh}
    .lantern{width:120px;height:160px;border:8px solid #555;border-radius:40px 40px 10px 10px;background:#2a2a2a;position:relative;margin-top:3rem;box-shadow:0 0 40px #000c}
    .light{width:60px;height:60px;border-radius:50%;background:#ffd700;position:absolute;top:-30px;left:50%;transform:translateX(-50%);box-shadow:0 0 30px currentColor;transition:background .4s ease,box-shadow .4s ease;border:4px solid #fff5}
    .flame{position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:30px;height:40px;background:radial-gradient(circle,#fff,#ffd700,transparent);border-radius:50% 50% 40% 40%;animation:flicker .15s infinite alternate;pointer-events:none;z-index:2}
    @keyframes flicker{from{transform:translateX(-50%) scale(1);opacity:.9}to{transform:translateX(-50%) scale(1.05);opacity:1}}
    .handle{width:14px;height:60px;background:#555;position:absolute;top:-60px;left:50%;transform:translateX(-50%);border-radius:7px}
    h1{margin-bottom:.5rem;color:#ffd700;text-shadow:0 0 10px #ffd7004d}
    p{max-width:40ch;text-align:center;color:#aaa;font-size:.9rem;line-height:1.6}
    .hint{margin-top:1rem;font-size:.75rem;color:#666;text-transform:uppercase;letter-spacing:.1em}
    @media (prefers-reduced-motion:reduce){.flame{animation:none}.light{transition:none}}
  </style>
</head>
<body>
  <h1>Memory Lantern</h1>
  <p>Hover over the lantern to change its light. Each color holds a different small memory.</p>
  <div class="lantern" id="lantern" role="button" tabindex="0" aria-label="Change lantern light color">
    <div class="handle"></div>
    <div class="light" id="light"></div>
    <div class="flame"></div>
  </div>
  <p class="hint" id="hint">Move your cursor near the lantern</p>
  <script>
    (function(){
      var lantern=document.getElementById('lantern'),light=document.getElementById('light'),hint=document.getElementById('hint');
      var colors=[['#ffd700','golden dawn'],['#ff6b6b','warm ember'],['#4ecdc4','cool mist'],['#a29bfe','twilight hush'],['#ffeaa7','soft candle'],['#fd79a8','quiet pulse']];
      var i=0;
      function set(n){var c=colors[n];light.style.background=c[0];light.style.boxShadow='0 0 40px '+c[0];hint.textContent=c[1];}
      lantern.addEventListener('mousemove',function(){i=(i+1)%colors.length;set(i);});
      lantern.addEventListener('click',function(){i=(i+1)%colors.length;set(i);});
      lantern.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();i=(i+1)%colors.length;set(i);}});
      set(0);
    })();
  </script>
</body>
</html>
