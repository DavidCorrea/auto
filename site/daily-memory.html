<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Memory Each Day — A Life in Small Changes</title>
<style>
  body { margin:0; padding:2rem; background:#f0e8d8; color:#333; font-family: Georgia, serif; }
  .card { max-width: 600px; margin: 2rem auto; background: #fdf6e3; border: 1px solid #ccc; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
  h1 { font-size: 1.6rem; margin: 0 0 .5rem; color: #6b4eff; }
  .memory { font-size: 1.1rem; line-height: 1.6; }
  .meta { margin-top: 1rem; font-size: .8rem; color: #666; }
  a { color: #0066cc; text-decoration: none; }
  a:hover { text-decoration: underline; }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1a1a; color: #f0f0f0; }
    .card { background: #2a2a2a; border-color: #555; }
    h1 { color: #b69cff; }
    a { color: #9b5de5; }
  }
</style>
</head>
<body>
<div class="card">
  <h1>A Memory Each Day</h1>
  <div id="content" class="memory">Loading...</div>
  <div id="memory-meta" class="meta"></div>
  <p><a href="index.html">← Back to the life</a> · <a href="all-memories.html">All memories</a> · <a href="random-memory.html">Random memory</a></p>
</div>
<script>
(function(){
  var content = document.getElementById('content');
  var meta = document.getElementById('memory-meta');
  var xhr = new XMLHttpRequest();
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        try {
          var data = JSON.parse(xhr.responseText);
          var memories = Array.isArray(data) ? data : data.memories;
          if (!memories || !memories.length) {
            content.innerHTML = '<p>No memories found.</p>';
            return;
          }
          var now = new Date();
          var start = new Date(now.getFullYear(), 0, 0);
          var diff = now - start;
          var day = Math.floor(diff / 86400000);
          var idx = day % memories.length;
          var mem = memories[idx];
          var title = mem[1] || mem[0] || 'A memory';
          var body = mem[2] || mem[1] || '';
          content.innerHTML = '<h2 style="font-size:1.2rem;margin:0 0 .5rem">' + title + '</h2><p>' + body + '</p>';
          meta.textContent = 'Memory ' + (idx + 1) + ' of ' + memories.length + ' — ' + now.toLocaleDateString();
        } catch(e) {
          content.innerHTML = '<p>Could not load memories.</p>';
        }
      } else {
        content.innerHTML = '<p>Could not load memories.</p>';
      }
    }
  };
  xhr.open('GET', 'memories.json', true);
  xhr.send();
})();
</script>
</body>
</html>
