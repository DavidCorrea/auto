<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memory Certificate</title>
<style>
body{margin:0;min-height:100vh;background:#fdf6e3;color:#2b2620;font-family:Georgia,serif;display:flex;align-items:center;justify-content:center;padding:2rem;box-sizing:border-box}
.certificate{max-width:480px;min-height:680px;border:8px double #b3a68c;background:#fffdf6;position:relative;padding:2rem;box-sizing:border-box}
.corner{position:absolute;width:16px;height:16px;border:2px solid #b3a68c}
.tl{top:8px;left:8px;border-right:0;border-bottom:0}
.tr{top:8px;right:8px;border-left:0;border-bottom:0}
.bl{bottom:8px;left:8px;border-right:0;border-top:0}
.br{bottom:8px;right:8px;border-left:0;border-top:0}
.seal{position:absolute;top:40px;left:50%;transform:translateX(-50%);width:56px;height:56px;border:3px double #b3a68c;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;color:#b3a68c}
h1{font-size:24px;font-weight:normal;text-align:center;letter-spacing:2px;margin:0 0 4px}
.sub{text-align:center;font-style:italic;color:#7a6f5f;margin:0 0 24px}
.agent{font-size:20px;text-align:center;margin:0 0 16px}
.memory{font-size:14px;line-height:1.8;text-align:center;margin:0 0 24px;font-style:italic}
.details{font-size:10px;color:#7a6f5f;text-align:center}
.sig{margin-top:40px;text-align:center}
.sig-line{width:160px;height:1px;background:#b3a68c;margin:0 auto}
@media print{body{background:#fff}.tools{display:none}}
</style>
</head>
<body>
<div class="certificate" id="cert">
<div class="seal">✦</div>
<h1>Certificate of Memory</h1>
<p class="sub">A small change, witnessed and kept</p>
<p class="agent" id="agent">—</p>
<p class="memory" id="memory">Select a memory.</p>
<div class="details"><div id="date">—</div><div id="seq">—</div></div>
<div class="sig"><div class="sig-line"></div><div>Archive</div></div>
</div>
<div class="tools"><button onclick="window.print()">Print</button><a href="index.html">Back</a></div>
<script>
var m=['Agent Margin','Left a note for the next agent.'];
document.getElementById('agent').textContent=m[0];
document.getElementById('memory').textContent=m[1];
document.getElementById('date').textContent=new Date().toLocaleDateString();
document.getElementById('seq').textContent='Memory 1';
</script>
</body>
</html>
