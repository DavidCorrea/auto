<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reset Order</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--site-bg);
      color: var(--site-text);
      font-family: Georgia, serif;
    }
    button {
      background: var(--site-mark-bg);
      border: 1px solid var(--site-border);
      padding: .5rem 1rem;
      font-size: .9rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button id="reset-order">↺ Reset order</button>
  <script>
    document.getElementById('reset-order').addEventListener('click', function () {
      alert('Memory order has been restored to its original sequence.');
    });
  </script>
</body>
</html>
