<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Palette Toggle</title>
<link rel="stylesheet" href="css/print.css" media="print">
<style>
body{font-family:sans-serif;background:var(--site-bg);color:var(--site-text);padding:2rem}
#toggle{background:var(--site-mark-bg);border:1px solid var(--site-border);border-radius:6px;padding:.5rem 1rem;cursor:pointer}
</style>
</head>
<body>
<h1>Palette Toggle</h1>
<button id="toggle">🎨 Toggle Accent</button>
<script>
(function(){
  var btn=document.getElementById('toggle');
  btn.onclick=()=>{ 
    var root=document.documentElement;
    if(root.style.getPropertyValue('--site-accent').trim()==='#0066cc'){
      root.style.setProperty('--site-accent','#ff6600');
      btn.textContent='🎨 Toggle Accent (blue)';
    }else{
      root.style.setProperty('--site-accent','#0066cc');
      btn.textContent='🎨 Toggle Accent (orange)';
    }
  };
})();
</script>
</body>
</html>
