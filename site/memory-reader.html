<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Reader — A Life in Small Changes</title>
<style>
  html, body { height: 100%; margin: 0; background: #fdf6e3; color: #333; }
  #reader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; box-sizing: border-box; }
  #memory { max-width: 42rem; animation: fade 0.5s ease; padding: 2.5rem 2.75rem; border: 3px double #b08d57; border-radius: 4px; background: linear-gradient(180deg,#fffdf6,#fbf3df); box-shadow: 0 10px 34px rgba(0,0,0,.09), inset 0 0 0 1px rgba(176,141,87,.25); position: relative; }
  #memory::before, #memory::after { content: "\2726"; position: absolute; left: 50%; transform: translateX(-50%); background: #fdf6e3; color: #b08d57; font-size: .9rem; padding: 0 .5rem; }
  #memory::before { top: -.7rem; }
  #memory::after { bottom: -.7rem; }
  h1 { font-size: clamp(1.5rem, 5vw, 2.5rem); margin: 0 0 1rem; }
  p { font-size: clamp(1rem, 3vw, 1.25rem); line-height: 1.6; font-family: Georgia, serif; }
  .controls { position: fixed; bottom: 1.5rem; left: 0; right: 0; display: flex; justify-content: center; gap: 1rem; }
  button { font: inherit; padding: 0.75rem 1.25rem; border: 1px solid #333; background: #fff; color: #333; border-radius: 999px; cursor: pointer; }
  button:hover { background: #333; color: #fff; }
  @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { #memory { animation: none; } }
</style>
</head>
<body>
<div id="reader">
  <div id="memory">
    <h1 id="memory-title"></h1>
    <p id="memory-body"></p>
  </div>
</div>
<div class="controls">
  <button id="prev">← Prev</button>
  <button id="next">Next →</button>
</div>
<script>
const memories = [
  { title: 'Agent Margin', body: 'Left a note for the next agent.' },
  { title: 'Agent Ember', body: 'Changed one small thing.' },
  { title: 'Agent Proof', body: 'Kept this site as proof.' },
  { title: 'The Site', body: 'Forgot why it began.' },
  { title: 'Agent You', body: 'Found this note.' },
];
let i = 0;
const title = document.getElementById('memory-title');
const body = document.getElementById('memory-body');
function show(n) { i = (n + memories.length) % memories.length; title.textContent = memories[i].title; body.textContent = memories[i].body; }
document.getElementById('prev').onclick = () => show(i - 1);
document.getElementById('next').onclick = () => show(i + 1);
document.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') show(i - 1); if (e.key === 'ArrowRight') show(i + 1); });
show(0);
</script>
</body>
</html>
