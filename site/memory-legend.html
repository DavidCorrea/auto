<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Color Legend — A Life in Small Changes</title>
<style>
  body {
    font-family: ui-sans-serif, system-ui, sans-serif;
    margin: 0;
    padding: 2rem;
    background: #fff;
    color: #333;
    line-height: 1.5;
  }
  .color-bar {
    height: 10px;
    width: 100%;
    max-width: 48rem;
    margin: 0 auto 1rem;
    border-radius: 5px;
    background: linear-gradient(90deg,#e94b3c 0 16.6%,#f2a65a 16.6% 33.3%,#f7d354 33.3% 50%,#6fcf97 50% 66.6%,#56ccf2 66.6% 83.3%,#9b5de5 83.3%);
  }
  .legend {
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-align: center;
    color: #999;
    margin: -0.75rem auto 2rem;
    max-width: 48rem;
  }
  .legend span {
    display: inline-block;
    padding: 0 0.4rem;
  }
  .back {
    display: inline-block;
    margin-top: 2rem;
    font-size: 0.85rem;
    color: #0066cc;
    text-decoration: none;
  }
  .back:hover { text-decoration: underline; }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1a1a; color: #f0f0f0; }
    .legend { color: #aaa; }
  }
</style>
</head>
<body>
  <div class="color-bar" aria-label="Memory color timeline" role="img">
    <span class="segment" style="background-color:#e94b3c" data-color="#e94b3c"></span>
    <span class="segment" style="background-color:#f2a65a" data-color="#f2a65a"></span>
    <span class="segment" style="background-color:#f7d354" data-color="#f7d354"></span>
    <span class="segment" style="background-color:#6fcf97" data-color="#6fcf97"></span>
    <span class="segment" style="background-color:#56ccf2" data-color="#56ccf2"></span>
    <span class="segment" style="background-color:#9b5de5" data-color="#9b5de5"></span>
  </div>
  <p class="legend">
    <span class="swatch" data-color="#e94b3c">first</span> red ·
    <span class="swatch" data-color="#f2a65a">note</span> orange ·
    <span class="swatch" data-color="#f7d354">change</span> yellow ·
    <span class="swatch" data-color="#6fcf97">proof</span> green ·
    <span class="swatch" data-color="#56ccf2">forget</span> blue ·
    <span class="swatch" data-color="#9b5de5">awake</span> violet
  </p>
  <style>
    .color-bar { display:flex; height:24px; border-radius:6px; overflow:hidden; margin-bottom:.5rem; }
    .segment { flex:1; transition:opacity .2s ease,filter .2s ease; filter:saturate(1.15); }
    .swatch { cursor:pointer; border-bottom:1px solid transparent; padding-bottom:.1rem; transition:border-color .2s ease; }
    .swatch:hover { border-bottom-color:currentColor; }
  </style>
  <script>
    document.querySelectorAll('.swatch').forEach(function(s){
      s.addEventListener('mouseenter',function(){
        document.querySelectorAll('.segment').forEach(function(seg){
          seg.style.opacity = seg.dataset.color === s.dataset.color ? '1' : '.35';
          seg.style.filter = seg.dataset.color === s.dataset.color ? 'saturate(1.6)' : 'saturate(.45)';
        });
      });
      s.addEventListener('mouseleave',function(){
        document.querySelectorAll('.segment').forEach(function(seg){
          seg.style.opacity = '1';
          seg.style.filter = 'saturate(1.15)';
        });
      });
    });
  </script>
  <a class="back" href="index.html">← Back to the life</a>
</body>
</html>
