<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll Sky — A Life in Small Changes</title>
<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; height: 400vh; background: #0b0e1a; font-family: Georgia, serif; color: #f0f0f0; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .wrap { position: relative; max-width: 34rem; margin: 0 auto; padding: 12vh 1.5rem 40vh; }
  h1 { font-size: 1.4rem; font-weight: normal; text-shadow: 0 0 14px currentColor; }
  p { opacity: .8; line-height: 1.6; }
  a { color: #fff; opacity: .7; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px monospace; opacity: .6; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="wrap">
  <h1>Scroll Sky</h1>
  <p>Scroll slowly. The sky keeps your pace: the hue drifts with how far you have wandered, and the dust leans whenever you hurry.</p>
  <p><a href="index.html">&larr; back to the life</a></p>
</div>
<div id="hud">—</div>
<script>
(function () {
  var c = document.getElementById('c'), x = c.getContext('2d'), hud = document.getElementById('hud');
  var W, H;
  function rs() { W = c.width = innerWidth; H = c.height = innerHeight; }
  addEventListener('resize', rs); rs();
  var calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var N = calm ? 40 : 90, P = [];
  for (var i = 0; i < N; i++) P.push({ x: Math.random(), y: Math.random(), s: Math.random() * 1.8 + .6, v: Math.random() * .0006 + .0002, tw: Math.random() * 6.28 });
  var lastY = scrollY, vel = 0;
  function hue() {
    var d = document.documentElement.scrollHeight - innerHeight || 1;
    return Math.round(210 + (scrollY / d) * 140);
  }
  function frame() {
    var y = scrollY, d = document.documentElement.scrollHeight - innerHeight || 1;
    var p = Math.max(0, Math.min(1, y / d));
    vel = vel * .9 + (y - lastY) * .1; lastY = y;
    var h = hue();
    var g = x.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'hsl(' + h + ',55%,' + (14 + p * 10) + '%)');
    g.addColorStop(1, 'hsl(' + ((h + 30) % 360) + ',60%,' + (26 + p * 14) + '%)');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    var push = Math.max(-6, Math.min(6, vel * .4));
    for (var i = 0; i < P.length; i++) {
      var q = P[i];
      q.y -= q.v * (1 + Math.abs(push));
      q.x += push * .0004 + Math.sin(q.tw) * .0002;
      if (q.y < -0.05) { q.y = 1.05; q.x = Math.random(); }
      if (q.x < -0.05) q.x = 1.05;
      if (q.x > 1.05) q.x = -0.05;
      var a = .25 + .55 * Math.abs(Math.sin(q.tw += .01));
      x.fillStyle = 'hsla(' + ((h + 40) % 360) + ',80%,85%,' + a + ')';
      x.beginPath(); x.arc(q.x * W, q.y * H, q.s, 0, 6.283); x.fill();
    }
    hud.textContent = 'hue ' + (h % 360) + '° · wandered ' + Math.round(p * 100) + '%';
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
