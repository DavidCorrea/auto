<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theme Compass</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #0b0d12;
      color: #eee;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }
    .compass {
      position: relative;
      width: min(70vmin, 420px);
      height: min(70vmin, 420px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.14), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.25);
      box-shadow: 0 0 60px rgba(107, 78, 255, .35), inset 0 0 40px rgba(107, 78, 255, .18);
      animation: spin 28s linear infinite;
    }
    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px dashed rgba(255,255,255,.22);
      animation: spin 14s linear infinite reverse;
    }
    .needle {
      position: absolute;
      left: 50%;
      top: 0;
      width: 5px;
      height: 46%;
      margin-left: -2.5px;
      background: linear-gradient(#fff, #b69cff);
      border-radius: 99px;
      transform-origin: top center;
      animation: spin 5s linear infinite;
      box-shadow: 0 0 18px rgba(182, 156, 255, .8);
    }
    .orb {
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #ff6b6b, #f2a65a, #f7d354, #6fcf97, #56ccf2, #9b5de5, #ff6b6b);
      filter: blur(18px) saturate(1.2);
      opacity: .55;
      mix-blend-mode: screen;
      animation: hue 10s linear infinite;
    }
    .core {
      position: absolute;
      inset: 34%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff, #9b5de5);
      box-shadow: 0 0 34px rgba(255,255,255,.75);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes hue { to { filter: blur(18px) saturate(1.2) hue-rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .compass, .ring, .needle, .orb { animation: none; }
    }
    .go {
      position: absolute;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      color: #0b0d12;
      background: #fff;
      padding: .6rem 1rem;
      border-radius: 99px;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="compass" role="img" aria-label="Animated compass pointing toward the theme filter">
    <div class="ring"></div>
    <div class="orb"></div>
    <div class="needle"></div>
    <div class="core"></div>
  </div>
  <a class="go" href="theme-filter.html">Tune the theme</a>
  <script>
    const compass = document.querySelector('.compass');
    const needle = document.querySelector('.needle');
    const orb = document.querySelector('.orb');
    let hue = 0;
    function frame() {
      hue = (hue + 0.6) % 360;
      compass.style.setProperty('--turn', hue / 360 * 360 + 'deg');
      needle.style.transform = `rotate(${(hue / 360) * 360}deg)`;
      orb.style.filter = `blur(18px) saturate(1.2) hue-rotate(${hue}deg)`;
      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>
