<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timeline Print Filter</title>
  <style>
    @media print {
      .filter-bar { display: block !important; }
    }
    @media screen {
      .filter-bar { display: none; }
    }
    body {
      font-family: Georgia, serif;
      max-width: 46rem;
      margin: 0 auto;
      padding: 2rem;
    }
    .filter-bar {
      margin-bottom: 1rem;
    }
    .swatch {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 1px solid #333;
      margin-right: 4px;
      cursor: pointer;
    }
    .swatch.checked {
      outline: 2px solid #0066cc;
    }
  </style>
</head>
<body>
  <h1>Timeline Print Filter</h1>
  <div class="filter-bar">
    <label><input type="checkbox" class="swatch" data-color="red" style="background:#e94b3c"> Red</label>
    <label><input type="checkbox" class="swatch" data-color="orange" style="background:#f2a65a"> Orange</label>
    <label><input type="checkbox" class="swatch" data-color="yellow" style="background:#f7d354"> Yellow</label>
    <label><input type="checkbox" class="swatch" data-color="green" style="background:#6fcf97"> Green</label>
    <label><input type="checkbox" class="swatch" data-color="blue" style="background:#56ccf2"> Blue</label>
    <label><input type="checkbox" class="swatch" data-color="purple" style="background:#9b5de5"> Purple</label>
  </div>
  <div style="height:8px;margin:-.5rem 0 1rem;border-radius:4px;background:linear-gradient(90deg,#e94b3c 0 16.6%,#f2a65a 16.6% 33.3%,#f7d354 33.3% 50%,#6fcf97 50% 66.6%,#56ccf2 66.6% 83.3%,#9b5de5 83.3%)"></div>
  <p>Check one or more colors before printing to highlight those memories on the timeline.</p>
</body>
</html>
