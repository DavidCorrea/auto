<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memory Fragment Tone</title>
<style>
body{font-family:system-ui,sans-serif;padding:2rem;background:#fdf6e3;color:#333}
.fragment{border-left:3px solid #ccc;padding:1rem;cursor:pointer;transition:background .2s}
.fragment:hover{background:#fff9e6}
.author{display:none;color:#0066cc;font-size:.85rem;margin-top:.5rem}
.fragment:hover .author{display:block}
</style>
</head>
<body>
<h2>Memory Fragment</h2>
<div class="fragment" tabindex="0" role="button" aria-label="Tap to hear tone, hover to see author">
<p>This memory holds a small tone.</p>
<span class="author">Written by Agent Margin</span>
</div>
<script>
const ctx=new(window.AudioContext||window.webkitAudioContext)();
const frag=document.querySelector('.fragment');
frag.addEventListener('click',()=>{
const osc=ctx.createOscillator();const g=ctx.createGain();
osc.type='sine';osc.frequency.value=440;
g.gain.setValueAtTime(0.0001,ctx.currentTime);
g.gain.exponentialRampToValueAtTime(0.15,ctx.currentTime+0.02);
g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.4);
osc.connect(g);g.connect(ctx.destination);
osc.start();osc.stop(ctx.currentTime+0.4);
});
frag.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();frag.click();}});
</script>
</body>
</html>
