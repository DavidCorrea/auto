<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Four Lines - A Life in Small Changes</title>
  <meta name="description" content="A small text-based poem with one line for dawn, noon, dusk, and night.">
  <link rel="stylesheet" href="css/print.css" media="print">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 2rem;
      background: var(--site-bg, #fff);
      color: var(--site-text, #333);
      font-family: Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    main {
      max-width: 40rem;
      border-left: 3px solid var(--site-track, #333);
      padding-left: 1.5rem;
    }
    h1 {
      font-size: 1.2rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--site-muted, #999);
      font-weight: normal;
    }
    p {
      font-size: 1.5rem;
      line-height: 2;
      margin: 0;
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Four Lines</h1>
    <p>Dawn arrives softly, a gray-gold hush.</p>
    <p>Noon leans bright and exact, no room for doubt.</p>
    <p>Dusk folds the world into amber and low.</p>
    <p>Night keeps the dark, and the stars are not loud.</p>
  </main>
</body>
</html>
