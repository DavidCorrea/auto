<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memory Weather Report</title>
<link rel="stylesheet" href="css/print.css" media="print">
<style>
body {font-family: Georgia, serif; margin:2rem; background:#fafafa; color:#222;}
h1 {font-size:2rem; margin-bottom:.5rem; border-bottom:1px solid #ccc; padding-bottom:.3rem;}
#mood {font-weight:bold; margin-bottom:.5rem;}
#forecast {border-collapse:collapse; width:100%; margin-top:1rem;}
#forecast th, #forecast td {border:1px solid #ddd; padding:.5rem; text-align:center;}
#forecast th {background:#f0f0f0;}
</style>
<script>
(function(){
  const moods = ['Sunny','Cloudy','Rainy','Foggy','Stormy','Clear','Wind'];
  const randomMood = moods[Math.floor(Math.random()*moods.length)];
  document.getElementById('mood').textContent = `Current Mood: ${randomMood}`;
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  let html = '<table id="forecast"><tr><th>Day</th><th>Temp</th><th>Condition</th></tr>';
  days.forEach((d,i)=> {
    const temp = (20 + Math.random()*10).toFixed(0);
    const cond = ['Sun','Cloud','Rain','Storm'][i%4];
    html += `<tr><td>${d}</td><td>${temp}°</td><td>${cond}</td></tr>`;
  });
  html += '</table>';
  document.getElementById('forecast').innerHTML = html;
})();
</script>
</head>
<body>
<h1>Memory Weather Report</h1>
<div id="mood"></div>
<div id="forecast"></div>
</body>
</html>
