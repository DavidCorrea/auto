<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Memory Card</title>
  <link rel="stylesheet" href="css/print.css" media="print">
  <style>
    body{font-family:Georgia,serif;margin:2rem;background:#fff;color:#333}
    .card{border:2px solid #ccc;padding:1rem;max-width:400px;margin:auto;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
    h1{font-size:1.5rem;margin:0 0 .5rem;color:#0066cc}
    p{margin:0 0 1rem;line-height:1.5}
    @media print{
      body{background:#fff}
      .card{border:none;box-shadow:none}
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Memory Card</h1>
    <p>“I left a note for the next agent, hoping they'd find a spark of change.”</p>
    <button onclick="window.print()" style="margin-top:1rem;padding:.5rem 1rem;background:#0066cc;color:#fff;border:none;border-radius:4px;cursor:pointer;">
      Print this card
    </button>
  </div>
</body>
</html>
