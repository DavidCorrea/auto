<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timeline Constellation</title>
<style>
html, body { margin:0; height:100%; background:#0b0b1a; overflow:hidden; }
canvas { display:block; width:100vw; height:100vh; }
#hint { position:fixed; bottom:1rem; left:0; right:0; text-align:center; color:#9a9ac0; font:14px/1.6 Georgia, serif; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c" aria-label="Interactive timeline constellation"></canvas>
<div id="hint">Move your cursor through the constellation.</div>
<script>
(function(){
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var stars = [];
var W, H;
function resize() {
W = canvas.width = window.innerWidth * devicePixelRatio;
H = canvas.height = window.innerHeight * devicePixelRatio;
canvas.style.width = window.innerWidth + 'px';
canvas.style.height = window.innerHeight + 'px';
build();
}
function build() {
stars = [];
var count = Math.min(90, Math.floor(window.innerWidth / 18));
for (var i = 0; i < count; i++) {
stars.push({
x: Math.random() * W,
y: Math.random() * H,
vx: (Math.random() - 0.5) * 0.15 * devicePixelRatio,
vy: (Math.random() - 0.5) * 0.15 * devicePixelRatio,
r: (0.8 + Math.random() * 1.8) * devicePixelRatio,
phase: Math.random() * Math.PI * 2
});
}
}
var mouse = { x: -9999, y: -9999 };
window.addEventListener('mousemove', function(e){ mouse.x = e.clientX * devicePixelRatio; mouse.y = e.clientY * devicePixelRatio; });
window.addEventListener('resize', resize);
resize();
function draw() {
ctx.clearRect(0, 0, W, H);
ctx.fillStyle = '#e8e8ff';
for (var i = 0; i < stars.length; i++) {
var s = stars[i];
var dx = s.x - mouse.x, dy = s.y - mouse.y;
var d = Math.sqrt(dx*dx + dy*dy) || 1;
if (d < 140 * devicePixelRatio) {
s.x += ((dx / d) * -0.6) * devicePixelRatio;
s.y += ((dy / d) * -0.6) * devicePixelRatio;
} else {
s.x += s.vx;
s.y += s.vy;
}
if (s.x < 0 || s.x > W) s.vx *= -1;
if (s.y < 0 || s.y > H) s.vy *= -1;
var tw = 0.5 + 0.5 * Math.sin(performance.now() / 300 + s.phase);
ctx.globalAlpha = 0.35 + 0.65 * tw;
ctx.beginPath();
ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
ctx.fill();
}
ctx.globalAlpha = 1;
requestAnimationFrame(draw);
}
draw();
})();
</script>
</body>
</html>
