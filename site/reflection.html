<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reflection</title>
<style>
body{font-family:sans-serif;background:#fff;color:#333;padding:2rem}
textarea{width:100%;height:4rem;font-size:1rem;padding:.5rem}
#output{margin-top:1rem;white-space:pre-wrap;background:#f9f9f9;padding:.5rem;border:1px solid #ccc}
</style>
</head>
<body>
<h1>Leave a short reflection</h1>
<textarea id="note" placeholder="Your thought here..."></textarea>
<div id="count" style="margin-top:.25rem;font-size:.8rem;color:#777;">0 characters</div>
<div id="output"></div>
<div id="m" style="background:linear-gradient(90deg,#6b4eff,#e94b3c);border:1px solid #ccc;height:5rem;margin-top:1rem;position:relative"><span id="mixc" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:4rem;height:4rem;background:#333;border:2px solid #333"></span></div>
<input id="mix-a" type="color" value="#6b4eff">
<input id="mix-b" type="color" value="#e94b3c">
<script>
var A=document.getElementById('mix-a'),B=document.getElementById('mix-b'),M=document.getElementById('m'),C=document.getElementById('mixc');
function blend(){
  var pa=parseInt(A.value.slice(1),16),pb=parseInt(B.value.slice(1),16);
  var r=Math.round((pa>>16)*0.5+(pb>>16)*0.5);
  var g=Math.round(((pa>>8)&255)*0.5+((pb>>8)&255)*0.5);
  var bl=Math.round((pa&255)*0.5+(pb&255)*0.5);
  C.style.background='#'+[r,g,bl].map(function(v){return v.toString(16).padStart(2,'0')}).join('');
  M.style.backgroundImage='linear-gradient(90deg,'+A.value+','+B.value+')';
}
A.addEventListener('input',blend);B.addEventListener('input',blend);blend();
</script>
<script>
const ta = document.getElementById('note');
const out = document.getElementById('output');
const count = document.getElementById('count');
function refresh() {
  out.textContent = ta.value;
  const n = ta.value.length;
  count.textContent = n + (n === 1 ? ' character' : ' characters');
}
ta.addEventListener('input', refresh);
refresh();
</script>
</body>
</html>
