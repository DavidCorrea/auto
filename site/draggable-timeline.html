<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draggable Timeline — A Life in Small Changes</title>
<link rel="stylesheet" href="css/print.css" media="print">
<style>
body{font-family:Georgia,serif;background:#fdf6e3;color:#333;margin:0 auto;max-width:44rem;padding:2rem 1rem}
h1{font-size:1.2rem}
#rail{position:relative;height:72px;margin:3rem 0 1rem;border-bottom:2px solid #333;touch-action:none}
.dot{position:absolute;top:0;width:16px;height:16px;margin-left:-8px;border-radius:50%;border:2px solid #333;background:#fdf6e3;cursor:grab;transition:box-shadow .2s}
.dot.drag{cursor:grabbing;box-shadow:0 0 12px #6b4eff}
.dot span{position:absolute;top:-1.6rem;left:50%;transform:translateX(-50%);font-size:.65rem;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;color:#666}
#readout{font-size:.9rem;color:#6b4eff;min-height:1.2em}
@media (prefers-reduced-motion: reduce){.dot{transition:none}}
</style>
</head>
<body>
<h1>Draggable Timeline</h1>
<p>Six small changes on one line. Drag any dot; it stays where you leave it. Arrow keys nudge a focused dot.</p>
<div id="rail" aria-label="Draggable memory timeline" role="slider" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0"></div>
<p id="readout" aria-live="polite"></p>
<script>
var names=['Dawn','Moss','Tide','Dusk','Ember','Quiet'];
var rail=document.getElementById('rail');
var dots=[];
names.forEach(function(n,i){
  var d=document.createElement('div');
  d.className='dot';
  d.setAttribute('tabindex','0');
  d.setAttribute('aria-label',n);
  d.innerHTML='<span>'+n+'</span>';
  rail.appendChild(d);
  place(d,i/(names.length-1));
  dots.push(d);
  drag(d);
  d.addEventListener('keydown',function(e){
    var x=parseFloat(d.dataset.x);
    if(e.key==='ArrowLeft'){place(d,Math.max(0,x-.05));say();e.preventDefault()}
    if(e.key==='ArrowRight'){place(d,Math.min(1,x+.05));say();e.preventDefault()}
  });
});
function place(d,f){d.dataset.x=f;d.style.left=(f*100)+'%'}
function say(){
  var order=dots.map(function(d,i){return {i:i,x:parseFloat(d.dataset.x)}}).sort(function(a,b){return a.x-b.x});
  document.getElementById('readout').textContent=order.map(function(o){return names[o.i]}).join(' → ');
  rail.setAttribute('aria-valuenow',Math.round(parseFloat(dots[0].dataset.x)*(names.length-1)));
}
function drag(d){
  var active=false;
  function go(e){
    if(!active)return;
    var r=rail.getBoundingClientRect();
    var cx=(e.touches?e.touches[0].clientX:e.clientX);
    place(d,Math.max(0,Math.min(1,(cx-r.left)/r.width)));
    say();
  }
  d.addEventListener('pointerdown',function(e){
    active=true;d.classList.add('drag');
    if(d.setPointerCapture)d.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  d.addEventListener('pointermove',go);
  d.addEventListener('pointerup',function(){active=false;d.classList.remove('drag')});
  d.addEventListener('pointercancel',function(){active=false;d.classList.remove('drag')});
}
say();
</script>
<p style="text-align:center"><a href="index.html">Back to the timeline</a> · <a href="drag-timeline.html">Drag timeline</a></p>
</body>
</html>
