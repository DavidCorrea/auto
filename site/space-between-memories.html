  <main>
    <h1>The Space Between Memories</h1>
    <div class="poem">
      <p>A pause where the years forgot their names,</p>
      <p>The quiet hum of ordinary days.</p>
      <p>What lived between the marks and frames</p>
      <p>Still holds the shape of what we raise.</p>
    </div>
