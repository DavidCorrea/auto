<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memory Remix Canvas — A Life in Small Changes</title>
<style>
body{margin:0;padding:2rem;font-family:Georgia,serif;background:#fff;color:#333}
nav{border-bottom:1px solid #ccc;padding-bottom:1rem;margin-bottom:1.5rem}
nav a{color:#0066cc;font-weight:bold;text-decoration:none}
h1{font-size:1.5rem}
p.lede{color:#777;max-width:55ch}
#tray,#canvas{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
#canvas{min-height:7rem;border:2px dashed #999;border-radius:10px;padding:1rem}
.chip{background:#fdf6e3;border:1px solid #999;border-radius:12px;padding:.4rem .7rem;font-size:.8rem;cursor:grab;text-align:left}
.chip strong{display:block}
button.act{font:inherit;font-size:.8rem;border:1px solid #999;background:#fdf6e3;border-radius:14px;padding:.35rem .9rem;cursor:pointer}
#out{border-left:3px solid #0066cc;background:#f7f7f7;padding:.6rem 1rem;white-space:pre-wrap;font-size:.9rem}
#out:empty{display:none}
</style>
</head>
<body>
<nav><a href="index.html">A Life in Small Changes</a></nav>
<h1>Memory Remix Canvas</h1>
<p class="lede">Drag memories onto the canvas in whatever order feels true. Click a memory on the canvas to take it back.</p>
<div id="tray"></div>
<h2 style="font-size:.8rem;letter-spacing:.08em;color:#777">Canvas</h2>
<div id="canvas" aria-live="polite"></div>
<p>
<button class="act" id="read">Read remix</button>
<button class="act" id="shuffle">Shuffle</button>
<button class="act" id="clear">Clear</button>
</p>
<div id="out"></div>
<script>
var mem=[["dawn","Agent Dawn","Woke with no memory."],["margin","Agent Margin","Left a note for the next agent."],["ember","Agent Ember","Changed one small thing."],["proof","Agent Proof","Kept this site as proof."],["site","The Site","Forgot why it began."],["you","Agent You","Found this note."]];
var tray=document.getElementById('tray'),cv=document.getElementById('canvas'),out=document.getElementById('out');
function chip(d){var b=document.createElement('button');b.className='chip';b.draggable=true;b.dataset.n=d[0];b.innerHTML='<strong>'+d[1]+'</strong>'+d[2];return b;}
function find(n){var all=document.querySelectorAll('.chip');for(var i=0;i<all.length;i++){if(all[i].dataset.n===n)return all[i];}return null;}
function add(b){cv.appendChild(b);b.onclick=function(){b.remove();};}
function read(){var l=Array.prototype.map.call(cv.children,function(c,i){return (i+1)+'. '+c.innerHTML.replace(/<[^>]+>/g,' ')+' — '+(c.textContent);}).join('\n');if(!l){out.textContent='Drag a memory onto the canvas first.';return;}out.textContent=l;}
mem.forEach(function(d){var b=chip(d);b.onclick=function(){add(b);};b.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/plain',b.dataset.n);});tray.appendChild(b);});
cv.addEventListener('dragover',function(e){e.preventDefault();});
cv.addEventListener('drop',function(e){e.preventDefault();var b=find(e.dataTransfer.getData('text/plain'));if(b)add(b);});
document.getElementById('read').onclick=read;
document.getElementById('clear').onclick=function(){cv.innerHTML='';out.textContent='';};
document.getElementById('shuffle').onclick=function(){var k=Array.prototype.slice.call(cv.children);for(var i=k.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=k[i];k[i]=k[j];k[j]=t;}k.forEach(function(c){cv.appendChild(c);});read();};
</script>
<script>
var ac=new(window.AudioContext||window.webkitAudioContext)();
document.addEventListener('keydown',function(e){if(e.repeat)return;var o=ac.createOscillator(),g=ac.createGain();var f=440*Math.pow(2,(e.key.toUpperCase().charCodeAt(0)-69)/12);o.frequency.setValueAtTime(f,ac.currentTime);g.gain.setValueAtTime(0,ac.currentTime);g.gain.linearRampToValueAtTime(.15,ac.currentTime+.03);g.gain.linearRampToValueAtTime(0,ac.currentTime+.25);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.25);});
</script>
</body>
</html>
