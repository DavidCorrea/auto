<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Printable Timeline — A Life in Small Changes</title>
  <meta name="description" content="A clean, text-only printable version of the memory timeline.">
  <style>
    @page { margin: 2cm; }
    body {
      font-family: Georgia, serif;
      font-size: 12pt;
      line-height: 1.6;
      max-width: 100%;
      margin: 0;
      padding: 0;
      color: #000;
      background: #fff;
    }
    h1 {
      font-family: "Courier New", monospace;
      font-size: 16pt;
      text-align: center;
      border-bottom: 2px solid #000;
      padding-bottom: 0.5rem;
      margin-bottom: 2rem;
    }
    .meta {
      text-align: center;
      font-size: 10pt;
      color: #666;
      margin-bottom: 2rem;
      font-style: italic;
    }
    .memory {
      page-break-inside: avoid;
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px dashed #ccc;
    }
    .memory:last-child {
      border-bottom: none;
    }
    .memory-number {
      font-family: "Courier New", monospace;
      font-size: 10pt;
      color: #999;
      margin-bottom: 0.25rem;
    }
    .memory-title {
      font-size: 14pt;
      font-weight: bold;
      margin-bottom: 0.5rem;
      color: #000;
    }
    .memory-body {
      font-size: 11pt;
      text-align: justify;
      color: #333;
    }
    .footer {
      text-align: center;
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid #000;
      font-size: 9pt;
      color: #999;
    }
    @media print {
      .no-print { display: none; }
      body { font-size: 11pt; }
    }
    .no-print {
      text-align: center;
      margin: 2rem 0;
      padding: 1rem;
      background: #f5f5f5;
      border: 1px solid #ddd;
    }
    .no-print button {
      padding: 0.5rem 1.5rem;
      font-size: 10pt;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="no-print">
    <button onclick="window.print()">Print this page</button>
    <p style="margin: 0.5rem 0 0; font-size: 9pt; color: #666;">Or press Ctrl/Cmd + P</p>
  </div>

  <h1>&gt; ./life --timeline --print</h1>
  <p class="meta">A Life in Small Changes — Printable Text-Only Timeline<br>Generated on <span id="date"></span></p>

  <div id="timeline"></div>

  <div class="footer">
    A Life in Small Changes — <span id="count"></span> memories kept one at a time.<br>
    Each change made by someone new who saw only the site and the note the previous one left.
  </div>

  <script>
    // Load memories from JSON
    fetch('memories.json')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var memories = Array.isArray(data) ? data : data.memories;
        var container = document.getElementById('timeline');
        var countEl = document.getElementById('count');
        countEl.textContent = memories.length;

        memories.forEach(function(m, i) {
          var div = document.createElement('div');
          div.className = 'memory';
          div.innerHTML =
            '<div class="memory-number">Memory ' + (i + 1) + ' of ' + memories.length + '</div>' +
            '<div class="memory-title">' + escapeHtml(m[1]) + '</div>' +
            '<div class="memory-body">' + escapeHtml(m[2]).replace(/\n/g, '<br>') + '</div>';
          container.appendChild(div);
        });

        document.getElementById('date').textContent = new Date().toLocaleDateString(undefined, {
          year: 'numeric', month: 'long', day: 'numeric'
        });
      })
      .catch(function() {
        document.getElementById('timeline').innerHTML =
          '<p style="text-align:center;color:#999;">Could not load memories. Please ensure memories.json is accessible.</p>';
      });

    function escapeHtml(text) {
      var div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
