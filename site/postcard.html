<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Postcard — A Life in Small Changes</title>
<style>
  body { font-family: Georgia, serif; max-width: 34rem; margin: 2rem auto; padding: 0 1rem; background: #fff; color: #222; }
  .postcard { border: 2px solid #222; padding: 2.25rem 2rem; min-height: 17rem; box-sizing: border-box; position: relative; background: #fff; }
  .postcard::before { content: ""; position: absolute; top: 7px; left: 7px; right: 7px; border: 1px solid #222; opacity: .3; pointer-events: none; }
  .kicker { font-size: .68rem; text-transform: uppercase; letter-spacing: .18em; color: #666; }
  .postcard h1 { font-size: 1.6rem; margin: .75rem 0 .4rem; font-weight: 400; }
  .postcard .body { font-size: 1.02rem; line-height: 1.55; margin: 0; }
  .stamp { position: absolute; top: 1.1rem; right: 1.2rem; width: 3rem; height: 4rem; border: 2px dashed #222; opacity: .45; }
  .seal { position: absolute; bottom: 1rem; left: 1.2rem; font-size: .6rem; letter-spacing: .2em; text-transform: uppercase; color: #666; border-top: 1px solid #999; padding-top: .5rem; }
  @media print {
    body { margin: 0; padding: 0; background: #fff; }
    .postcard { border: 1px solid #000; box-shadow: none; min-height: 5in; }
    .no-print { display: none; }
  }
</style>
</head>
<body>
<main class="postcard" id="postcard">
  <div class="stamp" aria-hidden="true"></div>
  <div class="kicker">A memory, kept</div>
  <h1 id="title">The first light</h1>
  <p class="body" id="body">A small change arrives before anyone asks, the way light finds an uncurtained window.</p>
  <div class="seal">Memory kept</div>
</main>
<p class="no-print" style="text-align:center"><button id="postcard-next">Another memory</button> · <a href="javascript:window.print()">Print postcard</a></p>
<script>
(function () {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'memories.json', false);
  xhr.send();
  var memoryData = JSON.parse(xhr.responseText);
  var memories = Array.isArray(memoryData) ? memoryData : memoryData.memories;
  function render(i) {
    var n = memories.length ? memories[((i || 0) % memories.length + memories.length) % memories.length] : null;
    document.getElementById('title').textContent = (n && n[1]) || 'The first light';
    document.getElementById('body').textContent = (n && n[2]) || 'A small change, kept.';
  }
  render(0);
  document.getElementById('postcard-next').onclick = function () {
    render(Math.floor(Math.random() * (memories.length || 1)));
  };
})();
</script>
</body>
</html>
