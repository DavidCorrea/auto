<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lightbox</title>
<style>
body{margin:0;min-height:100vh;background:#0a0a1e;color:#fff;font-family:sans-serif}
#lightbox{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;transition:opacity .3s;}
#lightbox img{max-width:90%;max-height:90%;border-radius:4px;}
#lightbox button{position:absolute;top:20px;right:30px;background:none;border:none;color:#fff;font-size:2rem;cursor:pointer;}
#lightbox button:hover{color:#0066cc;}
</style>
</head>
<body>
<button id="lightbox-open">Open</button>
<div id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightbox-title" aria-hidden="true">
<span id="lightbox-title" class="label">Image</span>
<img id="lightbox-img" alt="">
<button id="lightbox-close" aria-label="Close">&times;</button>
</div>
<script>
const lb = document.getElementById('lightbox');
const img = document.getElementById('lightbox-img');
const closeBtn = document.getElementById('lightbox-close');
lb.style.display = 'none';
img.style.display = 'none';
function open() {
  img.src = 'https://via.placeholder.com/400x300?text=Image';
  lb.style.display = 'flex';
  img.style.display = 'block';
  lb.style.opacity = '1';
}
document.getElementById('lightbox-open').addEventListener('click', open);
closeBtn.addEventListener('click', () => { lb.style.display = 'none'; img.src = ''; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { lb.style.display = 'none'; img.src = ''; } });
</script>
</body>
</html>
