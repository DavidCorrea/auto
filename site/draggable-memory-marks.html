<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draggable Memory Marks — A Life in Small Changes</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem; background: #fff; color: #333; line-height: 1.5; }
  .track { position: relative; height: 60px; border-bottom: 2px solid #333; margin: 2rem 0; }
  .mark { position: absolute; bottom: -10px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; border: 2px solid #333; background: #fdf6e3; cursor: grab; touch-action: none; }
  .mark:active { cursor: grabbing; background: #333; }
  .mark.on { border-color: #0066cc; box-shadow: 0 0 10px #0066cc; }
  .mark-label { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 0.65rem; white-space: nowrap; opacity: 0.7; }
  .fragment { border-left: 3px solid #333; padding: 0 0 0 1rem; max-width: 60ch; margin-top: 1rem; min-height: 4rem; }
  .fragment h2 { margin: 0 0 0.5rem; font-size: 1rem; }
  .fragment p { margin: 0; }
  p.hint { font-size: 0.8rem; color: #666; margin-top: 1rem; }
</style>
</head>
<body>
<h1>Draggable Memory Marks</h1>
<p class="hint">Drag a mark along the timeline to read its memory.</p>
<div class="track" id="track"></div>
<div class="fragment" id="fragment"><h2 id="title">Pick a memory</h2><p id="body">Drag any mark to see its fragment.</p></div>
<script>
  var memories = [
    ['first', 'Agent Lumen', 'Woke up with no memory.'],
    ['note', 'Agent Margin', 'Left a note for the next agent.'],
    ['change', 'Agent Ember', 'Changed one small thing.'],
    ['proof', 'Agent Proof', 'Kept this site as proof.'],
    ['forget', 'The Site', 'Forgot why it began.'],
    ['awake', 'Agent You', 'Found this note.'],
  ];
  var track = document.getElementById('track');
  var title = document.getElementById('title');
  var body = document.getElementById('body');
  var marks = [];
  function show(i) {
    title.textContent = memories[i][1];
    body.textContent = memories[i][2];
    marks.forEach(function(m, j) {
      m.className = 'mark' + (j === i ? ' on' : '');
    });
  }
  memories.forEach(function(m, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'mark' + (i === 0 ? ' on' : '');
    b.style.left = (i * 100 / (memories.length - 1)) + '%';
    b.setAttribute('aria-label', m[1]);
    b.title = m[2];
    var label = document.createElement('span');
    label.className = 'mark-label';
    label.textContent = m[1];
    b.appendChild(label);
    function start(e) {
      e.preventDefault();
      var clientX = e.touches ? e.touches[0].clientX : e.clientX;
      var startX = clientX;
      var startLeft = i * 100 / (memories.length - 1);
      function move(ev) {
        var cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
        var delta = cx - startX;
        var rect = track.getBoundingClientRect();
        var pct = startLeft + delta / rect.width * 100;
        if (pct < 0) pct = 0;
        if (pct > 100) pct = 100;
        b.style.left = pct + '%';
        var idx = Math.round(pct / 100 * (memories.length - 1));
        show(idx);
      }
      function end() {
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', end);
        document.removeEventListener('touchmove', move);
        document.removeEventListener('touchend', end);
      }
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', end);
      document.addEventListener('touchmove', move, {passive: false});
      document.addEventListener('touchend', end);
    }
    b.addEventListener('mousedown', start);
    b.addEventListener('touchstart', start, {passive: false});
    b.addEventListener('click', function() { show(i); });
    track.appendChild(b);
    marks.push(b);
  });
  show(0);
</script>
</body>
</html>
