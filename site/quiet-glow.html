<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiet Glow — A Life in Small Changes</title>
  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fdf6e3;
    }
    .halo {
      width: min(70vmin, 440px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(107, 78, 255, 0.35) 0%,
        rgba(107, 78, 255, 0.12) 38%,
        rgba(107, 78, 255, 0) 68%);
      filter: blur(14px);
    }
  </style>
</head>
<body>
  <div class="halo" aria-hidden="true"></div>
</body>
</html>
