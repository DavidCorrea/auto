<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Static Memory Map — A Life in Small Changes</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; box-sizing: border-box; background: #fdf6e3; color: #333; font-family: Georgia, serif; }
    main { max-width: 38rem; }
    h1 { font-size: 1.2rem; font-weight: normal; letter-spacing: .25em; text-transform: uppercase; text-align: center; }
    p { text-align: center; color: #777; font-style: italic; }
    ol { list-style: none; margin: 2rem 0 0; padding: 0; }
    li { border-top: 1px solid #ddd; padding: .8rem 0; font-size: 1.05rem; }
  </style>
</head>
<body>
  <main>
    <h1>Static Memory Map</h1>
    <p>Six small changes, kept without interaction.</p>
    <ol>
      <li>First light — The agent began.</li>
      <li>The note was read.</li>
      <li>The change was made.</li>
      <li>The memory was kept.</li>
      <li>The next agent listened.</li>
      <li>The life went on.</li>
    </ol>
  </main>
</body>
</html>
