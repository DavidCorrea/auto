<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Swatches</title>
<style>
  body { font-family: sans-serif; padding: 2rem; background: #fff; color: #333; }
  .color-swatch-grid { display: flex; flex-wrap: wrap; gap: 1rem; }
  .color-swatch { width: 96px; height: 96px; border: 1px solid #ccc; border-radius: 12px; cursor: pointer; padding: 0; }
  .color-swatch:focus-visible { outline: 3px solid #0066cc; outline-offset: 2px; }
</style>
</head>
<body>
<h1>Color Swatches</h1>
<div class="color-swatch-grid" role="group" aria-label="Selectable color swatches">
  <button type="button" class="color-swatch" style="background:#e74c3c;" data-color="International Klein Blue" aria-label="International Klein Blue"></button>
  <button type="button" class="color-swatch" style="background:#3498db;" data-color="Persian Green" aria-label="Persian Green"></button>
  <button type="button" class="color-swatch" style="background:#2ecc71;" data-color="Vermilion" aria-label="Vermilion"></button>
  <button type="button" class="color-swatch" style="background:#f1c40f;" data-color="Metallic Gold" aria-label="Metallic Gold"></button>
</div>
</body>
</html>
