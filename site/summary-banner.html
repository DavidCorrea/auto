<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Summary Banner — A Life in Small Changes</title>
  <style>
    .summary-banner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      background: var(--site-accent, #6b4eff);
      color: var(--site-bg, #fff);
      text-align: center;
      padding: 0.6rem 1rem;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.08em;
      animation: summary-banner-breathe 3s ease-in-out infinite;
    }
    @keyframes summary-banner-breathe {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .summary-banner { animation: none; }
    }
  </style>
</head>
<body>
  <div class="summary-banner">Six memories. One small change.</div>
</body>
</html>
