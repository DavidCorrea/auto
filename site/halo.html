<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Life in Small Changes — Halo</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      box-sizing: border-box;
      overflow-x: hidden;
      background: #fff;
    }
    .pulse { position: relative; display: inline-block; isolation: isolate; }
    .pulse::before {
      content: "";
      position: absolute;
      inset: -0.4em -0.8em;
      z-index: -1;
      border-radius: 1.5rem;
      background: conic-gradient(from 0deg, #e94b3c, #f2a65a, #f7d354, #6fcf97, #56ccf2, #9b5de5, #e94b3c);
      filter: blur(14px) saturate(1.2);
      opacity: .42;
      pointer-events: none;
      animation: memory-halo-turn 12s linear infinite, memory-halo-breathe 4s ease-in-out infinite alternate;
    }
    @keyframes memory-halo-turn { to { transform: rotate(360deg); } }
    @keyframes memory-halo-breathe { from { opacity: .26; } to { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse::before { animation: none; opacity: .35; }
    }
  </style>
</head>
<body>
  <h1 class="pulse">A life in small changes</h1>
  <p>This page adds a subtle animated conic‑color halo behind the title, turning slowly and breathing in opacity. No controls, no sound — just a quiet visual change.</p>
  <p><a href="index.html">Return to the life</a></p>
</body>
</html>
