<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Constellation Hover — A Life in Small Changes</title>
  <style>
    html,body{margin:0;padding:0;background:#050510;height:100%;overflow:hidden}
    canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
  </style>
</head>
<body>
  <canvas id="c" aria-label="Interactive constellation"></canvas>
  <script>
    (function(){
      var cv = document.getElementById('c');
      var ctx = cv.getContext('2d');
      var stars = [], t = 0, hovered = null;
      function resize(){ cv.width = window.innerWidth; cv.height = window.innerHeight; }
      window.addEventListener('resize', resize);
      resize();
      function rand(seed){ var s = seed; return function(){ var x = Math.sin(s++) * 10000; return x - Math.floor(x); }; }
      function build(){
        var r = rand(Math.floor(Math.random() * 10000));
        var n = 9;
        stars = [];
        for (var i = 0; i < n; i++) stars.push({x: r() * cv.width, y: r() * cv.height, vx: (r() - 0.5) * 0.2, vy: (r() - 0.5) * 0.2, rad: 0.8 + r() * 1.2});
      }
      function draw(){
        t += 0.004;
        ctx.clearRect(0, 0, cv.width, cv.height);
        ctx.strokeStyle = 'rgba(140, 150, 255, 0.22)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (var i = 0; i < stars.length; i++) for (var j = i + 1; j < stars.length; j++) {
          var dx = stars[i].x - stars[j].x, dy = stars[i].y - stars[j].y;
          if (dx * dx + dy * dy < 110 * 110) { ctx.moveTo(stars[i].x, stars[i].y); ctx.lineTo(stars[j].x, stars[j].y); }
        }
        ctx.stroke();
        ctx.fillStyle = '#e8eefd';
        for (var i = 0; i < stars.length; i++) {
          var s = stars[i];
          s.x += s.vx; s.y += s.vy;
          if (s.x < 0 || s.x > cv.width) s.vx *= -1;
          if (s.y < 0 || s.y > cv.height) s.vy *= -1;
          var isHover = hovered === i;
          ctx.globalAlpha = isHover ? 1 : 0.45 + 0.55 * Math.sin(t * 2 + i);
          ctx.beginPath(); ctx.arc(s.x, s.y, isHover ? s.rad * 2.2 : s.rad, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      function loop(){ requestAnimationFrame(draw); }
      function pick(e){
        var r = cv.getBoundingClientRect();
        var x = e.clientX - r.left, y = e.clientY - r.top;
        var best = null, bd = 900;
        for (var i = 0; i < stars.length; i++) {
          var dx = stars[i].x - x, dy = stars[i].y - y;
          var d = dx * dx + dy * dy;
          if (d < bd) { bd = d; best = i; }
        }
        return best;
      }
      canvas.addEventListener('mousemove', function(e){ hovered = pick(e); });
      canvas.addEventListener('mouseleave', function(){ hovered = null; });
      build();
      loop();
    })();
  </script>
</body>
</html>
