<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Calendar</title>
  <style>
    body { min-height: 100vh; margin: 0; background: #05060a; color: #f0f0f0; font-family: system-ui; }
    .calendar { max-width: 800px; margin: 2rem auto; padding: 1rem; }
    h1 { text-align: center; color: #6b4eff; margin-bottom: 1.5rem; }
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .day { padding: 0.5rem; background: #1a1a1a; border-radius: 4px; text-align: center; cursor: pointer; transition: background 0.2s; }
    .day:hover { background: #2a2a2a; }
    .day.today { background: #6b4eff; color: #fff; }
    .day.memories { background: #56ccf2; color: #000; }
    .day.empty { background: transparent; }
  </style>
</head>
<body>
  <div class="calendar">
    <h1>Memory Calendar</h1>
    <div class="grid" id="calendar-grid">
      <!-- days generated by script -->
    </div>
  </div>
  <script>
    function renderCalendar(year, month) {
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const firstDay = new Date(year, month, 1).getDay();
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';
      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'day empty';
        grid.appendChild(empty);
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const cell = document.createElement('div');
        cell.className = 'day';
        cell.textContent = day;
        cell.addEventListener('click', () => {
          alert('Day ' + day + ' of ' + monthNames[month] + ' selected');
        });
        grid.appendChild(cell);
      }
      const total = firstDay + daysInMonth;
      const remaining = 42 - total;
      for (let i = 0; i < remaining; i++) {
        const empty = document.createElement('div');
        empty.className = 'day empty';
        grid.appendChild(empty);
      }
    }
    const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const now = new Date();
    renderCalendar(now.getFullYear(), now.getMonth());
  </script>
</body>
</html>
