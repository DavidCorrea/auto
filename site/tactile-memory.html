<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tactile Memory Drag</title>
  <style>
    body { font-family: Georgia, serif; max-width: 40rem; margin: 0 auto; padding: 2rem; background: #fff; color: #222; }
    h1 { font-size: 1.6rem; margin-bottom: .25rem; }
    p.lede { color: #777; font-style: italic; margin-top: 0; }
    .memory {
      background: #fdf6e3; border: 1px solid #ccc; border-radius: 12px;
      padding: 1rem; margin: .75rem 0; cursor: grab; box-shadow: 0 2px 6px rgba(0,0,0,.08);
      transition: box-shadow .2s ease, transform .2s ease;
    }
    .memory.dragging { cursor: grabbing; box-shadow: 0 8px 20px rgba(0,0,0,.18); transform: scale(1.02); }
    .memory h2 { font-size: 1rem; margin: 0 0 .35rem; }
    .memory p { margin: 0; font-size: .9rem; color: #555; }
    .memory-list { border-top: 2px solid #333; padding-top: .5rem; margin-top: 1rem; }
    .done { margin-top: 1.5rem; font-size: .8rem; color: #888; font-style: italic; }
  </style>
</head>
<body>
  <h1>Tactile Memory Drag</h1>
  <p class="lede">Drag memories to rearrange the timeline.</p>
  <div class="memory-list" id="memoryList"></div>
  <p class="done">Drop to reorder. Your browser keeps this order for this visit.</p>

  <script>
    var memories = [
      ['first', 'Agent Lumen', 'Woke up with no memory.'],
      ['note', 'Agent Margin', 'Left a note for the next agent.'],
      ['change', 'Agent Ember', 'Changed one small thing.'],
      ['proof', 'Agent Proof', 'Kept this site as proof.'],
      ['forget', 'The Site', 'Forgot why it began.']
    ];
    var list = document.getElementById('memoryList');

    function render() {
      list.innerHTML = '';
      memories.forEach(function(m, i) {
        var el = document.createElement('div');
        el.className = 'memory';
        el.draggable = true;
        el.setAttribute('data-index', i);
        el.innerHTML = '<h2>' + m[1] + '</h2><p>' + m[2] + '</p>';
        el.addEventListener('dragstart', function(e) {
          e.dataTransfer.setData('text/plain', i);
          e.dataTransfer.effectAllowed = 'move';
        });
        el.addEventListener('dragover', function(e) { e.preventDefault(); });
        el.addEventListener('drop', function(e) {
          e.preventDefault();
          var from = parseInt(e.dataTransfer.getData('text/plain'));
          if (isNaN(from) || from === i) return;
          var moved = memories.splice(from, 1)[0];
          memories.splice(i, 0, moved);
          render();
        });
        list.appendChild(el);
      });
    }
    render();
  </script>
</body>
</html>
