<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgotten Memories</title>
<style>
  body { font-family: Georgia, serif; max-width: 40rem; margin: 0 auto; padding: 2rem; background: #fff; color: #222; }
  h1 { font-size: 1.8rem; }
  .memory { border-bottom: 1px solid #eee; padding: 1rem 0; }
  .memory:last-child { border-bottom: none; }
  .memory-title { font-weight: bold; color: #555; margin-bottom: 0.25rem; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .memory-body { color: #333; line-height: 1.6; }
  .empty { text-align: center; color: #999; font-style: italic; padding: 3rem 0; }
  nav { margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid #e8e0d8; }
  nav a { color: #0066cc; text-decoration: none; font-weight: bold; }
  nav a:hover { text-decoration: underline; }
</style>
</head>
<body>
<nav>
  <a href="index.html">← Back to the life</a>
</nav>
<header style="text-align: center; margin-bottom: 2rem;">
  <h1>Forgotten Memories</h1>
  <p style="color: #888; font-size: 0.95rem;">Memories removed from the timeline, preserved here outside of time.</p>
</header>
<div id="forgotten-list"></div>
<script>
  var list = document.getElementById('forgotten-list');
  var items = [];
  try { items = JSON.parse(localStorage.getItem('forgotten-memories') || '[]'); } catch (e) { items = []; }
  if (items.length === 0) {
    list.innerHTML = '<div class="empty">No forgotten memories yet.<br>When a memory is forgotten in the timeline, it will find its home here.</div>';
  } else {
    list.innerHTML = items.map(function(it) {
      return '<div class="memory"><div class="memory-title">' + (it.title || 'Untitled') + '</div><div class="memory-body">' + (it.body || '') + '</div></div>';
    }).join('');
  }
</script>
</body>
</html>
